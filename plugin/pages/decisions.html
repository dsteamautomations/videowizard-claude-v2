<title>VideoWizard Decisions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* design/204. Layout: a sticky progress bar, then one block per line of the step; the Direction first and alone, the gaps after it.
   The page is a form: the lines come from the newest document of `rounds`; the operator's answers are written under that round. */
:root{
  --bg:#f5f7f8; --surface:#ffffff; --fg:#17212b; --muted:#566574; --line:#d6dde3;
  --accent:#0f6e8c; --accent-soft:#e2f1f5;
  --ok:#1b6b45; --ok-soft:#e0f3e8; --chg:#8a5200; --chg-soft:#fdf0d6; --stop:#a3261d; --stop-soft:#fbe6e3;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif; --body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10161c; --surface:#18212a; --fg:#e6edf3; --muted:#9db0c0; --line:#2c3944;
  --accent:#5cc4e0; --accent-soft:#143440;
  --ok:#7fd6a6; --ok-soft:#123424; --chg:#f2c063; --chg-soft:#3a2c0c; --stop:#ff9b90; --stop-soft:#42201c; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#18212a; --fg:#e6edf3; --muted:#9db0c0; --line:#2c3944;
  --accent:#5cc4e0; --accent-soft:#143440;
  --ok:#7fd6a6; --ok-soft:#123424; --chg:#f2c063; --chg-soft:#3a2c0c; --stop:#ff9b90; --stop-soft:#42201c; color-scheme:dark }
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.15rem} h4{font-size:.95rem}
h3{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
p{margin:0}
.lead{color:var(--muted)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.75rem;font-weight:600;color:var(--muted);background:var(--bg);font-variant-numeric:tabular-nums}
.dot.ans{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.dot.chg{background:var(--chg-soft);color:var(--chg);border-color:var(--chg)}
.dot.rec{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.bar .msg{margin-left:auto;font-size:.9rem;color:var(--muted)}
#list{display:flex;flex-direction:column;gap:18px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.head{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.tag{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap}
.t-open{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.t-ans{background:var(--ok-soft);color:var(--ok)} .t-chg{background:var(--chg-soft);color:var(--chg)}
.t-rec{background:var(--ok);color:var(--surface)}
.body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.group{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:4px 12px}
.kv dt{color:var(--muted);font-size:.86rem} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.changed{background:var(--chg-soft);color:var(--chg);border-radius:8px;padding:10px 12px;font-size:.92rem}
.changed ul,.note ul{margin:6px 0 0;padding-left:1.2em}
.note{background:var(--stop-soft);color:var(--stop);border-radius:8px;padding:10px 12px;font-size:.92rem}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.edit{flex:1 1 100%;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font-family:var(--body);font-size:.92rem;font-weight:600;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
button.go{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{width:100%;min-height:76px;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);box-sizing:border-box}
.said,.count{font-size:.9rem;color:var(--muted)}
.state{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);text-align:center}
@media (max-width:520px){ .kv{grid-template-columns:1fr} .kv dt{margin-top:4px} }
/* design/206: a plan gap's shots as a table; on a narrow screen each shot becomes a small block with its labels */
.item{scroll-margin-top:76px}
.dot{cursor:pointer}
.totals{font-weight:600}
.tw{overflow-x:auto}
table.shots{width:100%;border-collapse:collapse;font-size:.9rem}
table.shots th,table.shots td{text-align:left;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
table.shots th{font-size:.74rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
table.shots td:nth-child(1){color:var(--muted);font-variant-numeric:tabular-nums} table.shots td:nth-child(2){font-weight:600}
table.shots td:nth-child(3),table.shots td:nth-child(4){white-space:nowrap;font-variant-numeric:tabular-nums}
table.shots tr:last-child td{border-bottom:0}
@media (max-width:640px){
  table.shots thead{display:none} table.shots tr{display:block;padding:8px 0;border-bottom:1px solid var(--line)} table.shots tr:last-child{border-bottom:0}
  table.shots td{display:grid;grid-template-columns:104px 1fr;gap:8px;border:0;padding:2px 0;white-space:normal !important}
  table.shots td::before{content:attr(data-l);color:var(--muted);font-size:.8rem;font-weight:400} }
/* design/205: a rough sample of each motion style, played in a small frame in the film's shape */
.stage{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;max-width:420px;aspect-ratio:16/9;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:16px;box-sizing:border-box}
.stage.tall{aspect-ratio:9/16;max-width:200px}
.stage .s-title{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.15}
.stage .s-words{font-size:.82rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stage .s-bars{display:flex;align-items:flex-end;gap:8px;height:34%}
.stage .s-bars i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;transform-origin:bottom}
.stage .s-bars i:nth-child(1){height:45%} .stage .s-bars i:nth-child(2){height:80%} .stage .s-bars i:nth-child(3){height:60%}
.stage .s-rule{height:2px;background:var(--fg);transform-origin:left}
.prev{display:flex;flex-direction:column;gap:8px}
.prev .row button.on{border-color:var(--accent);color:var(--accent)}
@keyframes mRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes mSide{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes mSlam{from{opacity:0;transform:scale(1.7)}to{opacity:1;transform:none}}
@keyframes mDraw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes mMask{from{clip-path:inset(100% 0 0 0);letter-spacing:.12em}to{clip-path:inset(0 0 0 0);letter-spacing:0}}
@keyframes mDrop{0%{opacity:0;transform:translateY(-60px) scaleY(1.1)}60%{opacity:1;transform:translateY(0) scaleY(.82)}80%{transform:translateY(-8px) scaleY(1.05)}100%{opacity:1;transform:none}}
@keyframes mGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes mRule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes mHero{from{opacity:0;transform:scale(1.14)}to{opacity:1;transform:none}}
@keyframes mPan{from{transform:translateX(0)}to{transform:translateX(-10px)}}
.stage.m-restrained>*{animation:mRise 1.1s cubic-bezier(.16,1,.3,1) both} .stage.m-restrained>:nth-child(2){animation-delay:1.1s} .stage.m-restrained>:nth-child(3){animation-delay:2.2s} .stage.m-restrained>:nth-child(4){animation-delay:3.3s}
.stage.m-lively>*{animation:mSide .6s cubic-bezier(.34,1.56,.64,1) both} .stage.m-lively>:nth-child(2){animation-delay:.2s} .stage.m-lively>:nth-child(3){animation-delay:.4s} .stage.m-lively>:nth-child(4){animation-delay:.6s}
.stage.m-lively .s-bars i{animation:mGrow .5s cubic-bezier(.34,1.56,.64,1) both} .stage.m-lively .s-bars i:nth-child(1){animation-delay:.7s} .stage.m-lively .s-bars i:nth-child(2){animation-delay:.85s} .stage.m-lively .s-bars i:nth-child(3){animation-delay:1s}
.stage.m-bold>*{animation:mSlam .28s cubic-bezier(.9,0,1,.4) both} .stage.m-bold>:nth-child(2){animation-delay:.35s} .stage.m-bold>:nth-child(3){animation-delay:.7s} .stage.m-bold>:nth-child(4){animation-delay:1.05s} .stage.m-bold .s-title{font-size:1.5rem;text-transform:uppercase}
.stage.m-technical>*{animation:mDraw .9s linear both} .stage.m-technical>:nth-child(2){animation-delay:.9s} .stage.m-technical>:nth-child(3){animation-delay:1.8s} .stage.m-technical>:nth-child(4){animation-delay:2.7s}
.stage.m-technical .s-bars i{animation:mGrow .5s linear both} .stage.m-technical .s-bars i:nth-child(1){animation-delay:2.7s} .stage.m-technical .s-bars i:nth-child(2){animation-delay:3.2s} .stage.m-technical .s-bars i:nth-child(3){animation-delay:3.7s}
.stage.m-editorial>*{animation:mMask 1.5s cubic-bezier(.22,1,.36,1) both} .stage.m-editorial>:nth-child(2){animation-delay:1.6s} .stage.m-editorial>:nth-child(3){animation-delay:3.2s} .stage.m-editorial>:nth-child(4){animation-delay:3.2s} .stage.m-editorial .s-title{font-size:1.35rem}
.stage.m-playful>*{animation:mDrop .7s cubic-bezier(.3,1.4,.5,1) both} .stage.m-playful>:nth-child(2){animation-delay:.25s} .stage.m-playful>:nth-child(3){animation-delay:.5s} .stage.m-playful>:nth-child(4){animation-delay:.75s}
.stage.m-data-led>*{animation:mRise .4s ease-out both} .stage.m-data-led .s-rule{animation:mRule .8s cubic-bezier(.16,1,.3,1) .3s both}
.stage.m-data-led .s-bars i{animation:mGrow 1s cubic-bezier(.16,1,.3,1) both} .stage.m-data-led .s-bars i:nth-child(1){animation-delay:.6s} .stage.m-data-led .s-bars i:nth-child(2){animation-delay:.9s} .stage.m-data-led .s-bars i:nth-child(3){animation-delay:1.2s}
.stage.m-product>*{animation:mHero 2s cubic-bezier(.45,0,.2,1) both} .stage.m-product>:nth-child(2){animation-delay:.5s} .stage.m-product>:nth-child(3){animation-delay:1s} .stage.m-product>:nth-child(4){animation-delay:1s} .stage.m-product{align-items:center;text-align:center}
@media (prefers-reduced-motion: reduce){ .stage>*,.stage .s-bars i{animation-duration:.01s !important;animation-delay:0s !important} }
/* design/210: a line's pictures as a row of small ones (the row wraps); one opens large over the page. Nothing here moves, so reduced motion needs no rule. */
button:disabled{opacity:.5;cursor:default}
.pics{display:flex;flex-wrap:wrap;gap:10px}
.pic{display:flex;flex-direction:column;gap:6px;padding:6px;width:156px;max-width:100%;font-size:.82rem;font-weight:500;text-align:left;overflow-wrap:anywhere}
.pic .ph{display:grid;place-items:center;height:110px;border-radius:6px;background:var(--line);color:var(--muted);overflow:hidden}
.pic img{display:block;max-width:100%;max-height:110px;object-fit:contain;background:#fff}
.zoom{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;box-sizing:border-box}
.zoom img{max-width:100%;max-height:calc(100% - 130px);object-fit:contain;background:#fff;border-radius:6px}
.zoom p{color:#fff;text-align:center;font-size:.92rem;overflow-wrap:anywhere}
.zoom .row{justify-content:center}
</style>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:6px">
    <h3 id="step">VideoWizard</h3>
    <h1 id="title">Your decisions</h1>
    <p class="lead">Read each block and choose. You can undo any answer. Nothing is recorded in VideoWizard until you go back to the chat and say <strong>done</strong>.</p>
    <p class="lead" id="summary"></p>
  </header>
  <div class="bar"><div class="dots" id="dots"></div><div class="msg" id="msg">Loading…</div></div>
  <div id="list"><div class="state">Loading the lines…</div></div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;};
const MAX=2000;
let db=null, round=null, answers={}, stopAnswers=null, ready=false;
const editing={}, drafts={}, nodes={};   // per line: the choice being typed for, its text, and the block on screen with what it was drawn from

function tagOf(line,a){
  if(line.key==='world') return ['t-open','To read'];   // the world of the film is read, not answered
  if(line.state==='recorded') return a&&a.choice==='reopen'?['t-chg','You reopened it']:['t-rec','Recorded'];
  if(line.state==='with_assistant') return ['t-chg','With the assistant'];
  if(!a) return ['t-open','To answer'];
  const b=(line.buttons||[]).find(x=>x.choice===a.choice);
  return [b&&b.needs_words||a.choice==='different'?'t-chg':'t-ans','You chose: '+(b?b.label:a.choice)];
}
function groups(rows){   // "Shot 1 · why this way", "First · Whose story", "From the brief · tone": one block per shot, direction or source
  const out=[]; let cur=null;
  (rows||[]).forEach(r=>{
    const m=/^(Shot \d+|First|Second|From the brief)(?: · (.+))?$/.exec(String(r[0]));
    const name=m?m[1]:'';
    if(!cur||cur.name!==name){cur={name:name,rows:[]};out.push(cur);}
    cur.rows.push([m?(m[2]||''):r[0],r[1]]);
  });
  return out;
}
function preview(line){   // design/205: "Show me" plays a rough sample of a motion style, with the film's own title and idea
  const wrap=el('div','prev'), s=line.sample||{};
  wrap.appendChild(el('h4',null,'See a style'));
  const stage=el('div','stage'+(s.frame==='9:16'?' tall':''));
  stage.appendChild(el('div','s-title',s.title||'This film')); stage.appendChild(el('div','s-rule')); stage.appendChild(el('div','s-words',s.words||''));
  const bars=el('div','s-bars'); bars.appendChild(el('i')); bars.appendChild(el('i')); bars.appendChild(el('i')); stage.appendChild(bars);
  const row=el('div','row');
  (line.styles||[]).forEach(st=>{ const b=el('button',null,'Show me: '+st.title); b.addEventListener('click',()=>{
    Array.prototype.forEach.call(row.children,x=>x.classList.remove('on')); b.classList.add('on');
    stage.className='stage'+(s.frame==='9:16'?' tall':''); void stage.offsetWidth; stage.classList.add('m-'+st.name);   // the class is taken off and put back so the sample plays again
    cap.textContent=st.title+': a rough sample of how things appear and move. The film\'s own drawings are made later, in this style.'; }); row.appendChild(b); });
  const cap=el('p','said','Choose "Show me" to play a rough sample of a style, with this film\'s title and idea.');
  wrap.appendChild(row); wrap.appendChild(stage); wrap.appendChild(cap);
  return wrap;
}
function shots(cols,src){   // design/206: the shots of a gap (or of one offered way) as a table, under their totals
  const wrap=el('div'); wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.gap='8px';
  wrap.appendChild(el('p','totals',[src.total,src.mix].filter(Boolean).join(' ')));
  wrap.appendChild(grid(cols,src.table));
  return wrap;
}
function grid(cols,rows){   // a table; on a narrow screen each row becomes a small block with its labels
  const tw=el('div','tw'), t=el('table','shots'), hr=el('tr'); (cols||[]).forEach(c=>hr.appendChild(el('th',null,c)));
  const th=el('thead'); th.appendChild(hr); t.appendChild(th);
  const tb=el('tbody'); (rows||[]).forEach(r=>{ const tr=el('tr'); r.forEach((c,i)=>{ const td=el('td',null,c); td.setAttribute('data-l',(cols||[])[i]||''); tr.appendChild(td); }); tb.appendChild(tr); });
  t.appendChild(tb); tw.appendChild(t);
  return tw;
}
function spec(line){   // design/209: a drawing's parts and sizes, or a material's facts, in plain words; each size is asked once; a recorded one is folded, to read back
  const s=line.spec||{}, rec=line.state==='recorded', wrap=el(rec?'details':'div','group');
  if(rec){ const sm=el('summary',null,'What you approved'); sm.style.fontWeight='600'; sm.style.cursor='pointer'; wrap.appendChild(sm); }
  const list=(title,items)=>{ if(!items||!items.length) return; if(title) wrap.appendChild(el('h4',null,title));
    const ul=el('ul'); ul.style.margin='0'; ul.style.paddingLeft='1.2em'; items.forEach(x=>ul.appendChild(el('li',null,x))); wrap.appendChild(ul); };
  if(s.drawn_as) wrap.appendChild(el('p',null,'Drawn as: '+s.drawn_as));
  if(s.words) wrap.appendChild(el('p',null,s.words));
  list('Parts',s.parts);
  if(s.facts&&s.facts.length){ const dl=el('dl','kv'); s.facts.forEach(r=>{dl.appendChild(el('dt',null,r[0])); dl.appendChild(el('dd',null,r[1]));}); wrap.appendChild(dl); }
  list('How they sit',s.sits); list('Proportions',s.proportions);
  if(s.sizes&&s.sizes.length){ wrap.appendChild(el('h4',null,rec?'Sizes':'Sizes to confirm')); wrap.appendChild(grid(['Part','Measure','Size','From'],s.sizes)); }
  if(s.differs&&s.differs.length){ const w=el('div','note'); w.appendChild(el('strong',null,'The same size has another value elsewhere')); const ul=el('ul'); s.differs.forEach(x=>ul.appendChild(el('li',null,x))); w.appendChild(ul); wrap.appendChild(w); }
  if(s.confirmed) wrap.appendChild(el('p','said','Already confirmed: '+s.confirmed));
  if(s.unknown) wrap.appendChild(el('p','said','Not known, so no figure is shown: '+s.unknown));
  list('',s.other);
  return wrap;
}
// design/210: pictures. A line's `pics` are [{code,label}]; the small picture of a code is the document pics/<code> ({data}), read only when its
// row is near the screen; the large one is a file of the page's file store whose link is the document zoom/<code> ({url}), read on a click.
const picData={}, picSeen={}, zoomUrl={};   // per code: the promise of its small picture, whether it has shown ('ok' or 'bad'), the promise of its large picture's link
let zoomed=null;
function picDoc(coll,code,field){ return db.doc(coll+'/'+code).get().then(s=>{ const d=s&&s.exists?s.data():null; return d&&typeof d[field]==='string'?d[field]:''; }).catch(()=>''); }
function loadThumb(p,btn,onChange,tries){
  if(!picData[p.code]) picData[p.code]=picDoc('pics',p.code,'data');
  picData[p.code].then(src=>{
    if(!btn.isConnected) return;
    const bad=()=>{ picSeen[p.code]='bad'; btn.firstChild.textContent='Not available'; onChange(); };
    if(!/^data:image\/(jpeg|png|webp);base64,/.test(src)){   // not on the page yet: asked again for a minute, then named as missing
      delete picData[p.code];
      if(tries<12) setTimeout(()=>loadThumb(p,btn,onChange,tries+1),5000); else bad();
      return; }
    const img=el('img'); img.alt=p.label;
    img.onload=()=>{ picSeen[p.code]='ok'; btn.disabled=false; onChange(); };
    img.onerror=bad;
    btn.firstChild.textContent=''; btn.firstChild.appendChild(img); img.src=src;
  });
}
function thumbs(line,onChange){   // a line's pictures as a row of small ones, each a grey box with its label until it arrives; a click or Enter opens it large
  const row=el('div','pics'), pics=line.pics||[];
  pics.forEach((p,i)=>{
    const btn=el('button','pic'); btn.type='button'; btn.disabled=true; btn.title='See it large';
    btn.appendChild(el('span','ph',p.missing?'Not available':'Loading…')); btn.appendChild(el('span',null,p.label));
    btn.addEventListener('click',()=>openZoom(pics,i,btn));
    row.appendChild(btn);
  });
  const fill=()=>pics.forEach((p,i)=>{ if(!p.missing) loadThumb(p,row.children[i],onChange||(()=>{}),0); });
  if('IntersectionObserver' in window){ const io=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)){ io.disconnect(); fill(); } },{rootMargin:'300px'}); io.observe(row); }
  else setTimeout(fill,0);
  return row;
}
function closeZoom(){
  if(!zoomed) return;
  const z=zoomed; zoomed=null;
  document.removeEventListener('keydown',z.key,true); z.box.remove();
  const opener=z.opener; if(opener&&opener.isConnected) opener.focus();
}
function openZoom(pics,i,opener){   // the large picture over the page: next and previous move through the pictures of the same line; Esc, Close or a click outside closes it
  closeZoom();
  const box=el('div','zoom'); box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true'); box.setAttribute('aria-label','The picture, large');
  const img=el('img'), cap=el('p'), miss=el('p',null,'The large picture is not available.'), row=el('div','row');
  const prev=el('button',null,'Previous'), next=el('button',null,'Next'), close=el('button','go','Close');
  const show=n=>{
    i=(n+pics.length)%pics.length; const p=pics[i], here=()=>zoomed&&zoomed.box===box&&pics[i]===p;
    cap.textContent=p.label+(pics.length>1?' ('+(i+1)+' of '+pics.length+')':''); img.alt=p.label; img.onerror=null; img.removeAttribute('src'); miss.hidden=true;
    const small=()=>{ if(!here()) return; img.onerror=null; miss.hidden=false; (picData[p.code]||Promise.resolve('')).then(src=>{ if(here()&&src) img.src=src; }); };   // no link, or it did not load: the small picture, enlarged
    if(!zoomUrl[p.code]) zoomUrl[p.code]=picDoc('zoom',p.code,'url');
    zoomUrl[p.code].then(u=>{ if(!here()) return;
      if(!/^\/_blob\/[0-9a-f]{32}$/.test(u)){ delete zoomUrl[p.code]; small(); return; }
      img.onerror=small; img.src=u; });
  };
  prev.addEventListener('click',()=>show(i-1)); next.addEventListener('click',()=>show(i+1)); close.addEventListener('click',closeZoom);
  box.addEventListener('click',e=>{ if(e.target===box) closeZoom(); });
  if(pics.length>1){ row.appendChild(prev); row.appendChild(next); } row.appendChild(close);
  box.appendChild(img); box.appendChild(cap); box.appendChild(miss); box.appendChild(row);
  const key=e=>{
    if(e.key==='Escape'){ e.preventDefault(); closeZoom(); }
    else if(e.key==='ArrowRight'&&pics.length>1) show(i+1);
    else if(e.key==='ArrowLeft'&&pics.length>1) show(i-1);
    else if(e.key==='Tab'){ const b=Array.prototype.slice.call(row.children), at=b.indexOf(document.activeElement); e.preventDefault(); b[(at+(e.shiftKey?-1:1)+b.length)%b.length].focus(); }   // the focus stays in the view
  };
  zoomed={box:box,key:key,opener:opener};
  document.addEventListener('keydown',key,true); document.body.appendChild(box); close.focus(); show(i);
}
function pictures(line,onChange){   // a line with pictures: the row, the facts with where each came from, the assumed sizes on one line; a recorded line's are folded, to look back
  const rec=line.state==='recorded', wrap=el(rec?'details':'div','group');
  if(rec){ const sm=el('summary',null,'What you approved'); sm.style.fontWeight='600'; sm.style.cursor='pointer'; wrap.appendChild(sm); }
  wrap.appendChild(thumbs(line,onChange));
  if(line.facts&&line.facts.length){ wrap.appendChild(el('h4',null,'Facts, and where each came from')); wrap.appendChild(grid(['Fact','Value','From'],line.facts)); }
  if(line.assumed) wrap.appendChild(el('p','changed','Assumed, with no source (say if any is wrong): '+line.assumed));
  return wrap;
}
const KINDS={Person:'People',Place:'Places',Object:'Things',Material:'Materials',Animal:'Animals',Process:'Processes',Technique:'Techniques'};
function world(rows){   // SK, 16 Nov 2026: one heading per kind of rule with its rules listed under it, each group folding; no label repeated on every row
  const wrap=el('div'), order=[], by={}; wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.gap='10px';
  (rows||[]).forEach(r=>{
    const label=String(r[0]||''), cut=label.indexOf(' · '), kind=cut>0?label.slice(0,cut):'';
    const title=kind?(KINDS[kind]||kind):(label==='Specification'?'Specifications':label);
    if(!by[title]){by[title]=[]; order.push(title);}
    if(kind) by[title].push([label.slice(cut+3),String(r[1]||'')]);
    else if(label==='The graphic style') String(r[1]||'').split('; ').forEach(x=>{ if(x.trim()) by[title].push(['',x.trim()]); });
    else by[title].push(['',String(r[1]||'')]);
  });
  order.forEach(title=>{
    const items=by[title], d=el('details','group'); d.open=true;
    const sm=el('summary',null,title+(items.length>1?' ('+items.length+')':'')); sm.style.fontFamily='var(--display)'; sm.style.fontWeight='600'; sm.style.cursor='pointer'; d.appendChild(sm);
    if(items.length===1&&!items[0][0]) d.appendChild(el('p',null,items[0][1]));
    else { const ul=el('ul'); ul.style.margin='0'; ul.style.paddingLeft='1.2em'; ul.style.display='flex'; ul.style.flexDirection='column'; ul.style.gap='6px';
      items.forEach(it=>{ const li=el('li'); if(it[0]){ const b=el('strong',null,it[0]+': '); li.appendChild(b); } li.appendChild(document.createTextNode(it[1])); ul.appendChild(li); });
      d.appendChild(ul); }
    wrap.appendChild(d);
  });
  return wrap;
}
function block(line,n){
  const a=answers[line.line], box=el('section','item');
  const pics=line.pics||[], gate=[], gmsg=el('span','said','');   // design/210: the buttons of a line with pictures work only when every one of them has shown
  const check=()=>{ if(!gate.length) return;
    const bad=pics.filter(p=>p.missing||picSeen[p.code]==='bad').map(p=>p.label), wait=pics.filter(p=>picSeen[p.code]!=='ok').length;
    gate.forEach(b=>{ b.disabled=!!(bad.length||wait); });
    gmsg.textContent=bad.length?'A picture is missing: '+bad.join(', ')+'. This line cannot be answered here: tell the assistant in the chat.':wait?'The buttons work when every picture of this line has shown.':''; };
  const head=el('div','head'); head.appendChild(el('h2',null,n+'. '+line.title));
  const t=tagOf(line,a); head.appendChild(el('span','tag '+t[0],t[1])); box.appendChild(head);
  const body=el('div','body');
  if(line.changes&&line.changes.length){   // SK, 16 Nov 2026: folded, so the list of differences does not confuse; open when the operator asked for the change
    const c=el('details','changed'); c.open=!!line.asked;
    const sm=el('summary',null,(line.asked?'Changed as you asked':'Changed since you last saw it')+' ('+line.changes.length+')'); sm.style.fontWeight='600'; sm.style.cursor='pointer'; c.appendChild(sm);
    const ul=el('ul'); line.changes.forEach(x=>ul.appendChild(el('li',null,x))); c.appendChild(ul); body.appendChild(c);}
  if(line.refused) body.appendChild(el('div','note','Not recorded: '+line.refused));
  if(line.state==='with_assistant') body.appendChild(el('p','lead',line.note?'Your words: “'+line.note+'”. The assistant is rewriting this line.':'The assistant is rewriting this line.'));
  if(line.text) String(line.text).split('\n').forEach(p=>{ if(p.trim()) body.appendChild(el('p',null,p)); });
  if(line.key==='world') body.appendChild(world(line.rows)); else
  groups(line.rows).forEach(g=>{
    const wrap=g.name?el('div','group'):el('div'); if(g.name) wrap.appendChild(el('h4',null,g.name==='First'?'The first direction':g.name==='Second'?'The second direction':g.name));
    const dl=el('dl','kv'); g.rows.forEach(r=>{ if(r[0]){dl.appendChild(el('dt',null,r[0])); dl.appendChild(el('dd',null,r[1]));} else {const p=el('p',null,r[1]); p.style.fontWeight='600'; wrap.appendChild(p);} });
    wrap.appendChild(dl); body.appendChild(wrap);
  });
  if(line.warnings&&line.warnings.length){const w=el('div','note'); w.appendChild(el('strong',null,'Read before you answer')); const ul=el('ul'); line.warnings.forEach(x=>ul.appendChild(el('li',null,x))); w.appendChild(ul); body.appendChild(w);}   // design/207: the plain lines of this gap, above its shots
  if(line.table) body.appendChild(shots(line.cols,line));
  (line.ways||[]).forEach(w=>{   // a gap offered two ways: each way with what it is, why, its cost and its own shots
    const g=el('div','group'); g.appendChild(el('h4',null,w.title+(w.recommended?' (advised)':'')));
    const dl=el('dl','kv'); (w.rows||[]).forEach(r=>{dl.appendChild(el('dt',null,r[0])); dl.appendChild(el('dd',null,r[1]));}); g.appendChild(dl);
    g.appendChild(shots(line.cols,w)); body.appendChild(g);
  });
  if(line.spec) body.appendChild(spec(line));
  if(line.pics&&line.pics.length) body.appendChild(pictures(line,check));
  if(line.ask&&line.state==='open') body.appendChild(el('p','totals',line.ask));   // design/209: the question of this line, in plain words
  if(line.state==='open'&&line.styles&&line.styles.length) body.appendChild(preview(line));
  if(body.childNodes.length) box.appendChild(body);
  const acts=el('div','acts');
  if(editing[line.line]){
    const wrap=el('div','edit'), ta=el('textarea'); ta.maxLength=MAX; ta.setAttribute('maxlength','2000'); ta.id='ta-'+line.line; ta.placeholder='Say in your own words what should change'; ta.value=drafts[line.line]||'';
    const count=el('span','count',(ta.value.length)+' of '+MAX+' characters');
    ta.addEventListener('input',()=>{drafts[line.line]=ta.value; count.textContent=ta.value.length+' of '+MAX+' characters';});
    const row=el('div','row'), save=el('button','go','Save'), cancel=el('button',null,'Cancel');
    save.addEventListener('click',()=>{const w=(ta.value||'').trim(); if(!w){ta.focus(); ta.placeholder='Your words are needed here'; return;} const c=editing[line.line]; delete editing[line.line]; delete drafts[line.line]; write(line,c,w);});
    cancel.addEventListener('click',()=>{delete editing[line.line]; draw(true);});
    row.appendChild(save); row.appendChild(cancel); row.appendChild(count); wrap.appendChild(ta); wrap.appendChild(row); acts.appendChild(wrap);
  } else if(a){
    if(a.notes) acts.appendChild(el('span','said','Your words: “'+a.notes+'”'));
    const un=el('button',null,'Undo my answer'); un.addEventListener('click',()=>undo(line)); acts.appendChild(un);
    acts.appendChild(el('span','said','Saved on this page. It is recorded in VideoWizard when you say done in the chat.'));
  } else if(line.state==='open'){
    (line.buttons||[]).forEach((b,i)=>{const btn=el('button',i===0?'go':null,(line.key==='motion'?'Use ':'')+b.label); btn.addEventListener('click',()=>{ if(b.needs_words){editing[line.line]=b.choice; draw(true); const ta=$('ta-'+line.line); if(ta) ta.focus();} else write(line,b.choice,''); }); acts.appendChild(btn); if(pics.length) gate.push(btn);});
    if(gate.length){ acts.appendChild(gmsg); check(); }
  } else if(line.state==='recorded'&&line.reopen){
    acts.appendChild(el('span','said','This line is recorded in VideoWizard.'));
    const re=el('button',null,'Reopen'); re.addEventListener('click',()=>{editing[line.line]='reopen'; draw(true); const ta=$('ta-'+line.line); if(ta) ta.focus();}); acts.appendChild(re);
  } else if(line.key==='world'){ acts.appendChild(el('span','said','For reading only: nothing to answer here. The assistant follows these in every picture.')); }
  else if(line.state==='recorded'){ acts.appendChild(el('span','said','This line is recorded in VideoWizard.')); }
  if(acts.childNodes.length) box.appendChild(acts);
  return box;
}
function draw(force){
  const list=$('list');
  if(!ready){return;}
  if(!round){ list.textContent=''; Object.keys(nodes).forEach(k=>delete nodes[k]); list.appendChild(el('div','state','Nothing to decide yet. The assistant writes the lines here when a step is ready.')); $('dots').textContent=''; $('msg').textContent='Nothing to decide yet'; return; }
  $('step').textContent='VideoWizard · '+(round.run||'')+' · '+(round.step||''); $('title').textContent=(round.step||'Your')+': your decisions'; $('summary').textContent=round.summary||'';
  const lines=round.lines||[], seen={};
  if(list.firstChild&&list.firstChild.className==='state') list.textContent='';
  const dots=$('dots'); dots.textContent=''; let open=0, answered=0;
  lines.forEach((line,i)=>{
    const a=answers[line.line];
    if(line.state==='open'&&!a) open++; if(a) answered++;
    const d=el('div','dot '+(line.state==='recorded'&&!a?'rec':line.state==='with_assistant'?'chg':a?(a.choice==='accept'||a.choice==='accept_second'||a.choice==='yes'||String(a.choice).indexOf('way:')===0?'ans':'chg'):''),String(i+1)); d.title=line.title; dots.appendChild(d);
    d.addEventListener('click',()=>{ const n=nodes[line.line]; if(n) n.node.scrollIntoView({block:'start'}); });   // design/206: a number jumps to its block
    const sig=JSON.stringify([i,line,a||null,editing[line.line]||null]);
    seen[line.line]=1;
    const old=nodes[line.line];
    if(old&&old.sig===sig) return;                               // unchanged: left alone, so a box being typed in keeps its text and its place
    const node=block(line,i+1);
    if(old) list.replaceChild(node,old.node); else list.appendChild(node);
    nodes[line.line]={node:node,sig:sig};
  });
  Object.keys(nodes).forEach(k=>{ if(!seen[k]){ list.removeChild(nodes[k].node); delete nodes[k]; delete editing[k]; delete drafts[k]; } });
  lines.forEach((line,i)=>{ const n=nodes[line.line]; if(n&&list.children[i]!==n.node) list.insertBefore(n.node,list.children[i]||null); });   // the film's order; a block already in place is not moved
  $('msg').textContent = !lines.length ? (round.note||'Nothing to decide') : open ? open+' still to answer. '+(round.note||'') : answered ? 'All answered. Go back to the chat and say done.' : (round.note||'Nothing waits for you here.');
}
function fail(e){ $('msg').textContent='Could not save ('+((e&&e.code)||'error')+'). Check that you are signed in to Claude, then try again.'; }
function ref(line){ return db.doc('rounds/'+round.round+'/answers/'+line.line); }
function write(line,choice,notes){ if(!db||!round) return; ref(line).set({key:line.key,item:line.item||'',choice:choice,notes:String(notes||'').slice(0,MAX),at:new Date().toISOString()}).catch(fail); draw(true); }
function undo(line){ if(!db||!round) return; ref(line).delete().catch(fail); }
function watchAnswers(){
  if(stopAnswers){stopAnswers(); stopAnswers=null;} answers={};
  if(!round) return;
  stopAnswers=db.collection('rounds/'+round.round+'/answers').onSnapshot(s=>{ answers={}; s.docs.forEach(d=>{answers[d.id]=d.data();}); draw(false); }, e=>{ $('msg').textContent='Your saved answers could not be loaded ('+((e&&e.code)||'error')+'). Reload the page before answering.'; });
}
async function start(){
  const use=window.claude&&window.claude.use;
  db = use ? await window.claude.use('db') : null;
  if(!db){ ready=true; $('list').textContent=''; $('list').appendChild(el('div','state','Sign in to Claude in this browser to load and save your answers.')); $('msg').textContent='Not connected'; return; }
  const timer=setTimeout(()=>{ if(!ready) $('msg').textContent='Still loading… check your connection.'; },10000);
  db.collection('rounds').orderBy('at','desc').limit(1).onSnapshot(s=>{
    clearTimeout(timer); ready=true;
    const next=s.docs.length?s.docs[0].data():null, changed=!round||!next||round.round!==next.round;
    round=next;
    if(changed){ Object.keys(editing).forEach(k=>delete editing[k]); Object.keys(drafts).forEach(k=>delete drafts[k]); watchAnswers(); }
    draw(false);
  }, e=>{ ready=true; $('msg').textContent='Could not load the lines ('+((e&&e.code)||'error')+').'; });
}
start();
})();
