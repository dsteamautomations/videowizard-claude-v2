<h2 class="sr-only">Decision card: answer every entry with Accept or Change this, then submit all answers once.</h2>
<div style="padding:1rem 0">
<div id="say" style="background:var(--bg-accent);color:var(--text-accent);border-radius:var(--radius);padding:10px 14px;font-size:14px;line-height:1.6;margin-bottom:10px"></div>
<p id="sum" style="font-size:13px;color:var(--text-secondary);margin:0 0 12px"></p>
<div id="nums" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px"></div>
<div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem">
<div style="margin-bottom:12px"><span id="ttl" style="display:inline-block;background:var(--bg-warning);color:var(--text-warning);font-size:15px;font-weight:500;padding:4px 12px;border-radius:var(--radius)"></span><span id="chd" style="font-size:13px;color:var(--text-secondary);margin-left:8px"></span></div>
<div id="body" style="font-size:14px;line-height:1.6;overflow-x:auto"></div>
<p id="tot" style="font-size:13px;color:var(--text-secondary);margin:10px 0 0"></p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button type="button" id="acc"></button><button type="button" id="chg"></button></div>
<div id="box" style="display:none;margin-top:12px">
<textarea id="note" rows="3" style="width:100%" placeholder="Say what should change"></textarea>
<p id="err" style="font-size:13px;color:var(--text-danger);margin:4px 0 0;display:none">Type what should change first</p>
<button type="button" id="save" style="margin-top:8px">Save the change</button>
</div>
</div>
<p id="dirn" style="display:none;font-size:13px;color:var(--text-warning);margin:12px 0 0">You changed the direction. Every gap line is written again from it, so only the direction is sent now. The gaps come back afterwards.</p>
<div style="display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap"><button type="button" id="sub">Submit all ↗</button><span id="left" style="font-size:13px;color:var(--text-secondary)"></span></div>
<textarea id="out" rows="4" readonly style="display:none;width:100%;margin-top:10px;font-family:var(--font-mono);font-size:12px"></textarea>
</div>
<script>
const D=__DATA__;
const $=id=>document.getElementById(id),N=D.e.length;
let ans={},cur=0,done=false,store=false,timer=0;
try{const v=localStorage.getItem(D.id);if(v)ans=JSON.parse(v)||{};localStorage.setItem(D.id,JSON.stringify(ans));store=true}catch(e){ans={}}
function keep(){if(store)try{localStorage.setItem(D.id,JSON.stringify(ans))}catch(e){}}
function el(tag,text,css){const x=document.createElement(tag);if(text!=null)x.textContent=text;if(css)x.style.cssText=css;return x}
function dirChange(){return !!(D.dir&&ans[0]&&ans[0].c==='change')}
function missing(){return dirChange()?[]:D.e.map((_,i)=>i).filter(i=>!ans[i])}
function draw(){
const e=D.e[cur],a=ans[cur];
$('say').textContent=D.say;$('sum').textContent=D.sum||'';$('sum').style.display=D.sum?'block':'none';
$('nums').textContent='';
D.e.forEach((x,i)=>{const v=ans[i],b=el('button',String(i+1),'min-width:34px;padding:4px 0;font-size:13px;'+(v?(v.c==='accept'?'background:var(--bg-success);color:var(--text-success);':'background:var(--bg-warning);color:var(--text-warning);'):'')+(i===cur?'border:2px solid var(--border-accent);':''));
b.type='button';b.setAttribute('aria-label',x.n+(v?(v.c==='accept'?', accepted':', change saved'):', not answered'));b.onclick=()=>{clearTimeout(timer);cur=i;draw()};$('nums').appendChild(b)});
$('ttl').textContent=e.n;$('chd').textContent=e.c?'Changed since you last saw it':'';
const body=$('body');body.textContent='';
if(e.ch){body.appendChild(el('p','What changed:','margin:0 0 4px;font-weight:500'));e.ch.forEach(l=>body.appendChild(el('p','\u2022 '+l,'margin:0 0 4px;color:var(--text-secondary)')));body.appendChild(el('p','','margin:0 0 10px'))}
if(e.t!=null)String(e.t).split('\n').forEach(l=>{if(l.trim())body.appendChild(el('p',l,'margin:0 0 8px'))});
if(e.r)e.r.forEach(r=>{const p=el('p',null,'margin:0 0 6px');p.appendChild(el('span',r[0]+': ','font-weight:500'));p.appendChild(el('span',r[1]));body.appendChild(p)});
if(e.tb){const t=el('table',null,'width:100%;font-size:13px;border-collapse:collapse;table-layout:fixed'),h=el('tr',null,'text-align:left;color:var(--text-secondary)');
D.cols.forEach((c,i)=>h.appendChild(el('th',c,'font-weight:500;padding:6px 4px;width:'+D.w[i]+'%')));t.appendChild(h);
e.tb.forEach(r=>{const tr=el('tr',null,'border-top:0.5px solid var(--border);vertical-align:top');r.forEach((c,i)=>tr.appendChild(el('td',c,'padding:6px 4px;overflow-wrap:anywhere'+(i===1?';font-weight:500':''))));t.appendChild(tr)});body.appendChild(t)}
$('tot').textContent=e.tot||'';
const acc=$('acc'),chg=$('chg'),isA=a&&a.c==='accept',isC=a&&a.c==='change';
acc.textContent=isA?'Accepted ✓':'Accept';acc.style.cssText=isA?'background:var(--bg-success);color:var(--text-success);border-color:var(--border-success)':'';acc.setAttribute('aria-pressed',isA?'true':'false');
chg.textContent=isC?'Change saved ✓':'Change this';chg.style.cssText=isC?'background:var(--bg-warning);color:var(--text-warning);border-color:var(--border-warning)':'';chg.setAttribute('aria-pressed',isC?'true':'false');
$('box').style.display=isC&&!done?'block':'none';$('note').value=isC?a.n:'';$('err').style.display='none';
$('dirn').style.display=dirChange()?'block':'none';
const m=missing();$('left').textContent=done?'Submitted. Your answers are being recorded.':(m.length?m.length+' still to answer':'All answered: press Submit all');
}
function next(){const m=missing();if(!m.length){draw();return}const j=m.find(i=>i>cur);cur=j==null?m[0]:j;draw()}
function advance(){draw();if(D.auto){clearTimeout(timer);timer=setTimeout(next,500)}}
$('acc').onclick=()=>{if(done||(ans[cur]&&ans[cur].c==='accept'))return;ans[cur]={c:'accept'};keep();advance()};
$('chg').onclick=()=>{if(done)return;clearTimeout(timer);$('box').style.display='block';$('note').focus()};
$('note').oninput=()=>{$('err').style.display='none'};
$('save').onclick=()=>{if(done)return;const n=$('note').value.trim();if(!n){$('err').style.display='block';return}ans[cur]={c:'change',n:n};keep();advance()};
$('sub').onclick=()=>{if(done)return;clearTimeout(timer);const m=missing();
if(m.length){cur=m[0];draw();$('left').textContent='Answer these first: '+m.map(i=>i+1).join(', ');return}
const list=(dirChange()?[0]:D.e.map((_,i)=>i)).map(i=>ans[i].c==='accept'?{n:i+1,choice:'accept'}:{n:i+1,choice:'change',notes:ans[i].n});
const msg='Card answers: '+JSON.stringify({card:D.id,answers:list});
done=true;$('sub').disabled=true;$('sub').textContent='Submitted';draw();
try{sendPrompt(msg);if(store)try{localStorage.removeItem(D.id)}catch(e){}}
catch(e){const o=$('out');o.style.display='block';o.value=msg;$('left').textContent='The card could not send by itself. Copy the line below into the chat.'}};
draw();
</script>
