{% extends "base.html" %}
{% block title %}Review · {{ run.code }} · VideoWizard{% endblock %}
{% block body %}
<style>
.rv .top{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.rv .top h1{font-size:20px;margin:0 0 2px}
.rv .line{font-size:13px;color:var(--muted)}
.rv .line strong{color:var(--fg)}
.rv .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:14px;align-items:start}
@media (max-width:980px){.rv .grid{grid-template-columns:1fr}}
.rv .left{position:sticky;top:64px}
.rv video{width:100%;max-height:70vh;background:#000;border-radius:12px;display:block;will-change:transform}
.rv .nofilm{color:var(--muted);padding:40px 12px;font-size:15px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.rv .nofilm[hidden]{display:none}
.rv .now{font-size:13px;color:var(--muted);margin-top:6px;min-height:1.3em}
.rv .pause{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.rv .pause input{width:auto;min-width:0;margin:0}
.rv .wait{margin-top:8px;padding:10px 12px;border:2px solid var(--accent);border-radius:10px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rv .wait[hidden]{display:none}
.rv .scene{border-radius:12px;padding:8px 10px 10px;margin-bottom:12px;border-left:6px solid var(--sc)}
.rv .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;cursor:pointer}
.rv .head b{font-size:15px}
.rv .head span{font-size:12.5px;color:var(--muted)}
.rv .row{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:7px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;cursor:pointer}
.rv .row.cur{outline:2px solid #2a5bd7}
.rv .row.alt{border:1.5px dashed var(--muted);margin-left:18px}
.rv .row.off{opacity:.6}
.rv .t{font-weight:600}
.rv .ds{color:var(--muted);font-size:12.5px;margin-top:3px}
.rv .words{font-size:13px;margin-top:3px}
.rv .q{font-size:12.5px;margin-top:3px}
.rv .broll{display:inline-block;background:#8b0000;color:#fff;font-weight:700;font-size:2.3em;line-height:1.1;padding:1px 10px;border-radius:8px;margin:2px 8px 4px 0;vertical-align:middle}
.rv .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rv .btns button{padding:4px 10px;font-size:12.5px;border-radius:999px}
.rv .btns button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.rv .ans{font-size:12px;color:var(--muted);margin-top:5px;text-align:right}
.rv .ans b{color:var(--ok)}
.rv .form{grid-column:1/-1;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rv .form input{min-width:0;padding:6px 9px;font-size:13px;border-radius:8px}
.rv .form input.w{width:200px}.rv .form input.f{width:64px}
.rv .form label{font-size:12px;color:var(--muted)}
.rv .err{color:var(--err)}.rv .ok{color:var(--ok)}
.rv .foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:6}
.rv .foot .in{max-width:1100px;margin:0 auto;padding:8px 20px 10px}
.rv .foot .status{font-size:13px;min-height:1.3em;margin-bottom:6px;color:var(--muted)}
.rv .foot .status.err{color:var(--err)}.rv .foot .status.ok{color:var(--ok)}
.rv .foot .row2{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.rv .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:rvspin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes rvspin{to{transform:rotate(360deg)}}
.rv .spacer{height:120px}
</style>
<div class="rv" id="app" data-code="{{ run.code }}">
  <div class="top">
    <h1>Review · {{ run.code }} <small>{{ run.title }}</small></h1>
    <div class="line" id="line">Loading…</div>
  </div>
  <div class="grid">
    <div class="left">
      <video id="film" controls preload="metadata" playsinline hidden></video>
      <div class="nofilm" id="nofilm">Loading…</div>
      <div class="now" id="now"></div>
      <label class="pause"><input type="checkbox" id="pauseon"> Pause for answers (the film stops after each shot that still needs your answer)</label>
      <div class="wait" id="wait" hidden><span id="waittext"></span><button id="goon">Continue</button></div>
    </div>
    <div class="right" id="slides"></div>
  </div>
  <div class="spacer"></div>
  <div class="foot"><div class="in"><div class="status" id="fmsg"></div><div class="row2" id="action"></div></div></div>
</div>
<script>
(function(){
const code=document.getElementById('app').dataset.code, base='/runs/'+code+'/review';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=null, timer=null, open=null, inflight=false, filmKey=null, current=null, waitingFor=null;
const passed=new Set();   // shots the viewer chose to play past without answering, this viewing
// design/127: a footage shot KEEP / REJECT / TRIM; the AI shot of an all-AI scene Keep AI (KEEP) / Find footage (REJECT); an alternative KEEP / REJECT once its shot is rejected
const CHOICES={shot:[['KEEP','Keep'],['REJECT','Reject'],['TRIM','Trim']],alternative:[['KEEP','Keep'],['REJECT','Reject']],ai:[['KEEP','Keep AI'],['REJECT','Find footage']]};
let pauseOn=true; try{pauseOn=localStorage.getItem('vw-review-pause')!=='off';}catch(e){}
$('pauseon').checked=pauseOn;
$('pauseon').addEventListener('change',()=>{pauseOn=$('pauseon').checked;try{localStorage.setItem('vw-review-pause',pauseOn?'on':'off');}catch(e){}if(!pauseOn)resume();});
function msg(t,err,busy){const f=$('fmsg');f.innerHTML=(busy?'<span class="spin"></span>':'')+esc(t||'');f.className='status '+(err?'err':(busy?'':'ok'));}
async function act(body){
  if(inflight){throw new Error('Still recording the last answer; try again in a moment.');}
  inflight=true;
  try{
    const r=await fetch(base+'/act',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    let j=null;try{j=await r.json();}catch(e){j=null;}
    if(!r.ok){throw new Error((j&&j.message)||('The server answered '+r.status+'.'));}
    return j;
  }finally{inflight=false;}
}
async function load(){
  let r;
  try{r=await fetch(base+'/data',{cache:'no-store'});}catch(e){msg('The server is not reachable; trying again in 15 s.',true);schedule();return;}
  if(r.status===401){location.href='/login?next='+encodeURIComponent(base);return;}
  if(!r.ok){msg('The page could not load ('+r.status+').',true);schedule();return;}
  data=await r.json();
  draw();
}
function schedule(){clearTimeout(timer);timer=setTimeout(load,15000);}
function fmt(s){s=Math.max(0,Math.round(Number(s)||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function stage(){return data&&data.run?data.run.stage:null;}
function decidable(){return !data.master_built&&((stage()==='master'&&data.accepted)||(stage()==='options'&&!!data.film));}   // design/98 D1: the first answer approves the options
function cue(slide){const c=data&&data.cues?data.cues[slide]:null;return Array.isArray(c)?c:null;}
function row(s,can){
  const c=cue(s.slide);
  const off=!s.needs_answer&&s.why;
  let info='<div><div class="t">'+(s.b_roll?'<span class="broll">B-roll</span>':'')+esc(s.title)+(s.type==='ai'?' · made with AI':'')+'</div>';
  if(s.clip){info+='<div class="ds">'+esc(s.clip)+'</div>';}
  if(s.words){info+='<div class="words">“'+esc(s.words)+'”</div>';}
  if(s.type==='alternative'){info+='<div class="ds">the same words as '+esc(s.of)+'</div>';}
  if(s.type==='ai'&&s.intent){info+='<div class="ds">For AI: '+esc(s.intent)+'</div>';}
  if(s.note&&s.note.question){info+='<div class="q">Question: '+esc(s.note.question)+'</div>';}
  info+='<div class="ds">'+esc(s.hint||'')+' · '+fmt(s.seconds)+(c?' · at '+fmt(c[0]):'')+'</div></div>';
  let ans='';
  if(!s.answerable){ans='<span class="ds">nothing to answer</span>';}
  else if(off){ans='<span class="ds">'+esc(s.why)+'</span>'+(s.answer?'<div class="ans">'+esc(s.answer.action)+' (not used)</div>':'');}
  else{
    const a=s.answer;
    if(can){ans='<div class="btns">'+(CHOICES[s.type]||[]).map(([v,l])=>'<button data-slide="'+esc(s.slide)+'" data-act="'+v+'" class="'+(a&&a.action===v?'on':'')+'">'+l+'</button>').join('')+'</div>';}
    if(a){ans+='<div class="ans"><b>'+esc(s.type==='ai'?(a.action==='KEEP'?'Keep AI':'Find footage'):a.action)+'</b>'+(a.note?' · '+esc(a.note):'')+(a.edit?' · '+esc(a.edit):'')+'</div>';}
    if(!can){ans+='<span class="ds">'+(data.accepted?(data.master_built?'no answer':'waiting'):'after the film')+'</span>';}
  }
  return '<div data-slide="'+esc(s.slide)+'" class="row'+(s.type==='alternative'?' alt':'')+(off?' off':'')+(current===s.slide?' cur':'')+'">'+info+'<div>'+ans+'</div>'+(open&&open.slide===s.slide?form(open):'')+'</div>';
}
function draw(){
  const d=data; const film=$('film'), no=$('nofilm');
  if(d.state!=='prepared'){
    $('line').textContent=d.state==='not_prepared'?'The options stage has not started yet.':d.state==='old_form'?d.message:'No options proposed yet; the assistant proposes them in chat.';
    film.hidden=true;no.hidden=false;no.textContent=$('line').textContent;$('slides').innerHTML='';$('action').innerHTML='';return;
  }
  let line='Version <strong>'+esc(d.version)+'</strong>';
  if(!d.accepted&&stage()==='options'){line+=d.film?' · <strong>answer each shot; your first answer approves these options</strong>':' · the review film is not ready yet';}
  else if(!d.accepted){line+=' · this version is not the recorded one; the assistant proposes or records in chat';}
  else if(d.master_built){line+=' · answers closed: the master film is built';}
  else if(d.of&&d.answered>=d.of){line+=' · <strong>all '+d.of+' answered</strong>. The assistant builds the master film from here (vw master build).';}
  else{line+=' · <strong>'+d.answered+' of '+d.of+'</strong> answered · waiting: '+(d.waiting.length?esc(d.waiting.join(', ')):'none');}
  if(d.accepted&&d.approved_by&&d.approved_by.slide){line+=' · Options approved by your first answer (#'+esc(d.approved_by.slide)+', '+esc(String(d.approved_by.at||'').slice(11,16))+')';}   // design/98 D6
  if(d.run&&d.run.open_defects&&d.run.open_defects.length){line+=' · <span class="err">a defect is open on this run; nothing can be recorded until it is fixed</span>';}
  $('line').innerHTML=line;
  clearTimeout(timer);
  if(d.film){
    no.hidden=true;film.hidden=false;
    if(filmKey!==d.film.key){filmKey=d.film.key;film.src='/runs/'+code+'/film/'+d.film.key;}
  }else{
    film.hidden=true;no.hidden=false;filmKey=null;film.removeAttribute('src');
    const r=d.render;
    if(!r){no.textContent='The review film is not rendered yet; the assistant runs vw options render.';}
    else if(!r.current){no.textContent='The film on record is of an earlier version; the assistant renders this version again.';}
    else if(r.status==='ready'){no.textContent='The film is ready but not on record; reload in a moment.';schedule();}
    else if(r.status==='queued'||r.status==='running'){no.innerHTML='<span class="spin"></span>The review film is rendering ('+esc(r.status)+'); this page checks again every 15 s.';schedule();}
    else{no.textContent='The render '+esc(r.status||'failed')+(r.error?': '+r.error:'')+'. The assistant renders again.';}
  }
  // one coloured block per scene, its shots and alternatives under it
  const can=decidable(); let html='', inScene=false;
  for(const s of d.slides){
    if(s.type==='scene'){
      if(inScene){html+='</div>';}
      inScene=true;
      html+='<div class="scene" style="--sc:'+esc(s.colour)+';background:'+esc(s.colour)+'1f"><div class="head" data-slide="'+esc(s.slide)+'"><b>'+esc(s.lines[0])+' · '+esc(s.lines[1]||'')+'</b><span>'+esc(s.lines[2]||'')+' - '+esc(s.lines[3]||'')+'</span></div>';
    }else{html+=row(s,can);}
  }
  if(inScene){html+='</div>';}
  $('slides').innerHTML=html;
  $('slides').querySelectorAll('button[data-act]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();choose(b.dataset.slide,b.dataset.act);}));
  $('slides').querySelectorAll('[data-slide]').forEach(el=>{if(el.tagName==='BUTTON')return;el.addEventListener('click',e=>{if(e.target.closest('button,input,label'))return;seek(el.dataset.slide);});});
  if(open){const f=$('f-'+open.slide);if(f){f.querySelector('button.go').addEventListener('click',()=>submit(open.slide));f.querySelector('button.no').addEventListener('click',()=>{open=null;draw();});const first=f.querySelector('input');if(first)first.focus();}}
  const help='Watch the film and answer each shot. Keep: use it. Reject: not this one; an AI stretch takes its place (a reason is optional). Trim: use it with its start or end moved. '
    +'B-roll is marked in dark red: it is fine to reject. An alternative (dashed) is another clip for the same words: it opens when you reject its shot. Keep AI / Find footage: for a scene made only with AI.';
  if(!d.accepted&&stage()==='options'){$('action').innerHTML='<span>'+esc(help)+' Your first answer approves these options.</span>';}   // design/98 D1
  else if(d.accepted&&stage()==='master'&&d.of&&d.answered>=d.of){$('action').innerHTML='<span>All '+d.of+' answered. Tell the assistant to build the master film (vw master build); an answer can still be changed here until then.</span>';}
  else if(d.accepted&&stage()==='master'){$('action').innerHTML='<span>Click a row to see it in the film. '+esc(help)+'</span>';}
  else{$('action').innerHTML='<span>'+esc(d.run&&d.run.stage?('The run is at '+d.run.stage+'.'):'')+'</span>';}
}
function form(o){
  if(o.action==='REJECT'){return '<div class="form" id="f-'+esc(o.slide)+'"><input class="w" placeholder="Why? (optional)"><button class="go">Save</button><button class="no">Close</button></div>';}   // design/98 R1
  return '<div class="form" id="f-'+esc(o.slide)+'"><label>start ±frames</label><input class="f" type="number" value="0"><label>end ±frames</label><input class="f" type="number" value="0"><button class="go">Record trim</button><button class="no">Cancel</button><span class="ds">Source frames; a frame is 1/25 s. The scene must keep its length: trim one shot and lengthen another.</span></div>';
}
async function choose(slide,action){
  if(action==='REJECT'){open=null;const j=await send({action:'decide',slide,decision:'REJECT'});if(j){open={slide,action};draw();}return;}   // design/98 R1: recorded at once; a reason may follow
  if(action==='TRIM'){open={slide,action};draw();return;}
  open=null;await send({action:'decide',slide,decision:action});
}
async function submit(slide){
  const f=$('f-'+slide); if(!f||!open)return;
  if(open.action==='REJECT'){const why=f.querySelector('input').value.trim();if(!why){open=null;draw();return;}await send({action:'decide',slide,decision:'REJECT',note:why});return;}
  const v=[...f.querySelectorAll('input')].map(i=>parseInt(i.value||'0',10)||0);
  await send({action:'decide',slide,decision:'TRIM',edit:'in:'+v[0]+',out:'+v[1]});
}
async function send(body){
  msg('Recording #'+body.slide+'…',false,true);
  try{const j=await act(body);open=null;msg((j.options_approved?'Options approved by this first answer. ':'')+'#'+j.slide+' '+String(j.action)+' recorded ('+j.decided+' of '+j.of+').'));
    if(j.view){data=j.view;draw();}else{await load();}
    if(waitingFor===body.slide){resume();}
    return j;}
  catch(err){msg(err.message,true);return null;}   // the film stays paused; nothing is recorded twice (one request at a time)
}
function seek(slide){const c=cue(slide);if(!c||!filmKey)return;const f=$('film');f.currentTime=c[0];passed.delete(slide);f.play().catch(()=>{});}
function resume(){waitingFor=null;$('wait').hidden=true;const f=$('film');if(f.paused&&filmKey){f.play().catch(()=>{});}}
$('goon').addEventListener('click',()=>{if(waitingFor){passed.add(waitingFor);}resume();});
$('film').addEventListener('timeupdate',()=>{
  if(!data||!data.cues)return;const f=$('film'), t=f.currentTime;let best=null,bt=-1;
  for(const s of data.slides){const c=cue(s.slide);if(!c)continue;
    if(s.type==='alternative'&&!s.needs_answer&&s.why&&/is kept/.test(s.why)&&t>=c[0]&&t<c[1]-0.1){f.currentTime=c[1];return;}   // design/127: a switched-off alternative is skipped
    if(s.type!=='scene'&&c[0]<=t+0.05&&c[0]>bt){bt=c[0];best=s.slide;}}
  if(best!==current){current=best;$('slides').querySelectorAll('.row').forEach(el=>el.classList.toggle('cur',el.dataset.slide===current));
    const s=data.slides.find(x=>x.slide===current);$('now').textContent=s?('Now: '+s.title+(s.b_roll?' · B-roll':'')):'';}
  if(!pauseOn||waitingFor||f.paused)return;
  for(const s of data.slides){   // design/127: stop at the end of a shot that still needs an answer
    const c=cue(s.slide);
    if(!c||!s.needs_answer||s.answer||passed.has(s.slide)||s.type==='scene')continue;
    if(t>=c[1]-0.15&&t<c[1]+0.5){f.pause();waitingFor=s.slide;$('waittext').textContent='Answer to continue: '+s.title+'.';$('wait').hidden=false;
      const el=$('slides').querySelector('.row[data-slide="'+CSS.escape(s.slide)+'"]');if(el)el.scrollIntoView({block:'nearest'});break;}
  }
});
load();
})();
</script>
{% endblock %}
