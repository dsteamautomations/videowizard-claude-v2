{% extends "base.html" %}
{% block title %}Review · {{ run.code }} · VideoWizard{% endblock %}
{% block body %}
<style>
.rv .top{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.rv .top h1{font-size:20px;margin:0 0 2px}
.rv .line{font-size:13px;color:var(--muted)}
.rv .line strong{color:var(--fg)}
.rv .st{font-size:16px;font-weight:600;color:var(--fg);margin-top:2px}
.rv .st.err{color:var(--err)}
.rv .st a{font-weight:400;font-size:12.5px;color:var(--muted);margin-left:12px;cursor:pointer;text-decoration:underline}
.rv .det{margin-top:4px}
.rv .det[hidden]{display:none}
.rv .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:14px;align-items:start}
@media (max-width:980px){.rv .grid{grid-template-columns:1fr}}
/* SK, 15 Nov 2026: the film sits below the page's own top block, whatever its height (it was fixed at 64px and the block is taller, so the film's top was cut);
   --top-h and --foot-h are measured by fit() below */
.rv{--top-h:64px;--foot-h:70px}
.rv .left{position:sticky;top:calc(var(--top-h) + 10px)}
.rv .row,.rv .head{scroll-margin-top:calc(var(--top-h) + 10px);scroll-margin-bottom:calc(var(--foot-h) + 10px)}
.rv video{width:100%;max-height:max(180px,min(70vh,calc(100vh - var(--top-h) - var(--foot-h) - 140px)));background:#000;border-radius:12px;display:block;will-change:transform}
.rv .nofilm{color:var(--muted);padding:40px 12px;font-size:15px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.rv .nofilm[hidden]{display:none}
.rv .now{font-size:13px;color:var(--muted);margin-top:6px;min-height:1.3em}
.rv .pause{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.rv .pause input{width:auto;min-width:0;margin:0}
.rv .wait{margin-top:8px;padding:10px 12px;border:2px solid var(--accent);border-radius:10px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rv .wait[hidden]{display:none}
.rv .scene{border-radius:12px;padding:8px 10px 10px;margin-bottom:12px;border-left:6px solid var(--sc)}
.rv .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;cursor:pointer}
.rv .head b{font-size:15px}
.rv .head span{font-size:12.5px;color:var(--muted)}
.rv .row{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:7px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;cursor:pointer}
.rv .row.cur{outline:2px solid #2a5bd7}
.rv .row.alt{border:1.5px dashed var(--muted);margin-left:18px}
.rv .row.off{opacity:.6}
.rv .t{font-weight:600}
.rv .ds{color:var(--muted);font-size:12.5px;margin-top:3px}
.rv .words{font-size:13px;margin-top:3px}
.rv .q{font-size:12.5px;margin-top:3px}
.rv .broll{display:inline-block;background:#8b0000;color:#fff;font-weight:700;font-size:2.3em;line-height:1.1;padding:1px 10px;border-radius:8px;margin:2px 8px 4px 0;vertical-align:middle}
.rv .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rv .btns button{padding:4px 10px;font-size:12.5px;border-radius:999px}
.rv .btns button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.rv .ans{font-size:12px;color:var(--muted);margin-top:5px;text-align:right}
.rv .ans b{color:var(--ok)}
.rv .form{grid-column:1/-1;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rv .form input{min-width:0;padding:6px 9px;font-size:13px;border-radius:8px}
.rv .form input.w{width:200px}.rv .form input.f{width:64px}
.rv .form label{font-size:12px;color:var(--muted)}
.rv .err{color:var(--err)}.rv .ok{color:var(--ok)}
.rv .foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:6}
.rv .foot .in{max-width:1100px;margin:0 auto;padding:8px 20px 10px}
.rv .foot .status{font-size:13px;min-height:1.3em;margin-bottom:6px;color:var(--muted)}
.rv .foot .status.err{color:var(--err)}.rv .foot .status.ok{color:var(--ok)}
.rv .foot .row2{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.rv .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:rvspin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes rvspin{to{transform:rotate(360deg)}}
.rv .spacer{height:120px}
/* SK, 23 Nov 2026 (VW-25): the other clips of a row, and a scene a trim left short or long */
.rv .oth{grid-column:1/-1;margin-top:4px;border-top:1px solid var(--line);padding-top:6px;cursor:default}
.rv .pc{display:grid;grid-template-columns:200px minmax(0,1fr);gap:4px 10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line)}
.rv .pc>:first-child{grid-row:1/3}.rv .pc>:last-child{grid-column:2}
.rv .pc.sel{outline:2px solid var(--accent);border-radius:8px}
.rv .pc video,.rv .pc .nopv{width:200px;height:112px;max-height:none;border-radius:8px;background:#000}
.rv .pc .nopv{display:flex;align-items:center;justify-content:center;color:#bbb;font-size:12px;text-align:center}
@media (max-width:560px){.rv .pc{grid-template-columns:1fr}.rv .pc>:first-child{grid-row:auto}.rv .pc>:last-child{grid-column:1}}
.rv .bal{margin-top:6px;padding:8px 10px;border:2px solid var(--err);border-radius:10px;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg)}
.rv .bal button{padding:4px 10px;font-size:12.5px;border-radius:999px}
</style>
<div class="rv" id="app" data-code="{{ run.code }}">
  <div class="top">
    <h1>Review · {{ run.code }} <small>{{ run.title }}</small></h1>
    <div class="line" id="line">Loading…</div>
  </div>
  <div class="grid">
    <div class="left">
      <video id="film" controls preload="metadata" playsinline hidden></video>
      <div class="nofilm" id="nofilm">Loading…</div>
      <div class="now" id="now"></div>
      <label class="pause"><input type="checkbox" id="pauseon"> Pause for answers (the film stops after each shot that still needs your answer)</label>
      <div class="wait" id="wait" hidden><span id="waittext"></span><button id="goon">Continue</button></div>
    </div>
    <div class="right" id="slides"></div>
  </div>
  <div class="spacer"></div>
  <div class="foot"><div class="in"><div class="status" id="fmsg"></div><div class="row2" id="action"></div></div></div>
</div>
<script>
(function(){
const code=document.getElementById('app').dataset.code, base='/runs/'+code+'/review';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let detOpen=false, data=null, timer=null, open=null, inflight=false, filmKey=null, current=null, waitingFor=null;
const passed=new Set();   // shots the viewer chose to play past without answering, this viewing
// design/127: a footage shot KEEP / REJECT / TRIM; the AI shot of an all-AI scene Keep AI (KEEP) / Find footage (REJECT); an alternative KEEP / REJECT once its shot is rejected
// SK, 23 Nov 2026 (VW-25): Other clips on a footage shot and Find footage on an all-AI scene open the same list (the server's order); "Use this" is the answer SWAP
const CHOICES={shot:[['KEEP','Keep'],['REJECT','Reject'],['TRIM','Trim'],['OTHERS','Other clips']],alternative:[['KEEP','Keep'],['REJECT','Reject']],ai:[['KEEP','Keep AI'],['OTHERS','Find footage']]};
const KINDS={exact:'shows what the words say',partly:'shows part of what the words say',related:'related to the words',chapter:'from the same chapter','b-roll':'B-roll'};
function said(s,a){   // an answer in plain words
  if(a.action==='SWAP'){return 'Other clip: '+((a.swap&&a.swap.clip)||'');}
  if(a.action==='TRIM'){return 'Trim: '+(a.edit_text||a.edit||'');}
  if(s.type==='ai'){return a.action==='KEEP'?'Keep AI':'Find footage: the assistant is asked';}
  return a.action;
}
let pauseOn=true; try{pauseOn=localStorage.getItem('vw-review-pause')!=='off';}catch(e){}
$('pauseon').checked=pauseOn;
$('pauseon').addEventListener('change',()=>{pauseOn=$('pauseon').checked;try{localStorage.setItem('vw-review-pause',pauseOn?'on':'off');}catch(e){}if(!pauseOn)resume();});
function msg(t,err,busy){const f=$('fmsg');f.innerHTML=(busy?'<span class="spin"></span>':'')+esc(t||'');f.className='status '+(err?'err':(busy?'':'ok'));}
async function act(body){
  if(inflight){throw new Error('Still recording the last answer; try again in a moment.');}
  inflight=true;
  try{
    const r=await fetch(base+'/act',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    let j=null;try{j=await r.json();}catch(e){j=null;}
    if(!r.ok){throw new Error((j&&j.message)||('The server answered '+r.status+'.'));}
    return j;
  }finally{inflight=false;}
}
async function load(){
  let r;
  try{r=await fetch(base+'/data',{cache:'no-store'});}catch(e){msg('The server is not reachable; trying again in 15 s.',true);schedule();return;}
  if(r.status===401){location.href='/login?next='+encodeURIComponent(base);return;}
  if(!r.ok){msg('The page could not load ('+r.status+').',true);schedule();return;}
  data=await r.json();
  draw();fit();
}
function schedule(){clearTimeout(timer);timer=setTimeout(load,15000);}
function fmt(s){s=Math.max(0,Math.round(Number(s)||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function stage(){return data&&data.run?data.run.stage:null;}
function decidable(){return !data.master_built&&((stage()==='master'&&data.accepted)||(stage()==='options'&&!!data.film));}   // design/98 D1: the first answer approves the options
function cue(slide){const c=data&&data.cues?data.cues[slide]:null;return Array.isArray(c)?c:null;}
function row(s,can){
  const c=cue(s.slide);
  const off=!s.needs_answer&&s.why;
  let info='<div><div class="t">'+(s.b_roll?'<span class="broll">B-roll</span>':'')+(s.library?'<span class="broll">library · from '+esc(s.library)+'</span>':'')+esc(s.title)+(s.type==='ai'?' · made with AI':'')+'</div>';
  if(s.clip){info+='<div class="ds">'+esc(s.clip)+'</div>';}
  if(s.words){info+='<div class="words">“'+esc(s.words)+'”</div>';}
  if(s.type==='alternative'){info+='<div class="ds">the same words as '+esc(s.of)+'</div>';}
  if(s.type==='ai'&&s.intent){info+='<div class="ds">For AI: '+esc(s.intent)+'</div>';}
  if(s.flags&&s.flags.length){info+='<div class="q">'+esc('Has: '+s.flags.join('; '))+'</div>';}
  if(s.note&&s.note.question){info+='<div class="q">Question: '+esc(s.note.question)+'</div>';}
  if(s.marker_reasons){info+='<div class="q">Timing: '+esc(Object.values(s.marker_reasons).join('; '))+'</div>';}
  info+='<div class="ds">'+esc(s.hint||'')+' · '+fmt(s.seconds)+(c?' · at '+fmt(c[0]):'')+'</div></div>';
  let ans='';
  if(!s.answerable){ans='<span class="ds">nothing to answer</span>';}
  else if(off){ans='<span class="ds">'+esc(s.why)+'</span>'+(s.answer?'<div class="ans">'+esc(s.answer.action)+' (not used)</div>':'');}
  else{
    const a=s.answer;
    const on=v=>a&&(a.action===v||(v==='OTHERS'&&(a.action==='SWAP'||(s.type==='ai'&&a.action==='REJECT'))));
    if(can){ans='<div class="btns">'+(CHOICES[s.type]||[]).map(([v,l])=>'<button data-slide="'+esc(s.slide)+'" data-act="'+v+'" class="'+(on(v)?'on':'')+'">'+l+'</button>').join('')+'</div>';}
    if(a){ans+='<div class="ans"><b>'+esc(said(s,a))+'</b>'+(a.note?' · '+esc(a.note):'')+'</div>';}
    if(!can){ans+='<span class="ds">'+(data.accepted?(data.master_built?'no answer':'waiting'):'after the film')+'</span>';}
  }
  return '<div data-slide="'+esc(s.slide)+'" class="row'+(s.type==='alternative'?' alt':'')+(off?' off':'')+(current===s.slide?' cur':'')+'">'+info+'<div>'+ans+'</div>'+(open&&open.slide===s.slide?form(open):'')+'</div>';
}
function draw(){
  const d=data; const film=$('film'), no=$('nofilm');
  if(d.state!=='prepared'){
    $('line').textContent=d.state==='not_prepared'?'The options stage has not started yet.':d.state==='old_form'?d.message:'No options proposed yet; the assistant proposes them in chat.';
    film.hidden=true;no.hidden=false;no.textContent=$('line').textContent;$('slides').innerHTML='';$('action').innerHTML='';return;
  }
  // SK, 15 Nov 2026: one line the reviewer must read, large; the record of the version, the approval and the second look sits behind Details
  let st; const bal=d.master_built?[]:(d.balance||[]);   // SK, 23 Nov 2026: the scenes a trim left short or long; "all answered" waits for them
  if(!d.accepted&&stage()==='options'){st=d.film?'Answer each shot. Your first answer approves these options.':'The review film is not ready yet.';}
  else if(!d.accepted){st='This version is not the recorded one. The assistant proposes or records in chat.';}
  else if(d.master_built){st='Answers closed. The master film is built.';}
  else if(bal.length){st=(bal.length===1?bal[0].text:bal.length+' scenes do not add up after a trim.')+' Fix it under the scene before the master film.';}
  else if(d.of&&d.answered>=d.of){st='All '+d.of+' answered. The assistant builds the master film next.';}
  else{st=d.answered+' of '+d.of+' answered. '+(d.of-d.answered)+' left.';}
  let det='<div>Version '+esc(d.version)+(d.accepted&&d.approved_by&&d.approved_by.slide?' · Options approved by your first answer (#'+esc(d.approved_by.slide)+', '+esc(String(d.approved_by.at||'').slice(11,16))+')':'')   // design/98 D6
    +(d.accepted&&!d.master_built&&d.waiting&&d.waiting.length?' · waiting: '+esc(d.waiting.join(', ')):'')+'</div>';
  const sl=d.second_look;   // design/129 P4: whether the second look ran on this version, and what it changed
  det+='<div>'+(sl?'Second look: ran '+esc(String(sl.at||'').slice(0,16).replace('T',' '))+' (the assistant checked its own cut before showing it) · '+esc(sl.scenes)+' scenes · '+esc(sl.changed.length)+' changed'+(sl.changed.length?' ('+esc(sl.changed.join(', '))+')':'')+
    ' · '+esc(Object.keys(sl.unchanged||{}).length)+' unchanged'+(sl.no_fix_file.length?' · no fix file for '+esc(sl.no_fix_file.join(', ')):'')+(sl.edited_after?' · <span class="err">the cut was changed after the second look</span>':'')+
    sl.fixes.map(f=>'<div>Changed by the second look, nothing to approve: '+esc(f.scene)+(f.option?' · option '+esc(f.option):'')+(f.why?': '+esc(f.why):'')+'</div>').join('')
    :'Second look: not recorded for this version')+'</div>';
  let line=(bal.length&&d.accepted?'<div class="st err">':'<div class="st">')+esc(st)+'<a id="more" role="button" tabindex="0" aria-expanded="'+(detOpen?'true':'false')+'">'+(detOpen?'Hide details':'Details')+'</a></div>';
  if(d.run&&d.run.open_defects&&d.run.open_defects.length){line+='<div class="st err">A defect is open on this run. Nothing can be recorded until it is fixed.</div>';}
  line+='<div class="det"'+(detOpen?'':' hidden')+'>'+det+'</div>';
  $('line').innerHTML=line;fit();
  const more=$('more'),flip=()=>{detOpen=!detOpen;draw();};more.addEventListener('click',flip);more.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}});
  clearTimeout(timer);
  if(d.film){
    no.hidden=true;film.hidden=false;
    if(filmKey!==d.film.key){filmKey=d.film.key;film.src='/runs/'+code+'/film/'+d.film.key;}
  }else{
    film.hidden=true;no.hidden=false;filmKey=null;film.removeAttribute('src');
    const r=d.render;
    if(!r){no.textContent='The review film is not rendered yet; the assistant runs vw options render.';}
    else if(!r.current){no.textContent='The film on record is of an earlier version; the assistant renders this version again.';}
    else if(r.status==='ready'){no.textContent='The film is ready but not on record; reload in a moment.';schedule();}
    else if(r.status==='queued'||r.status==='running'){no.innerHTML='<span class="spin"></span>The review film is rendering ('+esc(r.status)+'); this page checks again every 15 s.';schedule();}
    else{no.textContent='The render '+esc(r.status||'failed')+(r.error?': '+r.error:'')+'. The assistant renders again.';}
  }
  // one coloured block per scene, its shots and alternatives under it
  const can=decidable(); let html='', inScene=false;
  for(const s of d.slides){
    if(s.type==='scene'){
      if(inScene){html+='</div>';}
      inScene=true;
      html+='<div class="scene" style="--sc:'+esc(s.colour)+';background:'+esc(s.colour)+'1f"><div class="head" data-slide="'+esc(s.slide)+'"><b>'+esc(s.lines[0])+' · '+esc(s.lines[1]||'')+'</b><span>'+esc(s.lines[2]||'')+' - '+esc(s.lines[3]||'')+'</span></div>';
      const b=can?bal.find(x=>String(x.scene)===String(s.number)):null;   // one click hands the time to a shot of the same scene
      if(b){html+='<div class="bal"><b class="err">'+esc(b.text)+'</b>'+(b.takers.length?'<span>'+(b.short?'Give ':'Take ')+esc(b.seconds)+' s '+(b.short?'to':'from')+':</span>'
        +b.takers.map(t=>'<button data-bal="'+esc(t.slide)+'" data-edit="'+esc(t.edit)+'">'+esc(t.title.split(' · ').pop())+(t.edit==='in:0,out:0'?' (undo its trim)':'')+'</button>').join('')
        :'<span>No shot of this scene can take it: change the trim.</span>')+'</div>';}
    }else{html+=row(s,can);}
  }
  if(inScene){html+='</div>';}
  $('slides').innerHTML=html;
  $('slides').querySelectorAll('button[data-act]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();choose(b.dataset.slide,b.dataset.act);}));
  $('slides').querySelectorAll('[data-slide]').forEach(el=>{if(el.tagName==='BUTTON')return;el.addEventListener('click',e=>{if(e.target.closest('button,input,label,.oth,.form'))return;seek(el.dataset.slide);});});
  $('slides').querySelectorAll('button[data-bal]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();send({action:'decide',slide:b.dataset.bal,decision:'TRIM',edit:b.dataset.edit});}));
  if(open){const f=$('f-'+open.slide);if(f){
    const on=(sel,fn)=>f.querySelectorAll(sel).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();fn(b);}));
    on('button.go',()=>submit(open.slide));on('button.no',()=>{open=null;draw();});
    on('button.use',b=>send({action:'decide',slide:open.slide,decision:'SWAP',sub_clip_id:b.dataset.sub}));
    on('button.more',()=>{open.shown+=6;draw();});
    on('button.ask',()=>send({action:'decide',slide:open.slide,decision:'REJECT'}));
    f.querySelectorAll('video').forEach(v=>v.addEventListener('play',()=>$('film').pause()));   // a preview plays alone
    const first=f.querySelector('input');if(first)first.focus();}}
  const help='Watch the film and answer each shot. Keep: use it. Reject: not this one; an AI stretch takes its place (a reason is optional). Trim: use it with its start or end moved. '
    +'Other clips: put a different clip on this shot. B-roll is marked in dark red: it is fine to reject. An alternative (dashed) is another clip for the same words: it opens when you reject its shot. Keep AI / Find footage: for a scene made only with AI.';
  if(!d.accepted&&stage()==='options'){$('action').innerHTML='<span>'+esc(help)+' Your first answer approves these options.</span>';}   // design/98 D1
  else if(d.accepted&&bal.length){$('action').innerHTML='<span class="err">'+esc(bal.map(b=>b.text).join(' '))+' The master film cannot be built until each scene adds up: use the buttons under the scene.</span>';}
  else if(d.accepted&&stage()==='master'&&d.of&&d.answered>=d.of){$('action').innerHTML='<span>All '+d.of+' answered. Tell the assistant to build the master film (vw master build); an answer can still be changed here until then.</span>';}
  else if(d.accepted&&stage()==='master'){$('action').innerHTML='<span>Click a row to see it in the film. '+esc(help)+'</span>';}
  else{$('action').innerHTML='<span>'+esc(d.run&&d.run.stage?('The run is at '+d.run.stage+'.'):'')+'</span>';}
}
function form(o){
  if(o.action==='REJECT'){return '<div class="form" id="f-'+esc(o.slide)+'"><input class="w" placeholder="Why? (optional)"><button class="go">Save</button><button class="no">Close</button></div>';}   // design/98 R1
  if(o.action==='OTHERS'){return others(o);}
  // SK, 23 Nov 2026 (VW-25): a trim is typed in seconds, with what the shot can lose and gain; the server checks it when it is recorded. Older way retired on the page: source frames
  return '<div class="form" id="f-'+esc(o.slide)+'"><label>Start later by</label><input class="f" type="number" step="0.1" value="0"><label>s</label><label>End earlier by</label><input class="f" type="number" step="0.1" value="0"><label>s</label>'
    +'<button class="go">Record trim</button><button class="no">Cancel</button><span class="ds"><span class="room">'+esc(o.room||'')+'</span> A minus value lengthens that end. If the scene no longer adds up, the page says so and offers the shots that can take the time.</span></div>';
}
function others(o){
  const l=o.list; let h='<div class="oth" id="f-'+esc(o.slide)+'">';
  if(!l){return h+'<span class="ds"><span class="spin"></span>Finding other clips…</span></div>';}
  h+='<div class="ds">'+(l.pieces.length?'Other clips for '+esc(l.title)+' ('+esc(l.seconds)+' s), best first. “Use this” puts the clip here; no other answer changes. The review film is not made again: the master film shows it.':esc(l.empty))+'</div>';
  l.pieces.slice(0,o.shown).forEach(p=>{
    const m=p.media||{};
    h+='<div class="pc'+(p.chosen?' sel':'')+'">'+(m.key?'<video controls muted playsinline preload="metadata" src="/runs/'+code+'/film/'+m.key.split('/').map(encodeURIComponent).join('/')+'#t='+m.in_s+','+m.out_s+'"></video>':'<div class="nopv">No preview here'+(p.library?' (library clip)':'')+'</div>')
      +'<div><div class="t">'+esc(p.clip||p.sub_clip_id)+(p.grade?' · grade '+esc(p.grade):'')+'</div><div class="ds">'+esc(KINDS[p.kind]||p.kind)+(p.chapter?' · chapter “'+esc(p.chapter)+'”':'')+'</div>'
      +(p.what?'<div class="words">'+esc(p.what)+'</div>':'')+(p.flags&&p.flags.length?'<div class="q">'+esc('Has: '+p.flags.join('; '))+'</div>':'')+'</div>'
      +'<div>'+(p.chosen?'<span class="ok">In use here</span>':p.can?'<button class="use" data-sub="'+esc(p.sub_clip_id)+'">Use this</button>':'<span class="ds">Cannot be used: '+esc(p.why)+'</span>')+'</div></div>';
  });
  return h+'<div class="form">'+(l.pieces.length>o.shown?'<button class="more">Show '+Math.min(6,l.pieces.length-o.shown)+' more</button>':'')+(o.ai?'<button class="ask">None of these: ask the assistant</button>':'')+'<button class="no">Close</button></div></div>';
}
async function choose(slide,action){
  if(action==='REJECT'){open=null;const j=await send({action:'decide',slide,decision:'REJECT'});if(j){open={slide,action};draw();}return;}   // design/98 R1: recorded at once; a reason may follow
  if(action==='TRIM'){
    open={slide,action,room:''};draw();
    try{const j=await act({action:'room',slide});if(open&&open.slide===slide&&open.action==='TRIM'){open.room=j.text;const el=$('f-'+slide)&&$('f-'+slide).querySelector('.room');if(el)el.textContent=j.text;}}catch(err){msg(err.message,true);}
    return;}
  if(action==='OTHERS'){
    const s=data.slides.find(x=>x.slide===slide);open={slide,action,list:null,shown:6,ai:!!(s&&s.type==='ai')};draw();
    try{const j=await act({action:'others',slide});if(open&&open.slide===slide&&open.action==='OTHERS'){open.list=j;draw();}}catch(err){open=null;draw();msg(err.message,true);}
    return;}
  open=null;await send({action:'decide',slide,decision:action});
}
async function submit(slide){
  const f=$('f-'+slide); if(!f||!open)return;
  if(open.action==='REJECT'){const why=f.querySelector('input').value.trim();if(!why){open=null;draw();return;}await send({action:'decide',slide,decision:'REJECT',note:why});return;}
  const v=[...f.querySelectorAll('input')].map(i=>parseFloat(i.value||'0')||0);
  if(!v[0]&&!v[1]){msg('Give the seconds to trim, at the start or at the end.',true);return;}
  await send({action:'decide',slide,decision:'TRIM',edit:'start:'+v[0]+',end:'+v[1]});
}
async function send(body){
  msg('Recording #'+body.slide+'…',false,true);
  try{const j=await act(body);open=null;msg((j.options_approved?'Options approved by this first answer. ':'')+'#'+j.slide+' '+({SWAP:'other clip',TRIM:'trim ('+j.edit_text+')'}[j.action]||String(j.action))+' recorded ('+j.decided+' of '+j.of+').');
    if(j.view){data=j.view;draw();fit();}else{await load();}
    const w=waitingFor&&data&&data.slides?data.slides.find(x=>x.slide===waitingFor):null;
    if(waitingFor&&(!w||!w.needs_answer||w.answer)){resume();}   // answered, or it no longer needs an answer (its shot was kept): the film goes on
    return j;}
  catch(err){msg(err.message,true);return null;}   // the film stays paused; nothing is recorded twice (one request at a time)
}
function unwait(){waitingFor=null;$('wait').hidden=true;}
function seek(slide){const c=cue(slide);if(!c||!filmKey)return;const f=$('film');unwait();f.currentTime=c[0];passed.delete(slide);f.play().catch(()=>{});}
function resume(){unwait();const f=$('film');if(f.paused&&filmKey){f.play().catch(()=>{});}}
$('goon').addEventListener('click',()=>{if(waitingFor){passed.add(waitingFor);}resume();});
// SK, 23 Nov 2026 (VW-25): Play pressed on the film itself, or a click on a row, while the film waited for an answer left the wait set, and the film then
// never stopped at any later shot. Play on the film is now the same as Continue; a click on a row ends the wait (seek above).
$('film').addEventListener('play',()=>{if(waitingFor){passed.add(waitingFor);unwait();}});
$('film').addEventListener('timeupdate',()=>{
  if(!data||!data.cues)return;const f=$('film'), t=f.currentTime;let best=null,bt=-1;
  for(const s of data.slides){const c=cue(s.slide);if(!c)continue;
    if(s.type==='alternative'&&!s.needs_answer&&s.why&&/is kept/.test(s.why)&&t>=c[0]&&t<c[1]-0.1){f.currentTime=c[1];return;}   // design/127: a switched-off alternative is skipped
    if(s.type!=='scene'&&c[0]<=t+0.05&&c[0]>bt){bt=c[0];best=s.slide;}}
  if(best!==current){current=best;$('slides').querySelectorAll('.row').forEach(el=>el.classList.toggle('cur',el.dataset.slide===current));
    const s=data.slides.find(x=>x.slide===current);$('now').textContent=s?('Now: '+s.title+(s.b_roll?' · B-roll':'')):'';
    const el=$('slides').querySelector('.row.cur'), ae=document.activeElement, typing=ae&&/^(TEXTAREA|INPUT|SELECT)$/.test(ae.tagName)&&$('slides').contains(ae);
    if(el&&!typing)el.scrollIntoView({block:'nearest'});}   // design/126 U1: the list follows the film when the shot changes, never while a note is typed
  if(!pauseOn||waitingFor||f.paused)return;
  for(const s of data.slides){   // design/127: stop at the end of a shot that still needs an answer
    const c=cue(s.slide);
    if(!c||!s.needs_answer||s.answer||passed.has(s.slide)||s.type==='scene')continue;
    if(t>=c[1]-0.15&&t<c[1]+0.5){f.pause();waitingFor=s.slide;$('waittext').textContent='Answer to continue: '+s.title+'.';$('wait').hidden=false;
      const el=$('slides').querySelector('.row[data-slide="'+CSS.escape(s.slide)+'"]');if(el)el.scrollIntoView({block:'nearest'});break;}
  }
});
function fit(){const a=$('app');a.style.setProperty('--top-h',a.querySelector('.top').offsetHeight+'px');a.style.setProperty('--foot-h',a.querySelector('.foot').offsetHeight+'px');}
if(window.ResizeObserver){const ro=new ResizeObserver(fit);ro.observe($('app').querySelector('.top'));ro.observe($('app').querySelector('.foot'));}
window.addEventListener('resize',fit);$('app').querySelector('.top').addEventListener('toggle',fit,true);fit();
load();
})();
</script>
