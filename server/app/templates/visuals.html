{% extends "base.html" %}
{% block title %}Visuals · {{ run.code }} · VideoWizard{% endblock %}
{% block body %}
<style>
/* design/78: the visuals page on the voices page's frame (design/55): six steps on one line, one view at a time, the footer with the words and the step's action */
.v2 .top{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.v2 .steps{display:flex;gap:14px;font-size:16px;align-items:center;flex-wrap:wrap}
.v2 .steps a{color:var(--muted);text-decoration:none;cursor:pointer;padding:4px 2px}
.v2 .steps a.on{color:var(--fg);font-weight:700;border-bottom:2px solid var(--fg)}
.v2 .steps a.off{opacity:.45;cursor:default}
.v2 .dir{font-size:13px;color:var(--muted);margin-top:6px}
.v2 .dir strong{color:var(--fg)}
.v2 .meter{display:inline-flex;align-items:center;gap:8px;margin-left:12px;font-size:12.5px}
.v2 .meter .bar{display:inline-block;width:120px;height:8px;border-radius:999px;background:var(--z);overflow:hidden;vertical-align:middle;border:1px solid var(--line)}
.v2 .meter .bar i{display:block;height:100%;background:var(--accent)}
.v2 .meter .bar i.over{background:var(--err)}
.v2 .tabs{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
.v2 .tabs button{border:1px solid var(--line);background:var(--bg);padding:7px 16px;border-radius:999px;font-size:14px}
.v2 .tabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.v2 .search{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.v2 .search input{flex:1;min-width:200px;padding:11px 14px;font-size:15px;border-radius:12px}
.v2 .chip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--bg);font-size:12.5px;cursor:pointer}
.v2 table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.v2 th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--card);white-space:nowrap}
.v2 td{padding:11px 12px;vertical-align:top;border-bottom:1px solid var(--line)}
.v2 tbody tr:last-child td{border-bottom:0}
.v2 tbody tr:nth-child(even) td{background:var(--z)}
.v2 tbody tr:hover td{background:var(--hover)}
.v2 tbody tr.sel td{background:var(--sel)}
.v2 td.c{text-align:center;white-space:nowrap;width:56px}
.v2 .nm{font-weight:600;font-size:15px}
.v2 .ds{color:var(--muted);font-size:12.5px;margin-top:2px}
.v2 .badge{display:inline-block;font-size:11px;letter-spacing:.03em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);margin-right:6px;vertical-align:1px;white-space:nowrap}
.v2 .badge.ok{border-color:var(--ok);color:var(--ok)}
.v2 .badge.dec{border-color:var(--accent);color:var(--fg)}
.v2 .badge.err{border-color:var(--err);color:var(--err)}
.v2 .ic{border:none;background:none;font-size:18px;cursor:pointer;padding:4px 8px;color:var(--fg);border-radius:8px}
.v2 .ic:hover{background:var(--hover)}
.v2 input[type=checkbox],.v2 input[type=radio]{min-width:0;width:16px;height:16px;margin:0;vertical-align:middle;accent-color:var(--accent)}
.v2 .empty{color:var(--muted);padding:40px 12px;font-size:15px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.v2 .msg{min-height:1.2em;font-size:13px;margin:8px 0}
.v2 .err{color:var(--err)}.v2 .ok{color:var(--ok)}
.v2 h3{font-size:13px;color:var(--muted);font-weight:500;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.v2 .intended{font-size:13px;margin:4px 0 8px;padding-left:18px}
.v2 .intended li{margin:0}
.v2 .two{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media (max-width:760px){.v2 .two{grid-template-columns:1fr}}
.v2 .list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.v2 .list a{display:block;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--fg);text-decoration:none}
.v2 .list a:last-child{border-bottom:0}
.v2 .list a.on{background:var(--sel)}
.v2 .list a .ds{margin-top:1px}
.v2 .card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px;background:var(--card)}
.v2 .strip{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.v2 .pic{width:160px;min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--z);font-size:12px;position:relative}
.v2 .pic img{display:block;width:100%;height:90px;object-fit:cover;background:#000;cursor:pointer}
.v2 .pic .cap{padding:4px 6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2 .pic.on{border-color:var(--ok)}
.v2 .pic.off{opacity:.55;border-style:dashed}
.v2 .pic button{margin:0 6px 6px;padding:3px 9px;font-size:12px;border-radius:999px}
.v2 .pic .tick{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.v2 .pic .tick.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.v2 .pic textarea.note{width:calc(100% - 12px);margin:0 6px 6px;min-height:34px;font-size:11.5px;border-radius:6px;padding:4px 6px}
.v2 .chips{display:flex;gap:4px;flex-wrap:wrap;margin:0 6px 6px}
.v2 .chips button{font-size:11px;padding:1px 7px;border-radius:999px;margin:0}
.v2 .chk{margin:2px 6px 6px;padding-left:14px;font-size:11.5px;color:var(--muted);white-space:normal}
.v2 .chk li{margin:0}
.v2 .btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.v2 .btns button{padding:4px 10px;font-size:12.5px;border-radius:999px}
.v2 .btns button.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.v2 .need-words{border-color:var(--err)!important;box-shadow:0 0 0 2px var(--err)}
.v2 .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.v2 .lightbox img{max-width:90vw;max-height:70vh;background:#000}
.v2 .lightbox .bar{display:flex;gap:10px;align-items:center;color:#eee;font-size:13px;flex-wrap:wrap;justify-content:center}
.v2 .lightbox textarea{min-width:280px;min-height:36px;font-size:13px;border-radius:8px;padding:6px 8px}
.v2 .foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:6}
.v2 .foot .in{max-width:1100px;margin:0 auto;padding:8px 20px 10px}
.v2 .foot .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.v2 .foot .status{font-size:13px;min-height:1.3em;margin-bottom:6px;color:var(--muted)}
.v2 .foot .status.err{color:var(--err)}
.v2 .foot .status.ok{color:var(--ok)}
.v2 .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:v2spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes v2spin{to{transform:rotate(360deg)}}
.v2 .player{display:flex;gap:12px;align-items:center;margin:0 0 8px;font-size:13px}
.v2 .player[hidden]{display:none}
.v2 .player span{flex:0 0 220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--fg)}
.v2 .player video{flex:1;width:100%;max-height:220px;background:#000;border-radius:8px}
.v2 .tray{flex:1;font-size:13px;color:var(--muted);min-width:120px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.v2 .foot .go{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);padding:10px 18px;font-size:14px;border-radius:10px;white-space:nowrap}
.v2 .foot .go:disabled{opacity:.45}
.v2 .foot button{white-space:nowrap}
.v2 .why{font-size:12px;color:var(--muted);margin-left:8px;white-space:nowrap}
.v2 .words{flex:1;min-width:240px;padding:8px 10px;font-size:14px;border-radius:10px;min-height:38px;resize:vertical}
.v2 .spacer{height:170px}
</style>
<div class="v2" id="app" data-code="{{ run.code }}">
<div class="top">
  <div class="steps" id="steps"></div>
  <div class="dir" id="line">Loading…</div>
</div>
<div class="msg" id="msg"></div>
<section id="s-treatment"></section>
<section id="s-plan" hidden></section>
<section id="s-references" hidden></section>
<section id="s-pictures" hidden></section>
<section id="s-takes" hidden></section>
<section id="s-record" hidden></section>
<div class="spacer"></div>
<div class="foot"><div class="in"><div class="status" id="fmsg"></div>
<div class="player" id="player" hidden><span id="pl-name" class="ds">nothing playing</span><video id="pl" controls preload="metadata"></video></div>
<div class="row"><div class="tray" id="tray"></div><span id="action"></span></div>
</div></div>
</div>
<script>
(function(){
const code=document.getElementById('app').dataset.code, base='/runs/'+code+'/visuals';
const STEPS=[['treatment','Treatment'],['plan','Plan'],['references','References'],['pictures','Pictures'],['takes','Takes'],['record','Record']];
const ROUTE={video:'AI video',still:'still',graphic_sequence:'graphic sequence',footage:'footage'};
const CHIPS=['avoid brand text','posture only, not the person','colour only'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
let data=null, timer=null, inflight=false, step=null, selEl=null, gapFilter='', selGaps={}, seqTicks={};
const picks={};   // search id -> [{n, note}] in the order ticked (design/73)
function remember(k,v){try{localStorage.setItem('vz:'+code+':'+k,v);}catch(e){}}
function recall(k){try{return localStorage.getItem('vz:'+code+':'+k);}catch(e){return null;}}
function msg(t,err,busy){const f=$('fmsg');f.innerHTML=(busy?'<span class="spin"></span>':'')+esc(t||'');f.className='status '+(err?'err':(busy?'':'ok'));}
function needWords(id,text){const e=$(id);if(e){e.classList.add('need-words');e.focus();e.addEventListener('input',()=>e.classList.remove('need-words'),{once:true});}msg(text||'Your words are required: type them in the box at the foot first.',true);}   // design/74 L31
async function act(body){
  if(inflight){throw new Error('Still recording the last action; try again in a moment.');}
  inflight=true;
  try{const r=await fetch(base+'/act',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j=null;try{j=await r.json();}catch(e){j=null;}
    if(!r.ok){throw new Error((j&&j.message)||('The server answered '+r.status+'.'));}return j;}
  finally{inflight=false;}
}
async function send(body,okText){msg('Recording…',false,true);try{const j=await act(body);msg(okText||'Recorded.');if(j&&j.view){data=j.view;render();}else{await load();}return j;}catch(err){msg(err.message,true);return null;}}
async function load(){
  let r;
  try{r=await fetch(base+'/data',{cache:'no-store'});}catch(e){msg('The server is not reachable; trying again in 15 s.',true);schedule(15000);return;}
  if(r.status===401){location.href='/login?next='+encodeURIComponent(base);return;}
  if(!r.ok){msg('The page could not load ('+r.status+').',true);schedule(15000);return;}
  data=await r.json();render();
}
function schedule(ms){clearTimeout(timer);timer=setTimeout(load,ms||15000);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&data){load();}});   // design/74 L29
function stage(){return data&&data.run?data.run.stage:null;}
function fmt(frames){const fps=Number(data&&data.fps)||25;const s=Math.max(0,Math.round(frames/fps));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function secs(frames){const fps=Number(data&&data.fps)||25;return (frames/fps).toFixed(1)+' s';}
function words(){return (($('words')||{}).value||'').trim();}
function autoStep(){const d=data;if(!d||d.state!=='prepared')return 'treatment';
  if(!d.treatment||d.treatment_draft)return 'treatment';
  if(!d.plan_digest||d.gaps.some(g=>!g.accepted&&!g.recorded&&g.shots.length))return 'plan';
  const els=(d.elements||[]).filter(e=>e.kind!=='graphic');
  if(roundOpen()||els.some(e=>!(d.references||[]).some(r=>r.element_id===e.id&&r.kind==='sheet'&&r.status==='approved')))return 'references';
  if(d.gaps.some(g=>g.accepted&&!g.recorded&&g.shots.some(s=>s.route!=='video'&&!s.asset)))return 'pictures';
  if(d.gaps.some(g=>g.accepted&&!g.recorded&&g.shots.some(s=>s.route==='video'&&!s.takes.some(k=>k.selected))))return 'takes';
  return 'record';}
function go(s){step=s;remember('step',s);render();window.scrollTo(0,0);}
// ---------- frame ----------
function frame(){
  const d=data;
  $('steps').innerHTML=STEPS.map(([k,l])=>'<a data-s="'+k+'" class="'+(k===step?'on':'')+'">'+l+'</a>').join('<span class="ds">›</span>');
  $('steps').querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>go(a.dataset.s)));
  if(!d||d.state!=='prepared'){$('line').textContent='The visuals stage has not started: the assistant runs vw visuals prepare.';return;}
  const b=d.budget||{}, over=b.spent_inr>b.cap_inr, pct=b.cap_inr?Math.min(100,Math.round(100*b.spent_inr/b.cap_inr)):0;
  const meter='<span class="meter">spend '+inr(b.spent_inr)+' of '+inr(b.cap_inr)+' <span class="bar"><i class="'+(over?'over':'')+'" style="width:'+pct+'%"></i></span></span>';
  const t=d.treatment, dr=d.treatment_draft, at=autoStep();
  let line=stage()!=='visuals'?'The run is at <strong>'+esc(d.run.stage)+'</strong>.':(dr?(t?'<strong>New treatment draft</strong>: it replaces the approved one; read it and approve it at the foot':'<strong>Treatment drafted</strong>: read it and approve it at the foot'):(!t?'The assistant is preparing the treatment':'<strong>'+esc(STEPS.find(x=>x[0]===at)[1])+'</strong> is the step the run is at'));
  if(d.run&&d.run.open_defects&&d.run.open_defects.length){line+=' · <span class="err">a defect is open; nothing can be recorded until it is fixed</span>';}
  $('line').innerHTML=line+meter;
}
// ---------- treatment ----------
function intendedBlock(){const iv=data.intended_visuals||[];if(!iv.length)return '';return '<h3>The script\'s intended visuals</h3><div class="card">'+iv.map(e=>'<div class="ds"><b>'+esc(e.heading||'(no heading)')+'</b>'+(e.narration_starts?' · “'+esc(e.narration_starts)+'…”':'')+'</div><ul class="intended">'+e.lines.map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>').join('')+'</div>';}
function renderTreatment(){
  const d=data, t=d.treatment, dr=d.treatment_draft, tr=dr||t, recorded=!!t&&!dr, replaces=dr&&t?t.at:null;
  if(!tr){$('s-treatment').innerHTML=intendedBlock()+'<div class="empty">The treatment, gap by gap, appears here once the assistant drafts it.</div>';return;}
  const byGap={};(tr.gaps||[]).forEach(e=>byGap[e.gap_id]=e);
  const rows=d.gaps.map(g=>{const e=byGap[g.gap_id]||{};
    return '<tr><td><span class="nm">'+esc(g.gap_id)+'</span><div class="ds">'+esc(g.requirement||'')+'</div></td><td>'+(e.intended&&e.intended.length?'<ul class="intended">'+[].concat(e.intended).map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>':'<span class="ds">none in the script</span>')+(e.departure?'<div class="ds err">departs: '+esc(e.departure)+'</div>':'')+'</td><td>'+esc(e.picture||'')+'</td><td class="ds">'+esc((e.routes||[]).map(r=>ROUTE[r]||r).join(', '))+'</td><td class="c">'+esc(e.seconds!=null?e.seconds+' s':'')+'</td><td class="c">'+esc(e.images!=null?e.images:'')+'</td></tr>';}).join('');
  const tot=tr.totals||{};
  const badge=recorded?'approved '+esc(String(tr.at||'').slice(0,16).replace('T',' ')):(replaces?'draft, replaces the approved treatment of '+esc(String(replaces).slice(0,16).replace('T',' ')):'draft');
  $('s-treatment').innerHTML=intendedBlock()+'<h3>Treatment <span class="badge '+(recorded?'ok':(replaces?'dec':''))+'">'+badge+'</span>'+(recorded&&tr.quote?'<span class="ds">“'+esc(tr.quote)+'”</span>':'')+'</h3>'+
    '<table><thead><tr><th>Gap</th><th>The team\'s intended visuals</th><th>Picture</th><th>Route</th><th class="c">Length</th><th class="c">Images</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="ds" style="margin-top:8px">'+esc(tot.gaps||0)+' gaps · '+esc(tot.images||0)+' images · '+Object.entries(tot.routes||{}).map(([k,v])=>v+' '+(ROUTE[k]||k)).join(', ')+' · estimate '+inr(tr.estimate_inr)+' against the cap '+inr((d.budget||{}).cap_inr)+'</div>';
}
// ---------- plan ----------
function renderPlan(){
  const d=data;
  if(!d.plan_digest){$('s-plan').innerHTML='<div class="empty">'+(d.treatment?'The assistant writes the plan to the approved treatment.':'The treatment comes first.')+'</div>';return;}
  const byGap={};((d.treatment||d.treatment_draft||{}).gaps||[]).forEach(e=>byGap[e.gap_id]=e);
  const rows=d.gaps.map(g=>{const e=byGap[g.gap_id]||{};
    const state=g.recorded?'<span class="badge ok">recorded</span>':g.revise?'<span class="badge dec">under revision</span>':g.accepted?'<span class="badge ok">accepted</span>':'<span class="badge dec">to accept</span>';
    const words_=g.revise?'<div class="ds err">Sent back: “'+esc(g.revise.notes||g.revise.quote)+'”</div>':(g.accepted&&g.quote?'<div class="ds">“'+esc(g.quote)+'”</div>':'');   // design/75, 76
    const choice=g.choices?'<div class="btns"><span class="ds">Two choices:</span>'+g.choices.options.map(c=>'<button data-a="select" data-gap="'+esc(g.gap_id)+'" data-choice="'+esc(c.id)+'" class="'+(g.choices.selected===c.id?'go':'')+'" title="'+esc(c.why)+'">'+esc(c.title)+(g.choices.recommended===c.id?' (recommended)':'')+'</button>').join('')+'</div>':'';
    const shots=g.shots.length?'<details><summary class="ds" style="cursor:pointer">'+g.shots.length+' shot'+(g.shots.length>1?'s':'')+'</summary>'+g.shots.map(s=>'<div class="ds" style="margin:4px 0 0 12px"><b>'+esc(s.shot_id)+'</b> · '+esc(ROUTE[s.route]||s.route)+' · '+secs(s.end_frame-s.start_frame)+' — '+esc(s.purpose)+'</div>').join('')+'</details>':'<span class="ds">'+(g.choices&&!g.choices.selected?'choose one of the two':'no shots yet')+'</span>';
    const can=!g.recorded&&g.shots.length;
    return '<tr class="'+(selGaps[g.gap_id]?'sel':'')+'"><td class="c">'+(can?'<input type="checkbox" data-sel="'+esc(g.gap_id)+'" '+(selGaps[g.gap_id]?'checked':'')+' aria-label="select '+esc(g.gap_id)+'">':'')+'</td><td><span class="nm">'+esc(g.gap_id)+'</span><div class="ds">'+fmt(g.start_frame)+' – '+fmt(g.end_frame)+' · '+secs(g.end_frame-g.start_frame)+'</div><div class="ds">'+esc(g.requirement||'')+'</div></td><td>'+esc(e.picture||'')+'<div class="ds">'+esc((e.routes||[]).map(r=>ROUTE[r]||r).join(', '))+'</div>'+choice+'</td><td>'+shots+'</td><td>'+state+words_+'</td></tr>';}).join('');
  $('s-plan').innerHTML='<p class="ds" style="font-size:14px;margin:14px 0 4px">Tick the gaps, type your words at the foot, then Accept them, or Revise to send them back with what to change. A change request is never a yes.</p><table><thead><tr><th class="c"></th><th>Gap</th><th>Picture · route</th><th>Shots</th><th>State</th></tr></thead><tbody>'+rows+'</tbody></table>';
  $('s-plan').querySelectorAll('[data-sel]').forEach(c=>c.addEventListener('change',()=>{selGaps[c.dataset.sel]=c.checked;if(!c.checked)delete selGaps[c.dataset.sel];renderPlan();footer();}));
  $('s-plan').querySelectorAll('button[data-a]').forEach(b=>b.addEventListener('click',()=>click(b)));
}
// ---------- references (design/73 R4b) ----------
function latestSearch(eid){return (data.searches||[]).filter(s=>s.element_id===eid).sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0]||null;}
function pickOf(sid,n){return (picks[sid]||[]).find(p=>p.n===n);}
function toggleTick(sid,n){picks[sid]=picks[sid]||[];const i=picks[sid].findIndex(p=>p.n===n);if(i>=0)picks[sid].splice(i,1);else picks[sid].push({n:n,note:''});}
function checklist(lines){return lines&&lines.length?'<ul class="chk">'+lines.map(c=>'<li>'+esc(c.weight||'')+': '+esc(c.check||'')+' — '+esc(c.pass_when||'')+'</li>').join('')+'</ul>':'';}   // design/74 L6
function refCard(r,sel){
  const rejected=r.status==='rejected', can=stage()==='visuals';
  const reject=(r.status==='candidate'||r.status==='approved')&&can?'<div class="btns" style="margin:0 6px 6px"><button data-a="reject" data-ref="'+esc(r.id)+'">Reject</button></div>':'';   // design/74 L7
  const approve=(r.status==='candidate'&&can)?'<div class="btns" style="margin:0 6px 6px"><button data-a="approve" data-ref="'+esc(r.id)+'" data-sha="'+esc(r.sha256)+'">Approve</button></div>':'';

  }else if(step==='references'&&roundOpen()){   // design/79: one words box and Done for the whole pass
    const rd=roundOpen();
    if(rd.pass===1){const n=Object.keys(rd.elements).length;tray.innerHTML='<span>Your words for the whole pass (they approve the frames and say yes to the searches):</span>'+box;act_.innerHTML='<button class="go" data-a="round-done">Done ('+n+' element'+(n>1?'s':'')+')</button>';}
    else{const n=Object.values(rd.elements).filter(r=>r.search_id).reduce((k,r)=>k+((picks[r.search_id]||[]).length),0);tray.innerHTML='<span>'+(n?n+' picture'+(n>1?'s':'')+' ticked.':'Tick the pictures to use.')+' Your words for the whole pass:</span>'+box;act_.innerHTML='<button class="go" data-a="round-picks">Done</button>';}
  }else if(step==='references'){
    const s=selEl?latestSearch(selEl):null, n=s?(picks[s.search_id]||[]).length:0;
    tray.innerHTML='<span>'+esc(selEl||'')+(n?' · '+n+' picture'+(n>1?'s':'')+' ticked':'')+':</span>'+box;
    act_.innerHTML=(s?'<button class="go" data-a="pick" data-search="'+esc(s.search_id)+'" '+(n?'':'disabled')+'>Use the ticked pictures</button> <button data-a="nothing-fits" data-search="'+esc(s.search_id)+'">Nothing fits</button>':'<span class="why">type keywords above and press Search; your yes goes in this box</span>');
  }else if(step==='pictures'||step==='takes'){
    tray.innerHTML='<span>Your words for the next button (Approve, Reject, Use, Select):</span>'+box;act_.innerHTML='';
  }else{
    const ready=readyGaps();
    tray.innerHTML='<span>'+(ready.length?ready.length+' gap'+(ready.length>1?'s':'')+' ready:':'No gap is ready to record yet.')+'</span>'+box;
    act_.innerHTML='<button class="go" data-a="record" '+(ready.length?'':'disabled')+'>Record '+(ready.length||'')+' gap'+(ready.length===1?'':'s')+'</button>';
  }
  act_.querySelectorAll('button[data-a]').forEach(b=>b.addEventListener('click',()=>click(b)));
}
// ---------- the clicks: every button calls the server function the vw tool calls ----------
async function click(b){
  const a=b.dataset.a, q=words();
  const need=(text)=>{needWords('words',text);};
  if(a==='select'){await send({action:'select',gap_id:b.dataset.gap,choice_id:b.dataset.choice},'Choice recorded.');return;}
  if(a==='treatment'){if(!q){need();return;}await send({action:'treatment',quote:q},'Treatment recorded: the assistant writes the plan.');return;}
  if(a==='accept-selected'){if(!q){need('Your yes for these gaps is required.');return;}const ids=Object.keys(selGaps);if(!ids.length){msg('Tick a gap first.',true);return;}const j=await send({action:'accept',gap_ids:ids,quote:q},ids.length+' gap(s) accepted.');if(j)selGaps={};return;}
  if(a==='revise-selected'){if(!q){need('Say what to change in the box, then Revise.');return;}const ids=Object.keys(selGaps);if(!ids.length){msg('Tick a gap first.',true);return;}for(const gid of ids){const j=await send({action:'revise',gap_id:gid,notes:q,quote:q},gid+' sent back for revision.');if(!j)return;}selGaps={};return;}
  if(a==='approve'){if(!q){need('Your words for this picture are required.');return;}await send({action:'approve',reference_id:b.dataset.ref,sha256:b.dataset.sha,quote:q},'Picture approved.');return;}
  if(a==='reject'){if(!q){need('Say why in the box, then Reject.');return;}await send({action:'reject',reference_id:b.dataset.ref,notes:q,quote:q},'Picture rejected; the next one starts from the approved picture.');return;}
  if(a==='still'){if(!q){need('Your words for this picture are required.');return;}await send({action:'still',shot_id:b.dataset.shot,reference_id:b.dataset.ref,quote:q},'Picture held for the shot.');return;}
  if(a==='sequence'){const ids=seqTicks[b.dataset.shot]||[];if(!ids.length){msg('Tick the states first.',true);return;} if(!q){need();return;}const j=await send({action:'sequence',shot_id:b.dataset.shot,reference_ids:ids,quote:q},'Sequence approved and held.');if(j)delete seqTicks[b.dataset.shot];return;}
  if(a==='select-take'){if(!q){need('Your words after watching are required.');return;}await send({action:'select-take',job_id:b.dataset.job,quote:q},'Take selected.');return;}
  if(a==='reject-take'){if(!q){need('Say why in the box, then Reject.');return;}await send({action:'reject-take',job_id:b.dataset.job,notes:q,quote:q},'Take rejected.');return;}
  if(a==='search'){const kw=(($('kw-'+b.dataset.el)||{}).value||'').trim();if(!kw){needWords('kw-'+b.dataset.el,'Two to six words to search for.');return;} if(!q){need('Your yes to the web search goes in the box at the foot.');return;}await send({action:'search',element_id:b.dataset.el,keywords:kw,quote:q},'Search done: tick the pictures to use.');return;}
  if(a==='pick'){const sid=b.dataset.search, list=picks[sid]||[];if(!list.length){msg('Tick at least one picture first.',true);return;} if(!q){need();return;}const j=await send({action:'pick',search_id:sid,picks:list,quote:q},list.length+' picture(s) kept as references; the assistant generates the sheet from them.');if(j){delete picks[sid];if(j.failed&&j.failed.length)msg(j.failed.length+' picture(s) could not be downloaded: '+j.failed.map(f=>f.n+' ('+(f.site||'')+')').join(', ')+'; the rest are kept.',true);}return;}
  if(a==='nothing-fits'){if(!q){need('Say in one line why nothing fits; it becomes the next search.');return;}await send({action:'nothing-fits',search_id:b.dataset.search,reason:q},'Noted; the assistant searches again with your hint.');return;}
  if(a==='record'){if(!q){need();return;}await send({action:'record',gap_ids:readyGaps().map(g=>g.gap_id),quote:q},'Gaps recorded.');return;}
  if(a==='round-done'){const rd=roundOpen();if(!rd)return;if(!q){need('Your words for the whole pass are required: they approve the frames and say yes to the searches.');return;}
    const verdicts={};Object.keys(rd.elements).forEach(eid=>{const v=document.querySelector('input[name="v-'+eid+'"]:checked');const kw=document.querySelector('input.kw[data-el="'+eid+'"]');verdicts[eid]={verdict:v?v.value:'search',keywords:kw?kw.value.trim():''};});
    const j=await send({action:'round-done',verdicts:verdicts,quote:q},'Pass 1 done: the frames are approved and the searches ran.');
    if(j&&j.errors&&Object.keys(j.errors).length)msg('Some searches failed: '+Object.entries(j.errors).map(([e,w])=>e+' ('+w+')').join('; ')+'. The rest are on pass 2.',true);return;}
  if(a==='round-picks'){const rd=roundOpen();if(!rd)return;if(!q){need();return;}
    const pk={};Object.values(rd.elements).filter(r=>r.search_id).forEach(r=>{pk[r.search_id]=picks[r.search_id]||[];});
    const j=await send({action:'round-picks',picks:pk,quote:q},'Pass 2 done: the picked pictures are kept; the assistant generates the sheets.');
    if(j){Object.keys(pk).forEach(s=>delete picks[s]);if(j.failed&&Object.keys(j.failed).length)msg('Some pictures could not be downloaded: '+Object.keys(j.failed).join(', ')+'; the rest are kept.',true);}return;}
}
// ---------- render ----------
function render(){
  if(!step)step=recall('step')||autoStep();
  frame();
  STEPS.forEach(([k])=>$('s-'+k).hidden=(k!==step));
  if(!data||data.state!=='prepared'){STEPS.forEach(([k])=>$('s-'+k).innerHTML='<div class="empty">Nothing to show yet.</div>');footer();if(stage()==='visuals')schedule(60000);return;}
  if(step==='treatment')renderTreatment();if(step==='plan')renderPlan();if(step==='references')renderReferences();if(step==='pictures')renderPictures();if(step==='takes')renderTakes();if(step==='record')renderRecord();
  footer();
  const busy=data.references.some(r=>r.status==='generating')||data.gaps.some(g=>g.shots.some(s=>s.takes.some(k=>['queued','running','submitted'].includes(k.status))));
  if(stage()==='visuals')schedule(busy?15000:60000);   // design/74 L29
}
load();
})();
</script>
