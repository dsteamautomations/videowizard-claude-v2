{% extends "base.html" %}
{% block title %}Visuals · {{ run.code }} · VideoWizard{% endblock %}
{% block body %}
<style>
/* design/78: the visuals page on the voices page's frame (design/55): six steps on one line, one view at a time, the footer with the words and the step's action */
/* review 29 Oct (design/121 change 7): larger text for reading; the page is wider and scrolls more */
.v2{font-size:17px}
main:has(> .v2){max-width:1400px}
.v2 .top{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.v2 .steps{display:flex;gap:14px;font-size:19px;align-items:center;flex-wrap:wrap}
.v2 .steps a{color:var(--muted);text-decoration:none;cursor:pointer;padding:4px 2px}
.v2 .steps a.on{color:var(--fg);font-weight:700;border-bottom:2px solid var(--fg)}
.v2 .steps a.off{opacity:.45;cursor:default}
.v2 .dir{font-size:16px;color:var(--muted);margin-top:6px}
.v2 .dir strong{color:var(--fg)}
.v2 .meter{display:inline-flex;align-items:center;gap:8px;margin-left:12px;font-size:15px}
.v2 .meter .bar{display:inline-block;width:120px;height:8px;border-radius:999px;background:var(--z);overflow:hidden;vertical-align:middle;border:1px solid var(--line)}
.v2 .meter .bar i{display:block;height:100%;background:var(--accent)}
.v2 .meter .bar i.over{background:var(--err)}
.v2 .tabs{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
.v2 .tabs button{border:1px solid var(--line);background:var(--bg);padding:7px 16px;border-radius:999px;font-size:17px}
.v2 .tabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.v2 .search{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.v2 .search input{flex:1;min-width:200px;padding:11px 14px;font-size:18px;border-radius:12px}
.v2 .chip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--bg);font-size:15px;cursor:pointer}
.v2 table{width:100%;border-collapse:separate;border-spacing:0;font-size:17px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.v2 th{font-weight:500;color:var(--muted);font-size:15px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--card);white-space:nowrap}
.v2 td{padding:11px 12px;vertical-align:top;border-bottom:1px solid var(--line)}
.v2 tbody tr:last-child td{border-bottom:0}
.v2 tbody tr:nth-child(even) td{background:var(--z)}
.v2 tbody tr:hover td{background:var(--hover)}
.v2 tbody tr.sel td{background:var(--sel)}
.v2 td.c{text-align:center;white-space:nowrap;width:56px}
.v2 .nm{font-weight:600;font-size:18px}
.v2 .ds{color:var(--muted);font-size:15px;margin-top:2px}
.v2 .badge{display:inline-block;font-size:14px;letter-spacing:.03em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);margin-right:6px;vertical-align:1px;white-space:nowrap}
.v2 .badge.ok{border-color:var(--ok);color:var(--ok)}
.v2 .badge.dec{border-color:var(--accent);color:var(--fg)}
.v2 .badge.err{border-color:var(--err);color:var(--err)}
.v2 .ic{border:none;background:none;font-size:22px;cursor:pointer;padding:4px 8px;color:var(--fg);border-radius:8px}
.v2 .ic:hover{background:var(--hover)}
.v2 input[type=checkbox],.v2 input[type=radio]{min-width:0;width:20px;height:20px;margin:0;vertical-align:middle;accent-color:var(--accent)}
.v2 .empty{color:var(--muted);padding:40px 12px;font-size:18px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.v2 .msg{min-height:1.2em;font-size:16px;margin:8px 0}
.v2 .err{color:var(--err)}.v2 .ok{color:var(--ok)}
.v2 h3{font-size:16px;color:var(--muted);font-weight:500;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.v2 .intended{font-size:16px;margin:4px 0 8px;padding-left:18px}
.v2 .intended li{margin:0}
.v2 .two{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media (max-width:760px){.v2 .two{grid-template-columns:1fr}}
.v2 .list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.v2 .list a{display:block;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--fg);text-decoration:none}
.v2 .list a:last-child{border-bottom:0}
.v2 .list a.on{background:var(--sel)}
.v2 .list a .ds{margin-top:1px}
.v2 .card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px;background:var(--card)}
.v2 .strip{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.v2 .pic{width:200px;min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--z);font-size:15px;position:relative}
.v2 .pic img{display:block;width:100%;height:112px;object-fit:cover;background:#000;cursor:pointer}
.v2 .pic .cap{padding:4px 6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2 .pic.on{border-color:var(--ok)}
.v2 .pic.off{opacity:.55;border-style:dashed}
.v2 .pic button{margin:0 6px 6px;padding:3px 9px;font-size:15px;border-radius:999px}
.v2 .pic .tick{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.v2 .pic .tick.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.v2 .chips{display:flex;gap:4px;flex-wrap:wrap;margin:0 6px 6px}
.v2 .chips button{font-size:14px;padding:1px 7px;border-radius:999px;margin:0}
.v2 .chk{margin:2px 6px 6px;padding-left:14px;font-size:15px;color:var(--muted);white-space:normal}
.v2 .chk li{margin:0}
.v2 .btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.v2 .btns button{padding:4px 10px;font-size:15px;border-radius:999px}
.v2 .btns button.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.v2 .need-words{border-color:var(--err)!important;box-shadow:0 0 0 2px var(--err)}
/* design/80: the split view: the grid left, the chosen picture and its controls in a sticky panel on the right; under 900px the panel sits under the grid */
.v2 .split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.v2 .panel{position:sticky;top:96px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);font-size:16px;max-height:calc(100vh - 210px);overflow:auto}   /* design/100 S3 */
.v2 .panel img{display:block;width:100%;max-height:380px;object-fit:contain;background:#000;border-radius:8px}
.v2 .panel .pnote{width:100%;min-height:64px;margin:8px 0 4px;font-size:16px;border-radius:8px;padding:6px 8px;resize:vertical}
.v2 .panel .btns button.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.v2 .pic.sel{outline:2px solid var(--accent);outline-offset:1px}
.v2 .fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg);font-size:15px;cursor:pointer;color:var(--fg)}
.v2 .fchip b{color:var(--muted);cursor:pointer;font-weight:400}
.v2 .timed{margin-top:4px;line-height:1.5}.v2 .timed .tm{font-variant-numeric:tabular-nums;color:var(--fg)}
.v2 .turn{font-size:16px;margin:8px 0 4px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.v2 .turn.you{border-color:var(--accent);color:var(--fg);font-weight:600}
.v2 .turn.ok{border-color:var(--ok);color:var(--ok)}
.v2 .turn.head{margin:14px 0 6px;background:var(--card)}
.v2 .chk li.ok{color:var(--ok)}.v2 .chk li.err{color:var(--err)}
@media (max-width:900px){.v2 .split{grid-template-columns:1fr}.v2 .panel{position:static}}
.v2 .foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:6}
.v2 .foot .in{max-width:1400px;margin:0 auto;padding:8px 20px 10px}
.v2 .foot .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.v2 .foot .status{font-size:16px;min-height:1.3em;margin-bottom:6px;color:var(--muted)}
.v2 .foot .status.err{color:var(--err)}
.v2 .foot .status.ok{color:var(--ok)}
.v2 .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:v2spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes v2spin{to{transform:rotate(360deg)}}
.v2 .player{display:flex;gap:12px;align-items:center;margin:0 0 8px;font-size:16px}
.v2 .player[hidden]{display:none}
.v2 .player span{flex:0 0 220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--fg)}
.v2 .player video{flex:1;width:100%;max-height:220px;background:#000;border-radius:8px}
.v2 .tray{flex:1;font-size:16px;color:var(--muted);min-width:120px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.v2 .foot .go{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);padding:10px 18px;font-size:17px;border-radius:10px;white-space:nowrap}
.v2 .foot .go:disabled{opacity:.45}
.v2 .foot button{white-space:nowrap}
.v2 .why{font-size:15px;color:var(--muted);margin-left:8px;white-space:nowrap}
.v2 .words{flex:1;min-width:240px;padding:8px 10px;font-size:17px;border-radius:10px;min-height:38px;resize:vertical}
.v2 .spacer{height:210px}
/* design/97: the shared panel on every picture step, wider; the viewer; the check in one line; what waits */
.v2 .split{grid-template-columns:minmax(0,1fr) minmax(360px,45%)}
.v2 .panel img{max-height:50vh}
.v2 .panel .act{position:sticky;bottom:0;background:var(--card);padding-top:8px;z-index:2}   /* design/100 S3: Approve and Reject always in view */
.v2 details.pdet{margin-top:6px}.v2 details.pdet summary{cursor:pointer;color:var(--muted);font-size:15px}   /* design/100 S4 */
.v2 .panel .pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.v2 .panel .pair img{max-height:40vh}
.v2 .panel video{width:100%;max-height:50vh;background:#000;border-radius:8px}
.v2 .panel .srcs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.v2 .panel .srcs img{width:72px;height:44px;object-fit:cover}
.v2 details.chkd summary{cursor:pointer;font-size:15px;margin:2px 6px}
.v2 details.chkd summary.err{color:var(--err)}.v2 details.chkd summary.ok{color:var(--ok)}
.v2 .badge.waitb{border-color:var(--accent);color:var(--fg)}
.v2 .hl{outline:3px solid var(--accent);outline-offset:2px}
.v2 .wlist{margin:6px 0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
.v2 .wlist a{display:block;padding:2px 0}
#viewer{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:grid;grid-template-columns:minmax(0,1fr) 360px}
#viewer[hidden]{display:none}
#viewer .vw-stage{overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:pinch-zoom}
#viewer .vw-stage img{max-width:100%;max-height:100%;transform-origin:center;user-select:none}
#viewer .vw-side{background:var(--card);padding:12px;overflow:auto;color:var(--fg);font-size:16px}
@media (max-width:900px){ #viewer{grid-template-columns:1fr} #viewer .vw-side{max-height:45vh}}   /* a space after each brace: a brace then a hash opens a Jinja comment */
.v2 .pclose{display:flex;justify-content:flex-end;margin:-6px 0 2px;position:sticky;top:0;background:var(--card);z-index:3}   /* design/126 U2: the × stays in view while the panel scrolls; no negative side margin */
.v2 .panel{overflow-y:auto;overflow-x:hidden;overflow-wrap:anywhere}.v2 .panel .pnote,.v2 .panel input{box-sizing:border-box;max-width:100%}   /* design/126 U2: the panel never scrolls sideways */
.v2 .panel img{cursor:default}.v2 .panel img[data-view],.v2 .panel img[data-sview]{cursor:zoom-in}   /* design/126 U4: the zoom cursor only where a click opens the viewer */
.v2 .used{margin-top:4px}   /* design/126 U7 */
.v2 .pclose .ic{font-size:24px;line-height:1}
.v2 .rsn{margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:10px}
@media (max-width:600px){.v2 .panel .act{position:sticky;bottom:0;background:var(--card);padding:6px 0;z-index:2}}
img.sheet{display:block;max-width:100%;margin-top:6px;border-radius:4px;border:1px solid #333}
.passes li{margin:2px 0}
/* design/129 UX1 (SK, 1 Nov 2026): the page as slides; the rail of cards left, the chosen card on the stage, the message bar in colour at the top; desktop only, no whole-page scroll */
body:has(.v2.ux1){height:100vh;overflow:hidden;display:flex;flex-direction:column}
main:has(> .v2.ux1){flex:1;min-height:0;max-width:none;width:100%;box-sizing:border-box;padding:0 16px}
.v2.ux1{height:100%;display:flex;flex-direction:column;--rail:260px}
.v2.ux1 .top{position:static;padding:8px 0 6px}
.v2.ux1 .mbar{display:flex;gap:8px;align-items:stretch;margin-top:6px;position:relative}
.v2.ux1 .mbar .status{flex:1;margin:0;padding:8px 12px;border-radius:8px;font-size:16px;min-height:1.4em;border:1px solid var(--line);color:var(--muted)}
.v2 .status.info{background:color-mix(in srgb,#3b82f6 14%,var(--bg));color:#6ea8ff;border-color:color-mix(in srgb,#3b82f6 45%,var(--bg))}
.v2 .status.ok{background:color-mix(in srgb,var(--ok) 12%,var(--bg));color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--bg))}
.v2 .status.err{background:color-mix(in srgb,var(--err) 12%,var(--bg));color:var(--err);border-color:color-mix(in srgb,var(--err) 50%,var(--bg))}
.v2 .status.dec{background:color-mix(in srgb,#e0a326 14%,var(--bg));color:#e0a326;border-color:color-mix(in srgb,#e0a326 45%,var(--bg))}
.v2.ux1 #mhist{position:absolute;right:0;top:100%;z-index:9;width:min(620px,90vw);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 0;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.v2.ux1 #mhist div{padding:5px 12px;font-size:15px;border-left:3px solid transparent}
.v2.ux1 #mhist .err{border-left-color:var(--err)}.v2.ux1 #mhist .ok{border-left-color:var(--ok)}.v2.ux1 #mhist .info{border-left-color:#6ea8ff}.v2.ux1 #mhist .dec{border-left-color:#e0a326}
.v2.ux1 .body{flex:1;min-height:0;display:grid;grid-template-columns:var(--rail) 6px minmax(0,1fr)}
.v2.ux1 #rail{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.v2.ux1 .rfil{display:flex;gap:6px;flex-wrap:wrap;padding:8px 8px 8px 0;border-bottom:1px solid var(--line)}
.v2.ux1 .rfil button,.v2.ux1 .rfil select{font-size:13px;padding:2px 10px;border-radius:999px;min-width:0}
.v2.ux1 .rfil button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.v2.ux1 .rcards{flex:1;overflow-y:auto;padding:4px 8px 24px 0}
.v2.ux1 .rgrp{margin:10px 2px 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.v2.ux1 .rcard{display:block;width:100%;text-align:left;padding:6px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);position:relative;font-size:13px;color:var(--fg);cursor:pointer}
.v2.ux1 .rcard:hover{background:var(--hover)}
.v2.ux1 .rcard.on{border-color:var(--accent);background:var(--sel);box-shadow:0 0 0 1px var(--accent)}
.v2.ux1 .rcard .th{aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--z);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.v2.ux1 .rcard .th img{width:100%;height:100%;object-fit:cover;display:block}
.v2.ux1 .rcard .th.none{aspect-ratio:auto;height:30px}
.v2.ux1 .rcard .t1{margin-top:4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2.ux1 .rcard .t2{display:flex;justify-content:space-between;gap:6px;align-items:center;margin-top:3px;color:var(--muted);font-size:12px}
.v2.ux1 .rcard .badge{font-size:11px;margin:0}
.v2.ux1 .rcard .wdot{position:absolute;top:9px;right:9px;width:12px;height:12px;border-radius:50%;background:#e0a326;box-shadow:0 0 0 3px var(--card)}
.v2.ux1 #grip{cursor:col-resize}.v2.ux1 #grip:hover,.v2.ux1 #grip.drag{background:var(--accent)}
.v2.ux1 #stage{min-height:0;overflow:auto;padding:0 2px 0 14px}
.v2.ux1 #stage>section:has(>.split){height:100%}
.v2.ux1 .split{grid-template-columns:minmax(0,1fr) minmax(420px,52%);height:100%;align-items:stretch}
.v2.ux1 .split>div:first-child{overflow:auto;min-height:0;padding-right:4px}
.v2.ux1 .panel{position:static;max-height:none;min-height:0;overflow-y:auto}
.v2.ux1 .panel img{max-height:58vh}
.v2.ux1 .spacer{display:none}
.v2.ux1 .msg{min-height:0;margin:0}   /* the old message line takes no room */
.v2.ux1 .foot{position:static}.v2.ux1 .foot .in{max-width:none;padding:6px 0 8px}
.v2.ux1 #s-pictures .tabs{display:none}   /* the rail chooses the gap */
.v2.ux1 #s-references .two{grid-template-columns:1fr}.v2.ux1 #s-references .two>.list{display:none}   /* the rail is the list of things */
.v2 .vtabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px}
.v2 .vtabs button{font-size:14px;padding:4px 10px;border-radius:8px 8px 0 0;border:1px solid var(--line);border-bottom-width:2px;background:var(--bg);color:var(--muted)}
.v2 .vtabs button.on{color:var(--fg);font-weight:600;border-bottom-color:var(--accent);background:var(--hover)}
.v2 .vtabs button.new{color:var(--ok)}
.v2 .vold{margin:6px 0;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--err) 12%,var(--bg));color:var(--err);font-size:15px}
@media (max-width:1280px){.v2.ux1 .split{grid-template-columns:1fr;height:auto}.v2.ux1 #stage>section:has(>.split){height:auto}.v2.ux1 .split>div:first-child{overflow:visible}}
/* UI change, 11 Nov 2026 (videobuilder-v4/phase2/ui/requirements-and-test-plan.md): a thumbnail's state (R20), the labelled starting-picture control (R2), the placeholder of a missing picture (E16), Done's confirmation (R15), a failed connection (R24) */
.v2 .pst{padding:0 6px 4px;font-size:14px;color:var(--muted)}.v2 .pst.ok{color:var(--ok)}.v2 .pst.err{color:var(--err)}
.v2 .pic button.gold{display:block;width:calc(100% - 12px);white-space:normal;font-size:14px;border-radius:8px;line-height:1.2}
.v2 .pic button.gold.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.v2 .ph{display:flex;align-items:center;justify-content:center;min-height:90px;padding:6px;background:var(--z);color:var(--muted);font-size:14px;text-align:center}
.v2 .status.net{background:color-mix(in srgb,#e0a326 14%,var(--bg));color:var(--err);border-color:var(--err);border-style:dashed}
.v2 #done-confirm{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:8;width:min(560px,90vw);background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:17px}
.v2 #done-confirm[hidden]{display:none}
.v2.ux1 .rcard .badge{white-space:normal}
/* Round 3, 11 Nov 2026 (reference-page-ui-issues.md U17 to U19): the pressed button shows it is working and a refusal is said beside it (U18); the line where a verdict can no longer be changed (U17); the operator's own picture on a card (U19) */
.v2 button.busy::after{content:' …'}
.v2 .near{font-size:15px;margin:4px 0;color:var(--err);flex-basis:100%}
.v2 #action .near{display:inline-block;margin:0 0 0 10px;max-width:520px;vertical-align:middle;white-space:normal}
.v2 .lockd{font-size:15px;color:var(--muted);margin:4px 6px}
.v2 .own{margin-top:8px}
</style>
<div class="v2 ux1" id="app" data-code="{{ run.code }}">
<div class="top">
  <div class="steps" id="steps"></div>
  <div class="dir" id="line">Loading…</div>
  <div class="wlist" id="wlist" hidden></div>
  <div class="mbar"><div class="status" id="fmsg"></div><button id="mhist-b" title="the last five messages">History</button><div id="mhist" hidden></div></div>
  <div class="msg" id="msg"></div>
</div>
<div class="body">
<aside id="rail"><div class="rfil" id="rfil"></div><div class="rcards" id="rcards"></div></aside>
<div id="grip" title="drag to widen or narrow the list (200 to 360 px)"></div>
<div id="stage">
<section id="s-treatment"></section>
<section id="s-plan" hidden></section>
<section id="s-references" hidden></section>
<section id="s-pictures" hidden></section>
<section id="s-takes" hidden></section>
<section id="s-record" hidden></section>
<div class="spacer"></div>
</div>
</div>
<div id="viewer" hidden></div>
<div class="foot"><div class="in">
<div class="player" id="player" hidden><span id="pl-name" class="ds">nothing playing</span><video id="pl" controls preload="metadata"></video></div>
<div class="row"><div class="tray" id="tray"></div><span id="action"></span></div>
<div id="done-confirm" hidden></div>
</div></div>
</div>
<script>
(function(){
const code=document.getElementById('app').dataset.code, base='/runs/'+code+'/visuals';
const STEPS=[['treatment','Treatment'],['plan','Plan'],['references','References'],['pictures','Pictures'],['takes','Takes'],['record','Record']];
const ROUTE={video:'AI video',still:'still',graphic_sequence:'graphic sequence',footage:'footage'};
const CHIPS=['avoid brand text','posture only, not the person','colour only'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
let confirmPicks=false;   // design/106 N3: Done asked once, then Finish
let data=null, timer=null, inflight=false, step=null, selEl=null, selPic=null, gapFilter='', selGaps={}, view=null, wi=-1, hashDone=false, rejOpen=null, closed={};   // design/99: the reject reason open after a reject; panels the operator closed   // selPic: {sid,n} a search result, {ref} a reference (design/80)
const picks={};   // search id -> [{n, note}] in the order ticked (design/73)
const searching={}, ignoredEls={};   // design/121: the things whose search is running; the things answered Ignore this on pass 2
// UI change, 11 Nov 2026 (R13, R14): the answers of step 2, held here and stored on the server at every change; set: the set the answer was made on; state: typing, saving, saved or failed
const ans={}, stale={}, notRec={}, v1={};   // stale: a stored answer discarded because its set was made again; notRec: the card a refused Done names; v1: step 1's Ignore this, kept across a redraw (E13)
let saveChain=Promise.resolve(), confirmSets=false, doneBusy=false, sending='', clearWords=false, lastErr='';
let pressed=null;   // U18: the button whose action is running or was last refused: {el, sel: the same button after a redraw, err: [text, kind], live: its click is still being handled}
const OWN_FOR_PEOPLE=false, OWN_MAX=15*1024*1024;   // U19: an uploaded photo of a real person is not used until SK rules on it: true switches it on (the server's line: OWN_PICTURE_FOR_PEOPLE in visuals_stage.py)
const VW={yes:'Yes',no:'No',correct:'Correct it'}, SHORT={'material spec to approve':'spec to approve','drawing spec to approve':'spec to approve'};
const FAILED='That could not be done; nothing was changed. The builder has been told what failed.';   // follow-up fix 9: never a bare key name or an exception's text
const rx=s=>s.replace(/[^\w-]/g,'\\$&');
function nameOf(eid){const e=((data&&data.elements)||[]).find(x=>x.id===eid);return (e&&e.name)||eid;}   // follow-up fix 5
function named(t){   // follow-up fix 5: an element's name, never its id, in every message, count line and label. ponytail: an id that is a whole word of its own name is left as written
  if(named.d!==data){named.d=data;named.m={};((data&&data.elements)||[]).forEach(e=>{if(e.name&&e.name!==e.id&&!new RegExp('(^|[^\\w-])'+rx(e.id)+'(?![\\w-])').test(e.name))named.m[e.id]=e.name;});
    const ids=Object.keys(named.m).sort((a,b)=>b.length-a.length);named.re=ids.length?new RegExp('(^|[^\\w-])('+ids.map(rx).join('|')+')(?![\\w-])','g'):null;}
  const s=String(t==null?'':t);return named.re?s.replace(named.re,(x,p,id)=>p+named.m[id]):s;}
function plain(t){   // R19: no tool command and no internal picture id reaches the operator
  const s=String(t==null?'':t).replace(/\s*\((?:or\s+)?`[^`]*`\)/g,'').replace(/,?\s*(?:\b(?:or|with)\s+)?`[^`]*`/g,'');
  if(/^\s*['"][^'"]*['"]\s*$/.test(s))return FAILED;   // a bare key name: an unexpected failure
  return named(s.replace(/\b[0-9a-f]{10,}(?:-\d+)?\b/g,id=>{const r=((data&&data.references)||[]).find(x=>x.id===id);return r&&r.set_n?'picture '+r.set_n+' of '+(r.element_id||'its set'):r&&r.name?r.name:'that picture';}));}
function remember(k,v){try{localStorage.setItem('vz:'+code+':'+k,v);}catch(e){}}
function recall(k){try{return localStorage.getItem('vz:'+code+':'+k);}catch(e){return null;}}
const said=[];   // design/129 UX1: the last five messages, from the bar's History
function msg(t,err,busy,kind){const f=$('fmsg');t=plain(t);if(kind!=='dec')msgAt=Date.now();f.innerHTML=(busy?'<span class="spin"></span>':'')+esc(t||'');const k=kind==='warn'?'dec':(kind||(err?'err':(busy?'info':'ok')));f.className='status '+k;   // UX1: blue working, green done, red refused, amber waiting; R24: net, a failed connection; warn: amber, kept in History
  if(t&&kind!=='dec'){said.unshift([k,new Date().toTimeString().slice(0,5)+'  '+t]);said.length=Math.min(said.length,5);}}
function needWords(id,text){const e=$(id);if(e){e.classList.add('need-words');e.focus();e.addEventListener('input',()=>e.classList.remove('need-words'),{once:true});}msg(text||'Your words are required: type them in the box at the foot first.',true);}   // design/74 L31
async function act(body){
  if(inflight){throw new Error('Still recording the last action; try again in a moment.');}
  inflight=true;const pb=pressed&&pressed.live&&pressed.el.isConnected?pressed.el:null;if(pb){pb.disabled=true;pb.classList.add('busy');}   // U18: the button pressed shows it is working
  try{let r;try{r=await fetch(base+'/act',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}
    catch(e){const x=new Error('The server could not be reached: nothing was recorded. Check the connection and try again.');x.net=true;throw x;}   // R24: not a refusal
    let j=null;try{j=await r.json();}catch(e){j=null;}
    if(!r.ok){throw new Error((j&&j.message)||('The server answered '+r.status+'.'));}return j;}
  finally{inflight=false;if(pb){pb.disabled=false;pb.classList.remove('busy');}}
}
function unpress(){pressed=null;document.querySelectorAll('#app .near').forEach(e=>e.remove());}
function showNear(){   // U18: a refusal or a failure is said beside the button that was pressed (the same button after a redraw), until the next action or a redraw of its card
  document.querySelectorAll('#app .near,#app .saving').forEach(e=>e.remove());if(!pressed||!pressed.err)return;
  const b=pressed.el.isConnected?pressed.el:document.querySelector('#app '+pressed.sel);if(!b)return;
  (b.closest('.btns,.search')||b).insertAdjacentHTML('afterend','<div class="near '+pressed.err[1]+'" role="alert">'+esc(plain(pressed.err[0]))+'</div>');}
function nearErr(t,kind){if(pressed&&pressed.live)pressed.err=[t,kind||'err'];showNear();}
function refuse(t){msg(t,true);nearErr(t);}   // a refusal the page itself can tell, before anything is sent
async function send(body,okText,onOk){if(pressed&&!pressed.live)unpress();msg('Recording…',false,true);lastErr='';try{const j=await act(body);if(view){view=null;$('viewer').hidden=true;}if(onOk)onOk(j);if(body.quote||body.reason)clearWords=true;msg((j&&j.next)||(typeof okText==='function'?okText(j):okText)||'Recorded.');if(j&&j.view){data=j.view;render();}else{await load();}return j;}
  catch(err){if(err instanceof TypeError||err instanceof ReferenceError||err instanceof RangeError){pageError();return null;}   // a script error, never its text
    lastErr=err.net?'':err.message;msg(err.message,true,false,err.net?'net':undefined);highlightNamed(err.message,document);nearErr(err.message,err.net?'net':'err');return null;}}
// ---------- R13: one answer of step 2, stored as it is made ----------
function setKey(r){return String(r.round||0)+':'+(((r.set||[])[0])||'');}
function setPics(r){const by=refsById();return ((r&&r.set)||[]).map(i=>by[i]).filter(x=>x&&x.status!=='rejected');}
function settled(r){const p=setPics(r).filter(x=>x.status!=='failed');return r.verdict==='yes'&&p.length>0&&p.every(x=>x.status==='approved');}   // R16: approved in an earlier pass; it asks nothing
function judged(rd){return Object.keys(rd.elements).filter(eid=>{const r=rd.elements[eid];return !r.ignored&&!r.from_footage&&!settled(r)&&setPics(r).some(x=>x.status==='candidate');});}   // the sets that ask for an answer now
function missing(eid,a){   // E6: what an answer still lacks; '' when it is whole
  if(!a||!a.verdict)return 'no answer yet';
  if(a.state==='failed')return 'not saved';
  if(a.verdict==='yes'&&(((data.elements||[]).find(e=>e.id===eid)||{}).kind!=='person')&&!a.golden)return 'choose the starting picture';
  if(a.verdict==='correct'&&!String(a.words||'').trim())return 'say what to correct';
  return '';}
function answerOf(eid){const rd=roundOpen(), r=rd&&rd.elements[eid];if(!ans[eid])ans[eid]={verdict:'',golden:'',words:'',set:r?setKey(r):'',state:'typing'};return ans[eid];}
function syncAnswers(){   // the server's stored answer wins, except over one being typed or not saved; an answer made on a set made again since is dropped
  const rd=roundOpen();
  if(!rd||!rd.kept||(rd.pass!==2&&rd.pass!=='making')){[ans,stale,notRec].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));confirmSets=false;return;}
  Object.keys(rd.elements).forEach(eid=>{const r=rd.elements[eid], key=setKey(r), sv=r.answer, a=ans[eid];
    if(r.answer_discarded&&!a)stale[eid]=true;
    if(a&&a.set!==key){delete ans[eid];delete notRec[eid];stale[eid]=true;return;}
    if(sv&&!(a&&a.state!=='saved'))ans[eid]={verdict:sv.verdict||'',golden:sv.golden||'',words:sv.words||'',set:key,state:'saved'};});}
function storeAnswer(eid){   // sent whole at every change, one after the other, so the later answer is the stored one
  const a=ans[eid];if(!a)return;a.state='saving';delete stale[eid];delete notRec[eid];confirmSets=false;
  const person=((data.elements||[]).find(e=>e.id===eid)||{}).kind==='person'&&!ownPics(eid).some(x=>x.id===a.golden);   // U19: a person's set takes its first picture; an own picture, where allowed, is sent
  const body={action:'set_answer',element_id:eid,verdict:a.verdict||null,golden:(a.verdict==='no'||person)?null:(a.golden||null),words:String(a.words||'').trim()};
  saveChain=saveChain.then(async()=>{let ok=false,j=null,why='';
    try{const r=await fetch(base+'/act',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});try{j=await r.json();}catch(e){j=null;}
      ok=r.ok;if(!ok)why=(j&&j.message)||('The server answered '+r.status+'.');}catch(e){ok=false;}
    if(ans[eid]!==a)return;   // the round moved on meanwhile
    if(ok&&j&&j.discarded){delete ans[eid];stale[eid]=true;}
    else if(a.state==='saving'){a.state=ok?'saved':'failed';a.why=why;}
    if(!ok)msg(eid+': not saved, try again'+(why?': '+why:' (the server could not be reached).'),true,false,why?undefined:'net');   // E9
    paintAnswers();});}
function answerLine(eid){   // under a card's answer: what it lacks, that it is stored and not recorded yet, or that it was not saved
  const a=ans[eid];let h='';
  if(stale[eid])h+='<div class="ds err">made again since; judge the new set</div>';
  if(notRec[eid])h+='<div class="ds err">not recorded: '+esc(plain(notRec[eid]))+'</div>';   // R24, E8
  if(a&&a.state==='failed')h+='<div class="ds err">not saved, try again'+(a.why?': '+esc(plain(a.why)):'')+' <button data-a="set-answer-retry" data-el="'+esc(eid)+'">Try again</button></div>';
  else if(a&&a.verdict){const m=missing(eid,a);h+=m?'<div class="ds err">'+esc(m)+'</div>':'<div class="ds ok">'+VW[a.verdict]+' · not recorded yet: Done records it</div>';}
  return h;}
function paintAnswers(){   // after an answer changed or was stored: the card's line, the left list, the foot; never a redraw of the card (a words box being typed in keeps its place)
  document.querySelectorAll('#s-references [data-astate]').forEach(d=>{const h=answerLine(d.dataset.astate);if(d._html===undefined)d._html=d.innerHTML;if(d._html===h)return;d.innerHTML=h;d._html=h;d.querySelectorAll('button[data-a]').forEach(b=>b.addEventListener('click',()=>click(b)));});
  renderRail();trayNote();lockAll();}
function trayNote(){const t=$('twait'), rd=roundOpen();if(!t||!rd)return;const wait=keptWaiting(rd);
  t.className=wait.length?'err':'';
  t.innerHTML=wait.length?'<b>'+wait.length+'</b> still need'+(wait.length>1?'':'s')+' an answer (or a starting picture, or the words for Correct it): '+esc(wait.map(nameOf).join(', ')):judged(rd).length?(capHit()?'Every set has its answer. Done records the Yes answers; nothing is made again while the spend cap is reached.':'Every set has its answer. Done records them; the No and Correct it ones are made again.'):closable(rd)?'Nothing is left to judge: Done closes the round.':'No set asks for an answer now.';}
function closable(rd){return !judged(rd).length&&!Object.keys(rd.elements).some(eid=>{const r=rd.elements[eid];return !r.ignored&&!r.from_footage&&!settled(r);});}   // follow-up fix 3: every other set approved, the rest set aside or ignored
function capHit(){const b=(data&&data.budget)||{};return (b.cap_inr>0&&b.spent_inr>=b.cap_inr)||Object.values((data&&data.round&&data.round.elements)||{}).some(r=>r.cause&&r.cause.kind==='cap');}   // E15
function readOnly(){return !!(data&&data.run&&data.run.open_defects&&data.run.open_defects.length);}   // E20. Follow-up fix 1: `busy` only says the run's lock was held at that read (the chat tool was making a call); it never locks the page
function lockAll(){if(!readOnly())return;document.querySelectorAll('#app button[data-a],#app input[type=radio],#app [data-golden]').forEach(e=>{e.disabled=true;});}   // no button pretends to work
const KW_TEXT='Two to twelve words to search for: the thing and its place or trade.';   // design/126 U5 (SK, 31 Oct: 2 to 12 words; the stock site's name is outside the count)
function kwOk(kw){const n=String(kw||'').split(/\s+/).filter(Boolean).length;return n>=2&&n<=12;}
async function roundSearch(eid){   // design/121 change 6: a thing's own search; not through act(), so the operator goes on to the next thing while it runs
  const kw=(($('kw-'+eid)||{}).value||'').trim(), src=(($('src-'+eid)||{}).value||'').trim();
  if(!kwOk(kw)){needWords('kw-'+eid,KW_TEXT);return;}
  searching[eid]=true;renderStep();footer();msg('Searching for '+eid+'… you can go on to the next thing.',false,true);
  try{const r=await fetch(base+'/act',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'search',element_id:eid,keywords:kw,source:src})});let j=null;try{j=await r.json();}catch(e){j=null;}
    if(!r.ok)throw new Error((j&&j.message)||('The server answered '+r.status+'.'));
    if(j&&j.view)data=j.view;if(!((j.results||[]).length+(j.stock_results||[]).length)&&!selPic)selPic={supply:eid};   // design/126 U6: nothing found: the own-picture box opens in the panel
    msg(eid+': '+((j.results||[]).length+(j.stock_results||[]).length)+' pictures found'+(j.errors?' (one search failed: '+Object.values(j.errors).join('; ')+')':'')+'.',!!j.errors);}
  catch(err){msg(eid+': '+err.message,true);await load();}
  finally{delete searching[eid];render();}
}
async function load(){
  let r;
  try{r=await fetch(base+'/data',{cache:'no-store'});}catch(e){msg('The server is not reachable; trying again in 15 s.',true);schedule(15000);return;}
  if(r.status===401){location.href='/login?next='+encodeURIComponent(base+location.hash);return;}   // E10: back to the same card
  if(!r.ok){msg('The page could not load ('+r.status+').',true);schedule(15000);return;}
  data=await r.json();render();
  if(!hashDone){hashDone=true;applyHash();}   // design/97 W1: a link opens its item
}
function schedule(ms){clearTimeout(timer);timer=setTimeout(load,ms||15000);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&data){load();}});   // design/74 L29
function stage(){return data&&data.run?data.run.stage:null;}
function fmt(frames){const fps=Number(data&&data.fps)||25;const s=Math.max(0,Math.round(frames/fps));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function secs(frames){const fps=Number(data&&data.fps)||25;return (frames/fps).toFixed(1)+' s';}
function words(){return ((($('pwords')||{}).value)||(($('words')||{}).value)||'').trim();}   // design/97 P1: the panel's words first
function autoStep(){const d=data;if(!d||d.state!=='prepared')return 'treatment';
  if(!d.treatment||d.treatment_draft)return 'treatment';
  if(!d.plan_digest||d.gaps.some(g=>!g.accepted&&!g.recorded&&g.shots.length))return 'plan';
  const els=(d.elements||[]).filter(e=>e.kind!=='graphic');
  if(roundOpen()||(!(d.round&&d.round.kept&&d.round.pass==='complete')&&els.some(e=>!(d.references||[]).some(r=>r.element_id===e.id&&r.kind==='sheet'&&r.status==='approved'))))return 'references';   // follow-up fix 10: a kept round that is complete is finished (a thing from the footage, ignored or set aside has no sheet)
  if(d.gaps.some(g=>g.accepted&&!g.recorded&&g.shots.some(s=>!['video','drawn'].includes(s.route)&&!s.asset)))return 'pictures';
  if(d.gaps.some(g=>g.accepted&&!g.recorded&&g.shots.some(s=>['video','drawn'].includes(s.route)&&!s.asset&&!s.takes.some(k=>k.selected))))return 'takes';   // R21: a shot filled with a supplied file is done
  return 'record';}
function unsavedTicks(){return Object.values(picks).reduce((k,l)=>k+((l||[]).length),0);}   // design/99 C5
window.addEventListener('beforeunload',ev=>{if(unsavedTicks()){ev.preventDefault();ev.returnValue='';}});
document.addEventListener('click',ev=>{const c=ev.target.closest('[data-rchip]');if(!c)return;const w=$('rwhy');if(w)w.value=(w.value?w.value+'; ':'')+c.dataset.rchip;});   // design/99 C3: a chip adds to the reason
function go(s){if(step==='references'&&s!=='references'&&unsavedTicks()&&!confirm(unsavedTicks()+' ticked pictures are not saved. Leave anyway?'))return;confirmSets=false;clearWords=true;if(s!==step){step=s;rejOpen=null;selPic=selUnit[s]?defaultPic(selUnit[s]):null;}step=s;confirmPicks=false;remember('step',s);render();setHash(chosenUnit());window.scrollTo(0,0);}   // U14: the panel never shows another tab's picture; the address names the tab shown
function setHash(u,item){try{history.replaceState(null,'',location.pathname+location.search+'#'+step+(u?'/'+encodeURIComponent(u)+(item?'/'+encodeURIComponent(item):''):''));}catch(e){}}   // review 27 Oct: Done is asked again after a step change
// ---------- frame ----------
function frame(){
  const d=data;
  const wc=waitCards(), per={};wc.forEach(w=>{per[w.step]=(per[w.step]||0)+1;});   // design/97 W3; R6: the header, the tabs and the left list count the same cards
  $('steps').innerHTML=STEPS.map(([k,l])=>'<a data-s="'+k+'" class="'+(k===step?'on':'')+'">'+l+(per[k]?' · '+per[k]+' waiting':'')+'</a>').join('<span class="ds">›</span>');
  $('steps').querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>go(a.dataset.s)));
  if(!d||d.state!=='prepared'){$('line').textContent='The visuals stage has not started: the assistant prepares it.';return;}
  const b=d.budget||{}, over=b.spent_inr>b.cap_inr, pct=b.cap_inr?Math.min(100,Math.round(100*b.spent_inr/b.cap_inr)):0;
  const meter='<span class="meter">spend '+inr(b.spent_inr)+' of '+inr(b.cap_inr)+' <span class="bar"><i class="'+(over?'over':'')+'" style="width:'+pct+'%"></i></span>'+(b.images?' images: '+(b.images-(b.fixes||0))+' requested + '+(b.fixes||0)+' fixes':'')+(capHit()?' <span class="err">spend cap reached: no picture is made until the cap is raised</span>':'')+'</span>';   // design/96 X3; E15
  const t=d.treatment, dr=d.treatment_draft, at0=autoStep(), at=wc.length&&!wc.some(w=>w.step===at0)?wc[0].step:at0;   // follow-up fix 10: the step where the next waiting thing is, never a finished one
  let line=stage()!=='visuals'?'The run is at <strong>'+esc(d.run.stage)+'</strong>.':(dr?(t?'<strong>New treatment draft</strong>: it replaces the approved one; read it and approve it at the foot':'<strong>Treatment drafted</strong>: read it and approve it at the foot'):(!t?'The assistant is preparing the treatment':'<strong>'+esc(STEPS.find(x=>x[0]===at)[1])+'</strong> is the step the run is at'));
  if(d.run&&d.run.open_defects&&d.run.open_defects.length){line+=' · <span class="err">a defect is open; nothing can be recorded until it is fixed</span>';}
  if(d.busy){line+=' · <span class="ds">the server is busy; the page reads again shortly</span>';}   // follow-up fix 1: a quiet line, every control stays usable
  const wn=wc.length;
  $('line').innerHTML=line+meter+(d.illustrative&&d.illustrative.warning?' · <span class="err">'+esc(d.illustrative.warning)+'</span>':'')+(wn?' · <a id="wcount" style="cursor:pointer"><b>'+wn+'</b> waiting for your verdict</a> <button id="wnext">Next waiting</button>':'');   // design/97 W3
  const list=()=>{$('wlist').innerHTML=wc.map(w=>'<a href="'+esc(base+'#'+w.hash)+'">'+esc(w.label)+'</a>').join('');};if(!$('wlist').hidden)list();
  if($('wcount'))$('wcount').addEventListener('click',()=>{const l=$('wlist');l.hidden=!l.hidden;list();});
  if($('wnext'))$('wnext').addEventListener('click',()=>{if(!wc.length)return;wi=(wi+1)%wc.length;const h=wc[wi].hash;if(decodeURIComponent(location.hash)==='#'+decodeURIComponent(h))applyHash();else location.hash=h;});
}
function waitCards(){   // R6, R9: every card that waits for the operator, on every step, in the server's order where it gives one; the one list behind every count and Next waiting
  const out=[];if(!data||data.state!=='prepared')return out;
  STEPS.forEach(([k])=>{const cs=railCards(k).filter(c=>c.wait&&c.unit), at=c=>{const i=(data.waiting||[]).findIndex(w=>w.step===k&&w.group===c.unit);return i<0?1e6:i;};
    cs.map((c,i)=>[at(c),i,c]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).forEach(x=>{const w0=(data.waiting||[]).find(w=>w.step===k&&w.group===x[2].unit);out.push({step:k,unit:x[2].unit,hash:w0?w0.link.split('#')[1]:k+'/'+encodeURIComponent(x[2].unit),label:named(x[2].wlabel||x[2].title)});});});   // the server's own link where it gives one

function play(url,name){const pl=$('pl');$('player').hidden=false;pl.src=url;$('pl-name').textContent=name;pl.play().catch(()=>{});}
function supplied(s){return !!(s.asset&&(s.asset.kind==='movie'||s.asset.kind==='still'));}   // a file of the operator's own (`asset`), not a take
function takeRejected(k){return !!(k.reviews&&k.reviews.length&&k.reviews[k.reviews.length-1].decision==='rejected');}   // defect 30: the job stays 'ready'; its latest review says rejected
function shotState(s){   // design/86 K3: whose turn it is on this shot, and how long to wait
  const d=data, kf=(d.references||[]).filter(r=>ownPic(r,s)&&r.kind==='keyframe'&&r.status!=='rejected'&&r.status!=='failed');
  const ids=new Set(kf.map(r=>r.id)), isStart=r=>{if(r.role)return r.role==='start';return !(r.parents||[]).some(p=>ids.has(p));};   // design/106 T1
  const open=s.takes.find(k=>['queued','running','submitted','storage_pending'].includes(k.status)), ready=s.takes.find(k=>k.status==='ready'&&!k.selected&&!takeRejected(k));
  if(supplied(s)){const a=s.asset, slot=(s.end_frame-s.start_frame)/(Number(d.fps)||25), short=a.kind==='still'||(a.duration_s!=null&&Number(a.duration_s)<slot-0.04);   // R21: who supplied it, with which words; E17: what assembly does with a still or a short file
    return ['ok',(a.by?'Supplied by '+a.by:'Filled with a supplied file')+(a.quote?': “'+a.quote+'”':'')+(a.kind==='still'?' · a still picture':a.duration_s!=null?' · '+a.duration_s+' s':'')+(short?' · assembly holds the last frame':'')+' · made outside; checks skipped'+(a.made?' (“'+a.made+'”)':'')+'.'];}
  if(s.route==='drawn'){   // design/113 E3: a drawing has no start or end image; it is rendered, free, and judged here
    if(s.takes.some(k=>k.selected))return ['ok','Drawing approved.'];
    if(ready&&s.takes.some(k=>k.status==='ready'&&!takeRejected(k)&&k.check&&(k.check.must_failed||[]).length))return ['you','Held: a line still failed after the server\'s passes. Look at the sheet; select the drawing with your reason, or reject it.'];   // design/117 answer 1
    if(ready)return ['you','Your turn: look at the sheet and the drawing; select it, or reject it with what to change.'];
    if(open)return ['wait','Rendering the drawing, a few seconds. The page refreshes itself.'];
    if(s.takes.some(takeRejected))return ['assistant','Rejected: the assistant revises the scene and renders again, free. Nothing to do here.'];
    return ['assistant','Waiting for the assistant to render the drawing. Nothing to do here.'];   // R19: no tool command on the page
  }
  if(s.takes.some(k=>k.selected))return ['ok','Take selected.'];
  if(s.asset&&s.asset.kind==='clip')return ['ok','Filled with a stretch of '+(s.asset.name||'a clip')+'.'];   // design/89 B3
  if(ready)return ['you','Your turn: watch the take and select it, or reject it with what is wrong.'];
  if(open)return ['wait','The take is being made, about 3 minutes. You may leave the page; it refreshes itself.'];
  if(s.takes.some(takeRejected))return ['assistant','The take is rejected: the assistant prepares a new take from your reason. Nothing to do here.'];   // defect 30
  const gen=kf.filter(r=>r.status==='generating');
  if(gen.length)return ['wait','Making the '+(gen.some(isStart)?'start':'end')+' image, about 1 minute. Nothing for you to do; the page refreshes itself.'];
  const cand=kf.filter(r=>r.status==='candidate'), appr=kf.filter(r=>r.status==='approved');
  if(cand.some(r=>!r.check&&r.checklist&&r.checklist.length))return ['wait','Checking the picture against its list, under 30 seconds.'];
  const sApp=appr.find(isStart);
  if(cand.some(isStart)&&!sApp)return ['you','Your turn: approve the start image, or reject it with what is wrong.'];
  if(sApp&&cand.some(r=>!isStart(r)))return ['you','Your turn: approve the pair, or reject the end image with what is wrong.'];
  if(sApp&&appr.some(r=>!isStart(r)))return ['assistant',s.prepared?'The pair is approved; the assistant submits the take.':'The pair is approved; the assistant prepares the take. Nothing to do here.'];
  if(sApp)return ['assistant',sApp.end_queued?'The end image is on its way.':'Waiting for the assistant: the end image\'s prompt is not written yet. Nothing to do here.'];
  return ['assistant','Waiting for the assistant to generate the start image. Nothing to do here.'];
}

      sh+=guideBox(s);
      if(s.takes.length){sh+='<table><thead><tr><th>Take</th><th>State</th><th class="c">Play</th><th>Checklist</th><th>Review</th></tr></thead><tbody>'+s.takes.map(k=>'<tr data-take="'+esc(k.job_id)+'" data-item="'+esc(k.job_id)+'" class="'+(isSel('take',k.job_id)?'sel':'')+'" style="cursor:pointer"><td><span class="nm" style="font-size:17px">'+esc(k.job_id.slice(0,8))+'</span>'+(k.selected?' <span class="badge ok">selected</span>':'')+'</td><td class="ds">'+(takeRejected(k)?'<span class="badge err">rejected</span>':esc(k.status))+(k.duration_s!=null?' · '+esc(k.duration_s)+' s'+(k.timing_matches===false?' <span class="err">(shorter than its slot)</span>':''):'')+(k.error?'<div class="err">'+esc(k.error)+'</div>':'')+(k.check&&k.check.must_failed&&k.check.must_failed.length?' <span class="badge err">marked</span>':'')+'</td><td class="c">'+(k.url?'<button class="ic" data-play="'+esc(k.url)+'" data-name="'+esc(s.shot_id)+' · '+esc(k.job_id.slice(0,8))+'">▶</button>':'')+'</td><td>'+checklist(k.checklist)+takeCheck(k.check)+'</td><td>'+reviewsOf(k)+(k.status==='ready'&&can&&!k.selected&&!takeRejected(k)?'<div class="ds">'+(isWaiting(k.job_id)?'<span class="badge waitb">waiting for you</span> ':'')+'click the row: Select and Reject are beside it</div>':'')+'</td></tr>').join('')+'</tbody></table>';}

// ---------- the guide of an AI video shot (integration steps B to D): the server's data, the server's functions (guide.approve_still, reject_still, shoot) ----------
function guideBox(s){
  const g=s.guide;if(!g)return '';
  const pic=(u,cap)=>u?'<a class="pic on" href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" loading="lazy" decoding="async" alt=""><div class="cap">'+esc(cap)+'</div></a>':'';
  const v=g.verdicts.length?g.verdicts[g.verdicts.length-1]:null, f=g.frames, r=g.render, c=g.card;
  let h='<div class="guide" data-guide="'+esc(s.shot_id)+'"><div class="ds" style="margin-top:6px"><b>The guide</b> · '+esc(String(g.seconds))+' s · '+esc((g.recipe||'').replace(/_/g,' '))+'</div>';
  h+='<div class="ds">'+(f.status==='failed'?'The check frames failed: '+esc(f.error||''):f.status!=='ready'?'The check frames are being rendered.'
    :!v?'Check frames ready; a fresh checker looks at them.':v.pass?'Checked (round '+esc(String(v.round))+'): passed.':'Checked (round '+esc(String(v.round))+'): failed. '+esc((v.looks||[]).filter(x=>!x.pass).map(x=>x.look).join('; ')))
    +(v&&v.pass?(r.status==='failed'?' The render failed: '+esc(r.error||''):r.status!=='ready'?' The guide is being rendered.':' Guide rendered.'):'')+'</div>';
  if(g.warnings.length)h+='<details class="chkd"><summary class="ds">'+g.warnings.length+' warning'+(g.warnings.length>1?'s':'')+' on the scene</summary><div class="ds">'+g.warnings.map(esc).join('<br>')+'</div></details>';
  if(f.strip_url||r.guide_url)h+='<div class="strip">'+pic(f.strip_url,'check frames')+(r.guide_url?'<div class="btns"><button class="ic" data-play="'+esc(r.guide_url)+'" data-name="'+esc(s.shot_id)+' · the guide">▶</button><span class="ds">the guide</span></div>':'')+'</div>';

  if(t.dataset.vref||t.dataset.vtake){if(view){view=null;$('viewer').hidden=true;$('viewer').innerHTML='';}selectPic(t.dataset.vref?{ref:t.dataset.vref}:{take:t.dataset.vtake});}});
document.addEventListener('change',ev=>{if(ev.target&&ev.target.id==='rf-gap'){railFilter=ev.target.value||'all';renderRail(true);}});
document.addEventListener('keydown',ev=>{   // ↑ and ↓ move between the cards, as in PowerPoint
  if(view||(ev.key!=='ArrowDown'&&ev.key!=='ArrowUp')||/^(TEXTAREA|INPUT|SELECT)$/.test((ev.target||{}).tagName))return;
  const cs=[...$('rcards').querySelectorAll('.rcard')];if(!cs.length)return;ev.preventDefault();
  const i=cs.findIndex(c=>c.classList.contains('on')), nx=cs[Math.max(0,Math.min(cs.length-1,i<0?0:i+(ev.key==='ArrowDown'?1:-1)))];if(nx&&!nx.classList.contains('on'))selectUnit(nx.dataset.unitCard,true);});
(function(){const app=$('app'), g=$('grip');let w=Number(recall('rail'))||260;const set=x=>{w=Math.min(360,Math.max(200,Math.round(x)));app.style.setProperty('--rail',w+'px');};set(w);   // the rail's width, 200 to 360 px, kept on this computer
  g.addEventListener('mousedown',ev=>{ev.preventDefault();g.classList.add('drag');const left=$('rail').getBoundingClientRect().left, mv=e=>set(e.clientX-left), up=()=>{g.classList.remove('drag');document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);remember('rail',w);};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});})();
STEPS.forEach(([k])=>new MutationObserver(()=>{if(k===step){focusUnit();lockAll();}}).observe($('s-'+k),{childList:true}));   // every redraw of a step keeps the chosen card (and, on a run that cannot be written, its buttons off)
// ---------- render ----------
function render(){
  if(!step)step=recall('step')||autoStep();
  if(data&&data.state==='prepared')syncAnswers();   // R13: the stored answers of step 2
  frame();
  const typed={};document.querySelectorAll('textarea.keep').forEach(t=>typed[t.id]=t.value);   // review 27 Oct: a note or correction being typed survives the redraw
  STEPS.forEach(([k])=>{const sec=$('s-'+k);sec.hidden=(k!==step);if(k!==step)sec.innerHTML='';});   // defect 29: one panel at a time, so its buttons are the wired ones
  if(!data||data.state!=='prepared'){STEPS.forEach(([k])=>$('s-'+k).innerHTML='<div class="empty">Nothing to show yet.</div>');footer();if(stage()==='visuals')schedule(60000);return;}
  if(selUnit[step]===undefined){const c=waitCards().find(x=>x.step===step);selUnit[step]=c?c.unit:'';if(c&&(step==='pictures'||step==='takes')&&!selPic)selPic=defaultPic(c.unit);}   // design/129 UX1: a step opens on what waits first
  if(step==='treatment'){renderTreatment();wireFootage();}if(step==='plan')renderPlan();if(step==='references')renderReferences();if(step==='pictures')renderPictures();if(step==='takes')renderTakes();if(step==='record')renderRecord();
  Object.entries(typed).forEach(([id,v])=>{const t=$(id);if(t&&v)t.value=v;});
  footer();
  renderRail();focusUnit();idleMsg();   // design/129 UX1
  const busy=data.references.some(r=>r.status==='generating')||data.gaps.some(g=>g.shots.some(s=>s.takes.some(k=>['queued','running','submitted'].includes(k.status))));
  if(stage()==='visuals')schedule(busy||data.busy?15000:60000);   // design/74 L29
  lockAll();
}
// failure modes: a script error is said in the bar, never silent; E16: a picture whose file is missing gives way to a plain placeholder
function pageError(){const f=$('fmsg');f.className='status err';f.textContent='the page hit an error; reload';}
window.addEventListener('error',ev=>{if(!ev.target||ev.target===window)pageError();});
window.addEventListener('unhandledrejection',pageError);
document.addEventListener('error',ev=>{const i=ev.target;if(!i||i.tagName!=='IMG'||!i.closest('#app'))return;
  if(i.getAttribute('onerror')&&!i.dataset.tried){i.dataset.tried='1';return;}   // a search result tries its small copy first
  i.style.display='none';if(!(i.nextElementSibling&&i.nextElementSibling.classList.contains('ph')))i.insertAdjacentHTML('afterend','<div class="ph">picture not available</div>');},true);
load();
})();
</script>
