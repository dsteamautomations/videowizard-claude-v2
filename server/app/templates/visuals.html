{% extends "base.html" %}
{% block title %}Visuals · {{ run.code }} · VideoWizard{% endblock %}
{% block body %}
<style>
/* design/78: the visuals page on the voices page's frame (design/55): six steps on one line, one view at a time, the footer with the words and the step's action */
.v2 .top{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.v2 .steps{display:flex;gap:14px;font-size:16px;align-items:center;flex-wrap:wrap}
.v2 .steps a{color:var(--muted);text-decoration:none;cursor:pointer;padding:4px 2px}
.v2 .steps a.on{color:var(--fg);font-weight:700;border-bottom:2px solid var(--fg)}
.v2 .steps a.off{opacity:.45;cursor:default}
.v2 .dir{font-size:13px;color:var(--muted);margin-top:6px}
.v2 .dir strong{color:var(--fg)}
.v2 .meter{display:inline-flex;align-items:center;gap:8px;margin-left:12px;font-size:12.5px}
.v2 .meter .bar{display:inline-block;width:120px;height:8px;border-radius:999px;background:var(--z);overflow:hidden;vertical-align:middle;border:1px solid var(--line)}
.v2 .meter .bar i{display:block;height:100%;background:var(--accent)}
.v2 .meter .bar i.over{background:var(--err)}
.v2 .tabs{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
.v2 .tabs button{border:1px solid var(--line);background:var(--bg);padding:7px 16px;border-radius:999px;font-size:14px}
.v2 .tabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.v2 .search{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.v2 .search input{flex:1;min-width:200px;padding:11px 14px;font-size:15px;border-radius:12px}
.v2 .chip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--bg);font-size:12.5px;cursor:pointer}
.v2 table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.v2 th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--card);white-space:nowrap}
.v2 td{padding:11px 12px;vertical-align:top;border-bottom:1px solid var(--line)}
.v2 tbody tr:last-child td{border-bottom:0}
.v2 tbody tr:nth-child(even) td{background:var(--z)}
.v2 tbody tr:hover td{background:var(--hover)}
.v2 tbody tr.sel td{background:var(--sel)}
.v2 td.c{text-align:center;white-space:nowrap;width:56px}
.v2 .nm{font-weight:600;font-size:15px}
.v2 .ds{color:var(--muted);font-size:12.5px;margin-top:2px}
.v2 .badge{display:inline-block;font-size:11px;letter-spacing:.03em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);margin-right:6px;vertical-align:1px;white-space:nowrap}
.v2 .badge.ok{border-color:var(--ok);color:var(--ok)}
.v2 .badge.dec{border-color:var(--accent);color:var(--fg)}
.v2 .badge.err{border-color:var(--err);color:var(--err)}
.v2 .ic{border:none;background:none;font-size:18px;cursor:pointer;padding:4px 8px;color:var(--fg);border-radius:8px}
.v2 .ic:hover{background:var(--hover)}
.v2 input[type=checkbox],.v2 input[type=radio]{min-width:0;width:16px;height:16px;margin:0;vertical-align:middle;accent-color:var(--accent)}
.v2 .empty{color:var(--muted);padding:40px 12px;font-size:15px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.v2 .msg{min-height:1.2em;font-size:13px;margin:8px 0}
.v2 .err{color:var(--err)}.v2 .ok{color:var(--ok)}
.v2 h3{font-size:13px;color:var(--muted);font-weight:500;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.v2 .intended{font-size:13px;margin:4px 0 8px;padding-left:18px}
.v2 .intended li{margin:0}
.v2 .two{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media (max-width:760px){.v2 .two{grid-template-columns:1fr}}
.v2 .list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.v2 .list a{display:block;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--fg);text-decoration:none}
.v2 .list a:last-child{border-bottom:0}
.v2 .list a.on{background:var(--sel)}
.v2 .list a .ds{margin-top:1px}
.v2 .card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px;background:var(--card)}
.v2 .strip{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.v2 .pic{width:160px;min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--z);font-size:12px;position:relative}
.v2 .pic img{display:block;width:100%;height:90px;object-fit:cover;background:#000;cursor:pointer}
.v2 .pic .cap{padding:4px 6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2 .pic.on{border-color:var(--ok)}
.v2 .pic.off{opacity:.55;border-style:dashed}
.v2 .pic button{margin:0 6px 6px;padding:3px 9px;font-size:12px;border-radius:999px}
.v2 .pic .tick{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.v2 .pic .tick.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.v2 .chips{display:flex;gap:4px;flex-wrap:wrap;margin:0 6px 6px}
.v2 .chips button{font-size:11px;padding:1px 7px;border-radius:999px;margin:0}
.v2 .chk{margin:2px 6px 6px;padding-left:14px;font-size:11.5px;color:var(--muted);white-space:normal}
.v2 .chk li{margin:0}
.v2 .btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.v2 .btns button{padding:4px 10px;font-size:12.5px;border-radius:999px}
.v2 .btns button.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.v2 .need-words{border-color:var(--err)!important;box-shadow:0 0 0 2px var(--err)}
/* design/80: the split view: the grid left, the chosen picture and its controls in a sticky panel on the right; under 900px the panel sits under the grid */
.v2 .split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.v2 .panel{position:sticky;top:96px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);font-size:13px;max-height:calc(100vh - 210px);overflow:auto}   /* design/100 S3 */
.v2 .panel img{display:block;width:100%;max-height:380px;object-fit:contain;background:#000;border-radius:8px}
.v2 .panel .pnote{width:100%;min-height:64px;margin:8px 0 4px;font-size:13px;border-radius:8px;padding:6px 8px;resize:vertical}
.v2 .panel .btns button.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.v2 .pic.sel{outline:2px solid var(--accent);outline-offset:1px}
.v2 .fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg);font-size:12.5px;cursor:pointer;color:var(--fg)}
.v2 .fchip b{color:var(--muted);cursor:pointer;font-weight:400}
.v2 .timed{margin-top:4px;line-height:1.5}.v2 .timed .tm{font-variant-numeric:tabular-nums;color:var(--fg)}
.v2 .turn{font-size:13px;margin:8px 0 4px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.v2 .turn.you{border-color:var(--accent);color:var(--fg);font-weight:600}
.v2 .turn.ok{border-color:var(--ok);color:var(--ok)}
.v2 .turn.head{margin:14px 0 6px;background:var(--card)}
.v2 .chk li.ok{color:var(--ok)}.v2 .chk li.err{color:var(--err)}
@media (max-width:900px){.v2 .split{grid-template-columns:1fr}.v2 .panel{position:static}}
.v2 .foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:6}
.v2 .foot .in{max-width:1100px;margin:0 auto;padding:8px 20px 10px}
.v2 .foot .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.v2 .foot .status{font-size:13px;min-height:1.3em;margin-bottom:6px;color:var(--muted)}
.v2 .foot .status.err{color:var(--err)}
.v2 .foot .status.ok{color:var(--ok)}
.v2 .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:v2spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes v2spin{to{transform:rotate(360deg)}}
.v2 .player{display:flex;gap:12px;align-items:center;margin:0 0 8px;font-size:13px}
.v2 .player[hidden]{display:none}
.v2 .player span{flex:0 0 220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--fg)}
.v2 .player video{flex:1;width:100%;max-height:220px;background:#000;border-radius:8px}
.v2 .tray{flex:1;font-size:13px;color:var(--muted);min-width:120px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.v2 .foot .go{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);padding:10px 18px;font-size:14px;border-radius:10px;white-space:nowrap}
.v2 .foot .go:disabled{opacity:.45}
.v2 .foot button{white-space:nowrap}
.v2 .why{font-size:12px;color:var(--muted);margin-left:8px;white-space:nowrap}
.v2 .words{flex:1;min-width:240px;padding:8px 10px;font-size:14px;border-radius:10px;min-height:38px;resize:vertical}
.v2 .spacer{height:170px}
/* design/97: the shared panel on every picture step, wider; the viewer; the check in one line; what waits */
.v2 .split{grid-template-columns:minmax(0,1fr) minmax(360px,45%)}
.v2 .panel img{max-height:50vh;cursor:zoom-in}
.v2 .panel .act{position:sticky;bottom:0;background:var(--card);padding-top:8px;z-index:2}   /* design/100 S3: Approve and Reject always in view */
.v2 details.pdet{margin-top:6px}.v2 details.pdet summary{cursor:pointer;color:var(--muted);font-size:12.5px}   /* design/100 S4 */
.v2 .panel .pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.v2 .panel .pair img{max-height:40vh}
.v2 .panel video{width:100%;max-height:50vh;background:#000;border-radius:8px}
.v2 .panel .srcs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.v2 .panel .srcs img{width:72px;height:44px;object-fit:cover}
.v2 details.chkd summary{cursor:pointer;font-size:12px;margin:2px 6px}
.v2 details.chkd summary.err{color:var(--err)}.v2 details.chkd summary.ok{color:var(--ok)}
.v2 .badge.waitb{border-color:var(--accent);color:var(--fg)}
.v2 .hl{outline:3px solid var(--accent);outline-offset:2px}
.v2 .wlist{margin:6px 0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:13px}
.v2 .wlist a{display:block;padding:2px 0}
#viewer{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:grid;grid-template-columns:minmax(0,1fr) 360px}
#viewer[hidden]{display:none}
#viewer .vw-stage{overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:pinch-zoom}
#viewer .vw-stage img{max-width:100%;max-height:100%;transform-origin:center;user-select:none}
#viewer .vw-side{background:var(--card);padding:12px;overflow:auto;color:var(--fg);font-size:13px}
@media (max-width:900px){ #viewer{grid-template-columns:1fr} #viewer .vw-side{max-height:45vh}}   /* a space after each brace: a brace then a hash opens a Jinja comment */
.v2 .pclose{display:flex;justify-content:flex-end;margin:-6px -6px 2px}
.v2 .pclose .ic{font-size:22px;line-height:1}
.v2 .rsn{margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:10px}
@media (max-width:600px){.v2 .panel .act{position:sticky;bottom:0;background:var(--card);padding:6px 0;z-index:2}}
</style>
<div class="v2" id="app" data-code="{{ run.code }}">
<div class="top">
  <div class="steps" id="steps"></div>
  <div class="dir" id="line">Loading…</div>
  <div class="wlist" id="wlist" hidden></div>
</div>
<div class="msg" id="msg"></div>
<section id="s-treatment"></section>
<section id="s-plan" hidden></section>
<section id="s-references" hidden></section>
<section id="s-pictures" hidden></section>
<section id="s-takes" hidden></section>
<section id="s-record" hidden></section>
<div class="spacer"></div>
<div id="viewer" hidden></div>
<div class="foot"><div class="in"><div class="status" id="fmsg"></div>
<div class="player" id="player" hidden><span id="pl-name" class="ds">nothing playing</span><video id="pl" controls preload="metadata"></video></div>
<div class="row"><div class="tray" id="tray"></div><span id="action"></span></div>
</div></div>
</div>
<script>
(function(){
const code=document.getElementById('app').dataset.code, base='/runs/'+code+'/visuals';
const STEPS=[['treatment','Treatment'],['plan','Plan'],['references','References'],['pictures','Pictures'],['takes','Takes'],['record','Record']];
const ROUTE={video:'AI video',still:'still',graphic_sequence:'graphic sequence',footage:'footage'};
const CHIPS=['avoid brand text','posture only, not the person','colour only'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
let confirmPicks=false;   // design/106 N3: Done asked once, then Finish
let data=null, timer=null, inflight=false, step=null, selEl=null, selPic=null, gapFilter='', selGaps={}, view=null, wi=-1, hashDone=false, rejOpen=null, closed={};   // design/99: the reject reason open after a reject; panels the operator closed   // selPic: {sid,n} a search result, {ref} a reference (design/80)
const picks={};   // search id -> [{n, note}] in the order ticked (design/73)
function remember(k,v){try{localStorage.setItem('vz:'+code+':'+k,v);}catch(e){}}
function recall(k){try{return localStorage.getItem('vz:'+code+':'+k);}catch(e){return null;}}
function msg(t,err,busy){const f=$('fmsg');f.innerHTML=(busy?'<span class="spin"></span>':'')+esc(t||'');f.className='status '+(err?'err':(busy?'':'ok'));}
function needWords(id,text){const e=$(id);if(e){e.classList.add('need-words');e.focus();e.addEventListener('input',()=>e.classList.remove('need-words'),{once:true});}msg(text||'Your words are required: type them in the box at the foot first.',true);}   // design/74 L31
async function act(body){
  if(inflight){throw new Error('Still recording the last action; try again in a moment.');}
  inflight=true;
  try{const r=await fetch(base+'/act',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j=null;try{j=await r.json();}catch(e){j=null;}
    if(!r.ok){throw new Error((j&&j.message)||('The server answered '+r.status+'.'));}return j;}
  finally{inflight=false;}
}
async function send(body,okText){msg('Recording…',false,true);try{const j=await act(body);if(view){view=null;$('viewer').hidden=true;}msg((j&&j.next)||okText||'Recorded.');if(j&&j.view){data=j.view;render();}else{await load();}return j;}catch(err){msg(err.message,true);highlightNamed(err.message,document);return null;}}
async function load(){
  let r;
  try{r=await fetch(base+'/data',{cache:'no-store'});}catch(e){msg('The server is not reachable; trying again in 15 s.',true);schedule(15000);return;}
  if(r.status===401){location.href='/login?next='+encodeURIComponent(base);return;}
  if(!r.ok){msg('The page could not load ('+r.status+').',true);schedule(15000);return;}
  data=await r.json();render();
  if(!hashDone){hashDone=true;applyHash();}   // design/97 W1: a link opens its item
}
function schedule(ms){clearTimeout(timer);timer=setTimeout(load,ms||15000);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&data){load();}});   // design/74 L29
function stage(){return data&&data.run?data.run.stage:null;}
function fmt(frames){const fps=Number(data&&data.fps)||25;const s=Math.max(0,Math.round(frames/fps));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function secs(frames){const fps=Number(data&&data.fps)||25;return (frames/fps).toFixed(1)+' s';}
function words(){return ((($('pwords')||{}).value)||(($('words')||{}).value)||'').trim();}   // design/97 P1: the panel's words first
function autoStep(){const d=data;if(!d||d.state!=='prepared')return 'treatment';
  if(!d.treatment||d.treatment_draft)return 'treatment';
  if(!d.plan_digest||d.gaps.some(g=>!g.accepted&&!g.recorded&&g.shots.length))return 'plan';
  const els=(d.elements||[]).filter(e=>e.kind!=='graphic');
  if(roundOpen()||els.some(e=>!(d.references||[]).some(r=>r.element_id===e.id&&r.kind==='sheet'&&r.status==='approved')))return 'references';
  if(d.gaps.some(g=>g.accepted&&!g.recorded&&g.shots.some(s=>s.route!=='video'&&!s.asset)))return 'pictures';
  if(d.gaps.some(g=>g.accepted&&!g.recorded&&g.shots.some(s=>s.route==='video'&&!s.takes.some(k=>k.selected))))return 'takes';
  return 'record';}
function unsavedTicks(){return Object.values(picks).reduce((k,l)=>k+((l||[]).length),0);}   // design/99 C5
window.addEventListener('beforeunload',ev=>{if(unsavedTicks()){ev.preventDefault();ev.returnValue='';}});
document.addEventListener('click',ev=>{const c=ev.target.closest('[data-rchip]');if(!c)return;const w=$('rwhy');if(w)w.value=(w.value?w.value+'; ':'')+c.dataset.rchip;});   // design/99 C3: a chip adds to the reason
function go(s){if(step==='references'&&s!=='references'&&unsavedTicks()&&!confirm(unsavedTicks()+' ticked pictures are not saved. Leave anyway?'))return;step=s;confirmPicks=false;remember('step',s);render();window.scrollTo(0,0);}   // review 27 Oct: Done is asked again after a step change
// ---------- frame ----------
function frame(){
  const d=data;
  const wt=(d&&d.waiting)||[], per={};wt.forEach(w=>{per[w.step]=(per[w.step]||0)+1;});   // design/97 W3
  $('steps').innerHTML=STEPS.map(([k,l])=>'<a data-s="'+k+'" class="'+(k===step?'on':'')+'">'+l+(per[k]?' · '+per[k]+' waiting':'')+'</a>').join('<span class="ds">›</span>');
  $('steps').querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>go(a.dataset.s)));
  if(!d||d.state!=='prepared'){$('line').textContent='The visuals stage has not started: the assistant runs vw visuals prepare.';return;}
  const b=d.budget||{}, over=b.spent_inr>b.cap_inr, pct=b.cap_inr?Math.min(100,Math.round(100*b.spent_inr/b.cap_inr)):0;
  const meter='<span class="meter">spend '+inr(b.spent_inr)+' of '+inr(b.cap_inr)+' <span class="bar"><i class="'+(over?'over':'')+'" style="width:'+pct+'%"></i></span>'+(b.images?' images: '+(b.images-(b.fixes||0))+' requested + '+(b.fixes||0)+' fixes':'')+'</span>';   // design/96 X3
  const t=d.treatment, dr=d.treatment_draft, at=autoStep();
  let line=stage()!=='visuals'?'The run is at <strong>'+esc(d.run.stage)+'</strong>.':(dr?(t?'<strong>New treatment draft</strong>: it replaces the approved one; read it and approve it at the foot':'<strong>Treatment drafted</strong>: read it and approve it at the foot'):(!t?'The assistant is preparing the treatment':'<strong>'+esc(STEPS.find(x=>x[0]===at)[1])+'</strong> is the step the run is at'));
  if(d.run&&d.run.open_defects&&d.run.open_defects.length){line+=' · <span class="err">a defect is open; nothing can be recorded until it is fixed</span>';}
  const wn=(d.waiting||[]).length;
  $('line').innerHTML=line+meter+(wn?' · <a id="wcount" style="cursor:pointer"><b>'+wn+'</b> waiting for your verdict</a> <button id="wnext">Next waiting</button>':'');   // design/97 W3
  if($('wcount'))$('wcount').addEventListener('click',()=>{const l=$('wlist');l.hidden=!l.hidden;l.innerHTML=(d.waiting||[]).map(w=>'<a href="'+esc(w.link)+'">'+esc(w.label)+'</a>').join('');});
  if($('wnext'))$('wnext').addEventListener('click',()=>{const w=d.waiting||[];if(!w.length)return;wi=(wi+1)%w.length;const h=w[wi].link.split('#')[1];if(location.hash==='#'+h)applyHash();else location.hash=h;});
}
function applyHash(){   // design/97 W1: #step/group/item opens the step, the item in the panel, scrolls to it and outlines it
  const h=decodeURIComponent(location.hash.slice(1));if(!h||!data||data.state!=='prepared')return;
  const [st,grp,item]=h.split('/');if(!STEPS.some(x=>x[0]===st))return;
  const refs=data.references||[];step=st;remember('step',st);
  selPic=item&&refs.some(r=>r.id===item)?{ref:item}:(st==='takes'&&item&&!['spec','reuse'].includes(item)?{take:item}:null);
  if(st==='references'&&grp)selEl=grp;
  render();
  const el=document.querySelector('[data-item="'+(item||'')+'"]')||document.getElementById('card-'+grp);
  if(el){el.scrollIntoView({block:'center'});el.classList.add('hl');}
  const w=(data.waiting||[]).find(x=>x.link.endsWith('#'+h));
  if(item&&!['spec','reuse'].includes(item)&&!document.querySelector('[data-item="'+item+'"]'))msg('That item is no longer waiting: '+(w?w.label:h)+'.',true);
}
window.addEventListener('hashchange',applyHash);
// ---------- treatment ----------
function footageBlock(){   // design/88 F4: the footage is measured and told; the operator may correct it with their words
  const f=data.footage;if(!f||!f.line)return '';
  const opt=(name,vals)=>'<select id="ft-'+name+'"><option value="">'+name+': as measured</option>'+vals.map(v=>'<option value="'+v+'">'+v+'</option>').join('')+'</select>';
  return '<div class="card"><span class="nm" style="font-size:14px">'+esc(f.line)+'</span> <button class="chip" id="ft-open">Correct this</button>'+
    '<div id="ft-form" hidden style="margin-top:8px"><div class="btns">'+opt('camera',['cinema','mirrorless','phone','drone','mixed'])+opt('support',['handheld','tripod','gimbal','mixed'])+opt('look',['natural','graded','log'])+'</div>'+
    '<textarea id="ftwords" class="words" style="width:100%;margin-top:6px" placeholder="your words: what the footage really is"></textarea><div class="btns"><button class="go" data-a="footage">Save the correction</button></div></div></div>';}
function wireFootage(){const o=$('ft-open');if(!o)return;o.addEventListener('click',()=>{$('ft-form').hidden=!$('ft-form').hidden;});
  $('s-treatment').querySelectorAll('button[data-a="footage"]').forEach(b=>b.addEventListener('click',()=>click(b)));}
function clipForm(s){   // design/89 B3, finding 7: a stretch of a clip fills a still or a video shot; the reuse fields when the clip is already on screen
  if(!['image','video'].includes(s.visual_type)||!(data.clips||[]).length||stage()!=='visuals')return '';const id=esc(s.shot_id);
  return '<details style="margin-top:8px"><summary class="ds" style="cursor:pointer">Use a stretch of a clip instead</summary><div class="btns">'+
    '<select id="cf-c-'+id+'">'+data.clips.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+' ('+Math.round(Number(c.duration_s)||0)+' s)</option>').join('')+'</select>'+

    '<textarea id="cf-w-'+id+'" class="words" style="width:100%;margin-top:6px" placeholder="your words for this stretch"></textarea>'+
    '<div class="btns"><button class="go" data-a="clip" data-shot="'+id+'">Use this stretch</button></div></details>';}
function reuseFields(s){const id=esc(s.shot_id);   // H2, H4: only when the footage is already on screen elsewhere; the operator then approves the reuse

    '<input id="rf-why-'+id+'" placeholder="why the same footage again" style="width:100%">'+
    '<input id="rf-alt-'+id+'" placeholder="the new angle considered, and why it adds nothing" style="width:100%;margin-top:4px">'+

function reuseOf(shot){const v=k=>(($('rf-'+k+'-'+shot)||{}).value||'').trim();const c=v('crop');

function styleCard(){   // design/89 C2: the film's one graphic style, approved once as a style sheet picture

function specRow(r){return '<tr'+(r.status==='unknown'?' class="err"':'')+'><td>'+esc(r.part)+'</td><td>'+esc(r.measure)+'</td><td>'+esc(r.size)+'</td><td>'+esc(r.status)+'</td><td>'+esc(r.source)+'</td></tr>';}
function specsBlock(){   // design/106 D5: every spec still to approve, one table, one approval
  const shots=[];(data.gaps||[]).forEach(g=>{if(g.accepted)g.shots.forEach(s=>{if(s.spec&&!s.spec.approved)shots.push(s);});});
  if(!shots.length)return '';const can=stage()==='visuals';
  return '<div class="card" data-item="specs" id="card-specs"><span class="nm">Drawing specs to approve</span> <span class="ds">'+shots.length+' spec'+(shots.length>1?'s':'')+'; the sizes come from the planner, with their sources</span>'+
    '<table class="ds" style="width:100%;margin-top:4px"><tr><th align="left">Drawing</th><th align="left">Part</th><th align="left">Measure</th><th align="left">Value or ratio</th><th align="left">Status</th><th align="left">Source</th></tr>'+
    shots.map(s=>s.spec.table.length?s.spec.table.map(r=>specRow(r).replace('<td>','<td>'+esc(s.shot_id)+'</td><td>')).join('')

    '<table class="ds" style="width:100%;margin-top:4px"><tr><th align="left">Part</th><th align="left">Measure</th><th align="left">Size</th><th align="left">Status</th><th align="left">Source</th></tr>'+
    s.spec.table.map(specRow).join('')+'</table>'+(s.spec.table.filter(r=>r.risk).map(r=>'<div class="err">'+esc(r.risk)+'</div>').join(''))+
    (s.spec.relationships.length?'<div class="ds">Must hold: '+s.spec.relationships.map(esc).join(' · ')+'</div>':'')+(s.spec.label?'<div class="ds">Label: '+esc(s.spec.label)+'</div>':'')+

  if(s.spec.correction)h+='<div class="ds">Correction sent: '+esc(s.spec.correction)+' (the assistant revises the spec)</div>';
  if(can&&!s.spec.approved)h+='<div class="btns"><button class="go" data-a="approve-spec" data-shot="'+id+'">Approve the spec</button></div>'+   // design/106 D4: the sizes come from the planner, never typed
    '<textarea id="sp-c-'+id+'" class="words keep" style="width:100%;margin-top:6px" placeholder="correct a value, if one is wrong (optional): the cavity is 50 mm"></textarea><div class="btns"><button data-a="correct-spec" data-shot="'+id+'">Send the correction</button></div>';
  if(can&&frames.length)h+='<div class="ds" style="margin-top:6px">Measure from your footage frames:</div><select id="ms-f-'+id+'" multiple size="3">'+frames.map(r=>'<option value="'+esc(r.id)+'">'+esc(r.name)+'</option>').join('')+'</select>'+
    '<input id="ms-q-'+id+'" placeholder="what to measure, for example: how thick is the wall?" style="width:100%;margin-top:4px"><div class="btns"><button data-a="measure" data-shot="'+id+'">Measure</button></div>';
  const ms=(data.measurements||[]).flatMap(m=>m.measurements.map(x=>esc(x.part)+' '+esc(x.measure)+' '+esc(x.value)+' '+esc(x.unit)+' ('+esc(x.source)+')'));
  return h+(ms.length?'<div class="ds">Measured: '+ms.join(' · ')+'</div>':'')+'</details>';}
function reuseBox(s){   // design/89 H2, H7: a reuse the assistant proposed waits for the operator's own words
  const p=(data.reuse_pending||{})[s.shot_id];if(!p)return '';
  return '<div class="card" style="border-color:var(--accent);margin-top:8px"><b>Showing footage again</b><div class="ds">Clip '+esc(p.clip_id)+' is already on screen in '+esc(p.on_screen)+'. '+
    'The reason: '+esc(p.reason)+'. The new angle considered: '+esc(p.considered)+'. A reimagined shot is preferred; approve only if it adds nothing.</div>'+
    '<textarea id="rw-'+esc(s.shot_id)+'" class="words" style="width:100%;margin-top:6px" placeholder="your words: why the same footage is right here"></textarea>'+

function timed(g){const t=g.timing;if(!t||!t.sentences||!t.sentences.length)return '';   // design/89 A1: when each sentence is spoken in the gap
  return '<div class="ds timed">'+t.sentences.map(s=>'<span class="tm">'+Number(s.start_s).toFixed(1)+'–'+Number(s.end_s).toFixed(1)+' s</span> “'+esc(s.text)+'”').join('<br>')+'</div>';}
function intendedBlock(){const iv=data.intended_visuals||[];if(!iv.length)return footageBlock();return footageBlock()+'<h3>The script\'s intended visuals</h3><div class="card">'+iv.map(e=>'<div class="ds"><b>'+esc(e.heading||'(no heading)')+'</b>'+(e.narration_starts?' · “'+esc(e.narration_starts)+'…”':'')+'</div><ul class="intended">'+e.lines.map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>').join('')+'</div>';}
function renderTreatment(){
  const d=data, t=d.treatment, dr=d.treatment_draft, tr=dr||t, recorded=!!t&&!dr, replaces=dr&&t?t.at:null;
  if(!tr){$('s-treatment').innerHTML=intendedBlock()+'<div class="empty">The treatment, gap by gap, appears here once the assistant drafts it.</div>';return;}
  const byGap={};(tr.gaps||[]).forEach(e=>byGap[e.gap_id]=e);
  const rows=d.gaps.map(g=>{const e=byGap[g.gap_id]||{};
    return '<tr><td><span class="nm">'+esc(g.gap_id)+'</span><div class="ds">'+esc(g.requirement||'')+'</div>'+timed(g)+'</td><td>'+(e.intended&&e.intended.length?'<ul class="intended">'+[].concat(e.intended).map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>':'<span class="ds">none in the script</span>')+(e.departure?'<div class="ds err">departs: '+esc(e.departure)+'</div>':'')+'</td><td>'+esc(e.picture||'')+((e.depicts||[]).length?'<div class="ds">Depicts: '+e.depicts.map(esc).join(' · ')+'</div>':'')+(e.activity_level?'<div class="ds">Activity: '+esc(e.activity_level)+'</div>':'')+'</td><td class="ds">'+esc((e.routes||[]).map(r=>ROUTE[r]||r).join(', '))+'</td><td class="c">'+esc(e.seconds!=null?e.seconds+' s':'')+'</td><td class="c">'+esc(e.images!=null?e.images:'')+'</td></tr>';}).join('');
  const tot=tr.totals||{};
  const badge=recorded?'approved '+esc(String(tr.at||'').slice(0,16).replace('T',' ')):(replaces?'draft, replaces the approved treatment of '+esc(String(replaces).slice(0,16).replace('T',' ')):'draft');
  $('s-treatment').innerHTML=intendedBlock()+'<h3>Treatment <span class="badge '+(recorded?'ok':(replaces?'dec':''))+'">'+badge+'</span>'+(recorded&&tr.quote?'<span class="ds">“'+esc(tr.quote)+'”</span>':'')+'</h3>'+
    '<table><thead><tr><th>Gap</th><th>The team\'s intended visuals</th><th>Picture</th><th>Route</th><th class="c">Length</th><th class="c">Images</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="ds" style="margin-top:8px">'+esc(tot.gaps||0)+' gaps · '+esc(tot.images||0)+' images · '+Object.entries(tot.routes||{}).map(([k,v])=>v+' '+(ROUTE[k]||k)).join(', ')+' · estimate '+inr(tr.estimate_inr)+' against the cap '+inr((d.budget||{}).cap_inr)+(tot.frozen_share!=null?' · <span class="'+(tot.frozen_share>tot.frozen_limit?'err':'')+'">frozen '+Math.round(tot.frozen_share*100)+' % of the film (limit '+Math.round(tot.frozen_limit*100)+' %)</span>':'')+'</div>';   // design/89 B4
}
// ---------- plan ----------
function renderPlan(){
  const d=data;
  if(!d.plan_digest){$('s-plan').innerHTML='<div class="empty">'+(d.treatment?'The assistant writes the plan to the approved treatment.':'The treatment comes first.')+'</div>';return;}
  const byGap={};((d.treatment||d.treatment_draft||{}).gaps||[]).forEach(e=>byGap[e.gap_id]=e);
  const rows=d.gaps.map(g=>{const e=byGap[g.gap_id]||{};
    const state=g.recorded?'<span class="badge ok">recorded</span>':g.revise?'<span class="badge dec">under revision</span>':g.accepted?'<span class="badge ok">accepted</span>':'<span class="badge dec">to accept</span>';
    const words_=g.revise?'<div class="ds err">Sent back: “'+esc(g.revise.notes||g.revise.quote)+'”</div>':(g.accepted&&g.quote?'<div class="ds">“'+esc(g.quote)+'”</div>':'');   // design/75, 76
    const choice=g.choices?'<div class="btns"><span class="ds">Two choices:</span>'+g.choices.options.map(c=>'<button data-a="select" data-gap="'+esc(g.gap_id)+'" data-choice="'+esc(c.id)+'" class="'+(g.choices.selected===c.id?'go':'')+'" title="'+esc(c.why)+'">'+esc(c.title)+(g.choices.recommended===c.id?' (recommended)':'')+'</button>').join('')+'</div>':'';
    const shots=g.shots.length?'<details><summary class="ds" style="cursor:pointer">'+g.shots.length+' shot'+(g.shots.length>1?'s':'')+'</summary>'+g.shots.map(s=>'<div class="ds" style="margin:4px 0 0 12px"><b>'+esc(s.shot_id)+'</b> · '+esc(ROUTE[s.route]||s.route)+' · '+secs(s.end_frame-s.start_frame)+' — '+esc(s.purpose)+(s.ambient?'<div>'+'Moves around it: '+esc(s.ambient)+'</div>':'')+'</div>').join('')+'</details>':'<span class="ds">'+(g.choices&&!g.choices.selected?'choose one of the two':'no shots yet')+'</span>';
    const can=!g.recorded&&g.shots.length;
    return '<tr class="'+(selGaps[g.gap_id]?'sel':'')+'"><td class="c">'+(can?'<input type="checkbox" data-sel="'+esc(g.gap_id)+'" '+(selGaps[g.gap_id]?'checked':'')+' aria-label="select '+esc(g.gap_id)+'">':'')+'</td><td><span class="nm">'+esc(g.gap_id)+'</span><div class="ds">'+fmt(g.start_frame)+' – '+fmt(g.end_frame)+' · '+secs(g.end_frame-g.start_frame)+'</div><div class="ds">'+esc(g.requirement||'')+'</div>'+timed(g)+'</td><td>'+esc(e.picture||'')+'<div class="ds">'+esc((e.routes||[]).map(r=>ROUTE[r]||r).join(', '))+'</div>'+((g.split||[]).length?'<div class="ds">'+g.split.map(x=>esc(x.route)+' '+x.seconds.toFixed(1)+' s ('+x.shots+')').join(' · ')+'</div>':'')+choice+'</td><td>'+shots+'</td><td>'+state+words_+'</td></tr>';}).join('');
  $('s-plan').innerHTML='<p class="ds" style="font-size:14px;margin:14px 0 4px">Tick the gaps, type your words at the foot, then Accept them, or Revise to send them back with what to change. A change request is never a yes.</p><table><thead><tr><th class="c"></th><th>Gap</th><th>Picture · route</th><th>Shots</th><th>State</th></tr></thead><tbody>'+rows+'</tbody></table>';
  $('s-plan').querySelectorAll('[data-sel]').forEach(c=>c.addEventListener('change',()=>{selGaps[c.dataset.sel]=c.checked;if(!c.checked)delete selGaps[c.dataset.sel];renderPlan();footer();}));
  $('s-plan').querySelectorAll('button[data-a]').forEach(b=>b.addEventListener('click',()=>click(b)));
}
// ---------- references (design/73 R4b; design/80: the split view, the grid left, the chosen picture in the panel on the right) ----------
function latestSearch(eid){return (data.searches||[]).filter(s=>s.element_id===eid).sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0]||null;}
function pickOf(sid,n){return (picks[sid]||[]).find(p=>p.n===n);}
function toggleTick(sid,n){picks[sid]=picks[sid]||[];const i=picks[sid].findIndex(p=>p.n===n);if(i>=0)picks[sid].splice(i,1);else picks[sid].push({n:n,note:''});}
function shotFacts(s){   // design/91: what the shot depicts, its words, what the step before left, the facts it rests on
  let h='';if(s.message)h+='<div class="ds">Message: '+esc(s.message)+(s.adds?' · adds: '+esc(s.adds):'')+'</div>';   // design/91 N11
  if(s.depicts)h+='<div class="ds">Depicts: '+esc(s.depicts)+'</div>';
  if(s.ambient)h+='<div class="ds">'+'Moves around it: '+esc(s.ambient)+'</div>';   // design/101 M6
  if(s.size||s.camera_reason)h+='<div class="ds">'+[s.size&&('Size: '+esc(s.size)),s.camera_reason&&('Camera: '+esc(s.camera_reason))].filter(Boolean).join(' · ')+'</div>';   // design/103 A3, A4
  if(s.light||s.air)h+='<div class="ds">'+[s.light&&('Light: '+esc(s.light)),s.air&&('Air: '+esc(s.air))].filter(Boolean).join(' · ')+'</div>';   // design/103 A1, A2
  if(s.transition_in||s.transition_out)h+='<div class="ds">Transition: '+esc([s.transition_in&&('in: '+s.transition_in),s.transition_out&&('out: '+s.transition_out)].filter(Boolean).join(' · '))+(s.transition_reason?' ('+esc(s.transition_reason)+')':'')+'</div>';   // design/91 N16
  if((s.descriptors||[]).length)h+='<div class="ds">Words it must not contradict: '+s.descriptors.map(esc).join(' · ')+'</div>';
  if((s.carries_over||[]).length)h+='<div class="ds">Carried over from the step before: '+s.carries_over.map(esc).join(' · ')+'</div>';
  if((s.facts||[]).length)h+='<div class="ds">Facts: '+s.facts.map(esc).join(' · ')+'</div>';
  return h;}
function pairPlan(s){   // design/91 N1: what the clip must do between the two pictures, and any difference the check found no cause for
  let h=(s.changes||[]).length?'<div class="ds">The changes: '+s.changes.map(c=>esc(c.what)+' ('+esc(c.beat_id)+')').join(' · ')+'</div>':'<div class="ds err">No change list for this shot.</div>';
  if(s.motion)h+='<div class="ds">The motion: '+esc(s.motion)+'</div>';
  const pc=s.pair_check;if(pc&&pc.error)h+='<div class="ds">Pair check not run: '+esc(pc.error)+'</div>';
  if(pc&&(pc.uncaused||[]).length)h+='<div class="err">Marked: '+pc.uncaused.map(d=>esc(d.what)).join(' · ')+'. No change in the list causes this: approve the pair as it is, or change the end image.</div>';
  else if(pc&&!pc.error)h+='<div class="ds ok">Pair checked: every difference has its cause ✓</div>';
  return h;}
function takeCheck(c){   // design/91 N3: the take read by Gemini before you watch it; a failed line with the second it happens
  if(!c)return '';if(c.error)return '<div class="ds">Take check not run: '+esc(c.error)+'</div>';
  const lines=c.lines||[], bad=lines.filter(l=>l.pass===false), ok=lines.filter(l=>l.pass===true).length;   // folded like a picture's check (design/97 K1): one line, the lines on a click
  const sum='Take check: '+ok+' passed'+(bad.length?' · '+bad.length+' marked: '+bad.map(l=>l.check+(l.at_s!=null?' at '+l.at_s+' s':'')).join('; '):'');
  return '<details class="chkd"><summary class="'+(bad.length?'err':'ok')+'">'+esc(sum)+'</summary><ul class="chk">'+lines.map(l=>'<li class="'+(l.pass===true?'ok':l.pass===false?'err':'')+'">'+(l.pass===true?'✓ ':l.pass===false?'✗ ':'· ')+esc(l.check)+
    (l.at_s!=null&&l.pass===false?' at '+esc(l.at_s)+' s':'')+(l.seen?' <i>('+esc(l.seen)+')</i>':'')+'</li>').join('')+'</ul></details>';}
function reviewsOf(k){   // the latest verdict with its reason; earlier ones folded
  const all=k.reviews||[];if(!all.length)return '';const said=all.filter(r=>r.notes), top=said.length?said[said.length-1]:all[all.length-1], more=said.filter(r=>r!==top);
  return '<div class="ds">'+esc(top.decision)+(top.notes?': '+esc(top.notes):'')+'</div>'+(more.length?'<details class="chkd"><summary class="ds">'+more.length+' earlier</summary>'+more.map(r=>'<div class="ds">'+esc(r.decision)+': '+esc(r.notes)+'</div>').join('')+'</details>':'');}
function checklist(lines,check){   // design/74 L6; design/86 K2; design/97 K1: one line, coloured by the worst result, a failed must's text in it; a click opens the lines
  if(check&&check.lines&&check.lines.length){const bad=check.lines.filter(c=>c.pass===false), must=bad.filter(c=>c.weight==='must'), ok=check.lines.filter(c=>c.pass===true).length;

function play(url,name){const pl=$('pl');$('player').hidden=false;pl.src=url;$('pl-name').textContent=name;pl.play().catch(()=>{});}
function takeRejected(k){return !!(k.reviews&&k.reviews.length&&k.reviews[k.reviews.length-1].decision==='rejected');}   // defect 30: the job stays 'ready'; its latest review says rejected
function shotState(s){   // design/86 K3: whose turn it is on this shot, and how long to wait
  const d=data, kf=(d.references||[]).filter(r=>ownPic(r,s)&&r.kind==='keyframe'&&r.status!=='rejected'&&r.status!=='failed');
  const ids=new Set(kf.map(r=>r.id)), isStart=r=>{if(r.role)return r.role==='start';return !(r.parents||[]).some(p=>ids.has(p));};   // design/106 T1
  const open=s.takes.find(k=>['queued','running','submitted','storage_pending'].includes(k.status)), ready=s.takes.find(k=>k.status==='ready'&&!k.selected&&!takeRejected(k));
  if(s.takes.some(k=>k.selected))return ['ok','Take selected.'];
  if(s.asset&&s.asset.kind==='clip')return ['ok','Filled with a stretch of '+(s.asset.name||'a clip')+'.'];   // design/89 B3
  if(ready)return ['you','Your turn: watch the take and select it, or reject it with what is wrong.'];
  if(open)return ['wait','The take is being made, about 3 minutes. You may leave the page; it refreshes itself.'];
  if(s.takes.some(takeRejected))return ['assistant','The take is rejected: the assistant prepares a new take from your reason. Nothing to do here.'];   // defect 30
  const gen=kf.filter(r=>r.status==='generating');
  if(gen.length)return ['wait','Making the '+(gen.some(isStart)?'start':'end')+' image, about 1 minute. Nothing for you to do; the page refreshes itself.'];
  const cand=kf.filter(r=>r.status==='candidate'), appr=kf.filter(r=>r.status==='approved');
  if(cand.some(r=>!r.check&&r.checklist&&r.checklist.length))return ['wait','Checking the picture against its list, under 30 seconds.'];
  const sApp=appr.find(isStart);
  if(cand.some(isStart)&&!sApp)return ['you','Your turn: approve the start image, or reject it with what is wrong.'];
  if(sApp&&cand.some(r=>!isStart(r)))return ['you','Your turn: approve the pair, or reject the end image with what is wrong.'];
  if(sApp&&appr.some(r=>!isStart(r)))return ['assistant',s.prepared?'The pair is approved; the assistant submits the take.':'The pair is approved; the assistant prepares the take. Nothing to do here.'];
  if(sApp)return ['assistant',sApp.end_queued?'The end image is on its way.':'Waiting for the assistant: the end image\'s prompt is not written yet. Nothing to do here.'];
  return ['assistant','Waiting for the assistant to generate the start image. Nothing to do here.'];
}
function renderTakes(){
  const d=data, can=stage()==='visuals'&&!!d.treatment;
  const gaps=d.gaps.filter(g=>g.accepted&&g.shots.some(s=>s.route==='video'));
  if(!gaps.length){$('s-takes').innerHTML='<div class="empty">No video shot in an accepted gap yet.</div>';return;}
  const states={};gaps.forEach(g=>g.shots.filter(s=>s.route==='video').forEach(s=>{states[s.shot_id]=shotState(s);}));
  const n=k=>Object.values(states).filter(x=>x[0]===k).length;
  let h='<div class="turn head"><b>'+n('you')+'</b> want your decision · <b>'+n('wait')+'</b> being made · <b>'+n('assistant')+'</b> wait for the assistant · <b>'+n('ok')+'</b> done</div>';
  gaps.forEach(g=>{
    h+='<h3>'+esc(g.gap_id)+(g.recorded?' <span class="badge ok">recorded</span>':'')+'</h3>';
    g.shots.filter(s=>s.route==='video').forEach(s=>{
      const st=states[s.shot_id];
      let sh='<div class="card" id="card-'+esc(s.shot_id)+'"><span class="nm">'+headOf(s)+'</span> <span class="ds">'+filmAt(s)+' · '+secs(s.end_frame-s.start_frame)+(s.bound&&s.bound.length?' · bound':'')+(s.prepared?' · take prepared':'')+'</span><div class="ds">'+esc(s.purpose)+'</div>'+shotFacts(s)+
        '<div class="turn '+st[0]+'">'+esc(st[1])+'</div>';
      const pair=(d.references||[]).filter(r=>ownPic(r,s)&&r.kind==='keyframe'), live=pair.filter(r=>r.status!=='rejected'&&r.status!=='failed');   // design/106 T1: the latest start and end in view
      const latest=['start','end'].flatMap(role=>{const of=live.filter(r=>picWord(r)===role+' image');const cands=of.filter(r=>r.status==='candidate');return cands.length>1?cands:of.slice(-1);}), older=pair.filter(r=>!latest.includes(r));   // review 27 Oct: two start candidates (design/86 K4) both in view
      const card=r=>refCard({...r,name:picWord(r)+' · '+r.name},'',true);
      if(pair.length){sh+='<div class="ds" style="margin-top:6px">The pictures: click a picture to see it large, approve or reject it.</div><div class="strip">'+latest.map(card).join('')+'</div>'+(older.length?'<details class="chkd"><summary class="ds">'+older.length+' earlier picture'+(older.length>1?'s':'')+'</summary><div class="strip">'+older.map(card).join('')+'</div></details>':'')+pairPlan(s);}
      if(s.takes.length){sh+='<table><thead><tr><th>Take</th><th>State</th><th class="c">Play</th><th>Checklist</th><th>Review</th></tr></thead><tbody>'+s.takes.map(k=>'<tr data-take="'+esc(k.job_id)+'" data-item="'+esc(k.job_id)+'" class="'+(isSel('take',k.job_id)?'sel':'')+'" style="cursor:pointer"><td><span class="nm" style="font-size:14px">'+esc(k.job_id.slice(0,8))+'</span>'+(k.selected?' <span class="badge ok">selected</span>':'')+'</td><td class="ds">'+(takeRejected(k)?'<span class="badge err">rejected</span>':esc(k.status))+(k.duration_s!=null?' · '+esc(k.duration_s)+' s'+(k.timing_matches===false?' <span class="err">(shorter than its slot)</span>':''):'')+(k.error?'<div class="err">'+esc(k.error)+'</div>':'')+(k.check&&k.check.must_failed&&k.check.must_failed.length?' <span class="badge err">marked</span>':'')+'</td><td class="c">'+(k.url?'<button class="ic" data-play="'+esc(k.url)+'" data-name="'+esc(s.shot_id)+' · '+esc(k.job_id.slice(0,8))+'">▶</button>':'')+'</td><td>'+checklist(k.checklist)+takeCheck(k.check)+'</td><td>'+reviewsOf(k)+(k.status==='ready'&&can&&!k.selected&&!takeRejected(k)?'<div class="ds">'+(isWaiting(k.job_id)?'<span class="badge waitb">waiting for you</span> ':'')+'click the row: Select and Reject are beside it</div>':'')+'</td></tr>').join('')+'</tbody></table>';}
      else{sh+='<div class="ds">'+(s.prepared?'Take prepared; the assistant submits it.':'No take yet.')+'</div>';}
      h+=sh+qBox(s.shot_id)+specBox(s)+clipForm(s)+reuseBox(s)+'</div>';
    });
  });
  $('s-takes').innerHTML=split(h);   // design/97 P2: a take, a pair, judged in the shared panel
  const root=$('s-takes');
  root.querySelectorAll('[data-play]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();play(b.dataset.play,b.dataset.name);}));
  root.querySelectorAll('tr[data-take]').forEach(tr=>tr.addEventListener('click',()=>selectPic({take:tr.dataset.take})));
  root.querySelectorAll('button[data-a]').forEach(b=>{if(!b.closest('#panel'))b.addEventListener('click',()=>click(b));});
  wireGrid(root,renderTakes);
}
// ---------- record ----------
function readyGaps(){return data.gaps.filter(g=>g.accepted&&!g.recorded&&g.shots.length&&g.shots.every(s=>s.asset||s.takes.some(k=>k.selected)));}
function renderRecord(){
  const d=data, ready=readyGaps();
  const rows=d.gaps.map(g=>'<tr><td><span class="nm">'+esc(g.gap_id)+'</span><div class="ds">'+esc(g.requirement||'')+'</div></td><td class="ds">'+g.shots.map(s=>esc(s.shot_id)+' '+(s.asset?'✓':s.takes.some(k=>k.selected)?'✓':'·')).join(' ')+'</td><td>'+(g.recorded?'<span class="badge ok">recorded</span>':ready.includes(g)?'<span class="badge dec">ready to record</span>':g.accepted?'<span class="badge">in progress</span>':'<span class="badge">not accepted</span>')+'</td></tr>').join('');
  $('s-record').innerHTML='<p class="ds" style="font-size:14px;margin:14px 0 4px">A gap is recorded when every shot has its picture, its sequence or a selected take. Your words at the foot, then Record.</p><table><thead><tr><th>Gap</th><th>Shots</th><th>State</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
// ---------- the footer: the words and the step's action ----------
function footer(){
  const d=data, tray=$('tray'), act_=$('action'), can=d&&d.state==='prepared'&&stage()==='visuals';
  const box='<textarea class="words" id="words" placeholder="your words"></textarea>';
  if(!can){tray.innerHTML='<span>'+(d&&d.run?'The run is at '+esc(d.run.stage)+'.':'')+'</span>';act_.innerHTML='';return;}
  if(step==='treatment'){
    if(d.treatment_draft){tray.innerHTML='<span>Approve the treatment with your own words:</span>'+box;act_.innerHTML='<button class="go" data-a="treatment">Approve the treatment</button>';}
    else{tray.innerHTML='<span>'+(d.treatment?'The treatment is approved.':'The assistant is preparing the treatment.')+'</span>';act_.innerHTML='';}
  }else if(step==='plan'){
    const n=Object.keys(selGaps).length;
    tray.innerHTML='<span>'+(n?n+' gap'+(n>1?'s':'')+' ticked:':'Tick gaps above, then:')+'</span>'+box;
    act_.innerHTML='<button class="go" data-a="accept-selected" '+(n?'':'disabled')+'>Accept</button> <button data-a="revise-selected" '+(n?'':'disabled')+'>Revise</button>';
  }else if(step==='references'&&roundOpen()){   // design/79: one words box and Done for the whole pass
    const rd=roundOpen();
    if(rd.pass===1){const n=Object.keys(rd.elements).length;tray.innerHTML='<span>Done approves the frames and runs the searches you chose.</span>';act_.innerHTML=confirmPicks?'<span>Done with '+n+' element'+(n>1?'s':'')+'?</span> <button data-a="round-picks-back">Back</button> <button class="go" data-a="round-done">Finish</button>':'<button class="go" data-a="round-done">Done ('+n+' element'+(n>1?'s':'')+')</button>';}   // design/110 rule 0: Done asks first
    else{const sids=Object.values(rd.elements).filter(r=>r.search_id).map(r=>r.search_id), n=sids.reduce((k,sid)=>k+((picks[sid]||[]).length),0), kept=($('words')||{}).value||'';
      const notes=sids.reduce((k,sid)=>k+((picks[sid]||[]).filter(p=>String(p.note||'').trim()).length),0);   // design/106 N2, N3
      tray.innerHTML=(n?'<span><b>'+n+'</b> ticked · not saved yet</span>'+tickChips(sids):'<span>Tick the pictures to use.</span>')+'<span class="ds">Picture notes go under each ticked picture.</span><textarea class="words" id="words" placeholder="words for the whole pass (optional)"></textarea>';
      $('words').value=kept;
      act_.innerHTML=confirmPicks?'<span>'+n+' picture'+(n===1?'':'s')+' ticked, '+notes+' note'+(notes===1?'':'s')+': finish pass 2?</span> <button data-a="round-picks-back">Back</button> <button class="go" data-a="round-picks">Finish</button>'
        :'<button class="go" data-a="round-picks">Done</button> <button data-a="round-undo">Undo Done (back to pass 1)</button>';wireChips();}
  }else if(step==='references'){
    const s=selEl?latestSearch(selEl):null, n=s?(picks[s.search_id]||[]).length:0;
    tray.innerHTML='<span>'+esc(selEl||'')+':</span>'+(s&&n?'<span><b>'+n+'</b> ticked · not saved yet</span>'+tickChips([s.search_id]):'');   // design/99 C5
    act_.innerHTML=(s?(n?'<button class="go" data-a="pick" data-search="'+esc(s.search_id)+'">'+'Save '+n+' picture'+(n>1?'s':'')+'</button> <button data-a="clear-ticks" data-search="'+esc(s.search_id)+'">Clear</button> ':'')+'<button data-a="nothing-fits" data-search="'+esc(s.search_id)+'">Nothing fits</button>':'<span class="why">type keywords above and press Search</span>');wireChips();
  }else if(step==='pictures'||step==='takes'){   // design/97 P2: a picture's words go in the panel beside it
    tray.innerHTML='<span>Click a picture or a take: it opens beside the list with its buttons; × or Esc closes it.</span>';act_.innerHTML='';   // design/99 C1, C2
  }else{
    const ready=readyGaps();
    tray.innerHTML='<span>'+(ready.length?ready.length+' gap'+(ready.length>1?'s':'')+' ready:':'No gap is ready to record yet.')+'</span>'+box;
    act_.innerHTML='<button class="go" data-a="record" '+(ready.length?'':'disabled')+'>Record '+(ready.length||'')+' gap'+(ready.length===1?'':'s')+'</button>';
  }
  act_.querySelectorAll('button[data-a]').forEach(b=>b.addEventListener('click',()=>click(b)));
}
// ---------- the clicks: every button calls the server function the vw tool calls ----------
async function click(b){
  const a=b.dataset.a, q=words();
  const need=(text)=>{needWords($('pwords')?'pwords':'words',text);};   // design/97 P1
  if(a==='select'){await send({action:'select',gap_id:b.dataset.gap,choice_id:b.dataset.choice},'Choice recorded.');return;}
  if(a==='treatment'){if(!q){need();return;}await send({action:'treatment',quote:q},'Treatment recorded: the assistant writes the plan.');return;}
  if(a==='accept-selected'){if(!q){need('Your yes for these gaps is required.');return;}const ids=Object.keys(selGaps);if(!ids.length){msg('Tick a gap first.',true);return;}const j=await send({action:'accept',gap_ids:ids,quote:q},ids.length+' gap(s) accepted.');if(j)selGaps={};return;}
  if(a==='revise-selected'){if(!q){need('Say what to change in the box, then Revise.');return;}const ids=Object.keys(selGaps);if(!ids.length){msg('Tick a gap first.',true);return;}for(const gid of ids){const j=await send({action:'revise',gap_id:gid,notes:q,quote:q},gid+' sent back for revision.');if(!j)return;}selGaps={};return;}
  if(a==='approve'||a==='reject'){savingCard(b.dataset.ref);   // design/99 C2, C3: one click; the reason, optional, after it
    const j=await send(a==='approve'?{action:'approve',reference_id:b.dataset.ref,sha256:b.dataset.sha}:{action:'reject',reference_id:b.dataset.ref},a==='approve'?'Picture approved.':'Picture rejected; the next one starts from the approved picture.');
    if(j&&a==='reject'){rejOpen=b.dataset.ref;selPic={ref:b.dataset.ref};renderStep();}
    return;}   // design/95 F3, design/97 A4: the server's next line says where it went
  if(a==='still'){savingCard(b.dataset.ref);await send({action:'still',shot_id:b.dataset.shot,reference_id:b.dataset.ref,...reuseOf(b.dataset.shot)},'Picture held for the shot.');return;}
  if(a==='reject-why'||a==='reject-take-why'){const w=(($('rwhy')||{}).value||'').trim();if(!w){rejOpen=null;renderStep();return;}const id=b.dataset.id;rejOpen=null;
    await send(a==='reject-why'?{action:'reject',reference_id:id,notes:w}:{action:'reject-take',job_id:id,notes:w},'Reason saved: the next one avoids it.');return;}
  if(a==='reason-skip'){rejOpen=null;renderStep();return;}
  if(a==='clip'){const sh=b.dataset.shot, w=(($('cf-w-'+sh)||{}).value||'').trim(), at=($('cf-at-'+sh)||{}).value;   // design/89 B3: the same server function as `vw visuals clip`
    if(at===''||at==null){msg('Say from which second of the clip.',true);return;} if(!w){needWords('cf-w-'+sh,'Your words for this stretch are required.');return;}
    await send({action:'clip',shot_id:sh,clip_id:$('cf-c-'+sh).value,in_s:Number(at),quote:w,...reuseOf(sh)},'Stretch placed for the shot.');return;}
  if(a==='sequence'){await send({action:'sequence',shot_id:b.dataset.shot},'Sequence approved and held.');return;}
  if(a==='fix'){const j=await send({action:'fix',reference_id:b.dataset.ref},'Fix requested.');if(j)msg('Fix requested for \''+(j.for||'')+'\' (₹'+(j.cost_inr||fixPrice())+'); it appears here in about a minute.');return;}   // design/96 X1
  if(a==='unplace'){await send({action:'unplace',shot_id:b.dataset.shot},'Picture taken out of the shot; it stays approved.');return;}   // design/94 L3
  if(a==='select-take'){await send({action:'select-take',job_id:b.dataset.job},'Take selected.');return;}
  if(a==='reject-take'){const j=await send({action:'reject-take',job_id:b.dataset.job},'Take rejected.');if(j){rejOpen=b.dataset.job;renderStep();}return;}
  if(a==='search'){const kw=(($('kw-'+b.dataset.el)||{}).value||'').trim();if(!kw){needWords('kw-'+b.dataset.el,'Two to six words to search for.');return;} await send({action:'search',element_id:b.dataset.el,keywords:kw},'Search done: tick the pictures to use, then Save.');return;}
  if(a==='pick'){const sid=b.dataset.search, list=picks[sid]||[];if(!list.length){msg('Tick at least one picture first.',true);return;}const j=await send({action:'pick',search_id:sid,picks:list},list.length+' picture'+(list.length>1?'s':'')+' saved as references for '+(selEl||'the element')+'; the assistant makes the sheet from them.');if(j){delete picks[sid];if(j.failed&&j.failed.length)msg(j.failed.length+' picture(s) could not be downloaded: '+j.failed.map(f=>f.n+' ('+(f.site||'')+')').join(', ')+'; the rest are kept.',true);}return;}
  if(a==='answer'){await send({action:'answer',item:b.dataset.item,answer:b.dataset.answer},'Answer recorded.');return;}   // design/110 rule 0
  if(a==='round-undo'){await send({action:'round-undo',quote:q},'Done undone: the pass is open again.');return;}
  if(a==='supply'){const el=b.dataset.el, f=($('up-'+el)||{}).files, u=(($('url-'+el)||{}).value||'').trim();   // design/110: the operator's own picture
    if(f&&f.length){const fr=new FileReader();fr.onload=async()=>{await send({action:'supply',element_id:el,name:f[0].name,content_base64:String(fr.result).split(',')[1]},'Your picture is saved and approved for '+el+'.');};fr.readAsDataURL(f[0]);return;}
    if(!u){msg('Choose a file or paste an https link first.',true);return;}
    await send({action:'supply',element_id:el,url:u},'Your picture is saved and approved for '+el+'.');return;}
  if(a==='nothing-fits'){if(!q){need('Say in one line why nothing fits; it becomes the next search.');return;}await send({action:'nothing-fits',search_id:b.dataset.search,reason:q},'Noted; the assistant searches again with your hint.');return;}
  if(a==='approve-spec'){await send({action:'approve-spec',shot_id:b.dataset.shot,quote:''},'Drawing spec approved.');return;}   // design/106 D4: no words for a click
  if(a==='save-note'){await send({action:'note',reference_id:b.dataset.ref,note:(($('ref-note')||{}).value||'').trim()},'Note saved.');return;}   // design/106 N4
  if(a==='approve-specs'){await send({action:'approve-specs',quote:''},'Drawing specs approved.');return;}   // design/106 D5
  if(a==='correct-spec'){const sh=b.dataset.shot,w=(($('sp-c-'+sh)||{}).value||'').trim();if(!w){needWords('sp-c-'+sh,'Say which value is wrong and what it should be.');return;}
    await send({action:'correct-spec',shot_id:sh,words:w},'Correction sent: the assistant revises the spec.');return;}   // design/106 D4
  if(a==='measure'){const sh=b.dataset.shot,sel=$('ms-f-'+sh),q=(($('ms-q-'+sh)||{}).value||'').trim(),refs=sel?[...sel.selectedOptions].map(o=>o.value):[];   // design/89 D2: the same server function as `vw visuals measure`
    if(!refs.length||!q){msg('Pick the footage frames and say what to measure.',true);return;}await send({action:'measure',reference_ids:refs,question:q},'Measured; the sizes are under the spec.');return;}
  if(a==='approve-reuse'){const w=(($('rw-'+b.dataset.shot)||{}).value||'').trim();if(!w){needWords('rw-'+b.dataset.shot,'Say in your words why the same footage is right here.');return;}
    await send({action:'approve-reuse',shot_id:b.dataset.shot,quote:w},'Reuse approved with your words.');return;}
  if(a==='footage'){const w=(($('ftwords')||{}).value||'').trim();const v=k=>(($('ft-'+k)||{}).value||'')||null;   // design/88 F4: the words sit with the button
    if(!v('camera')&&!v('support')&&!v('look')){msg('Choose what to correct first.',true);return;} if(!w){needWords('ftwords','Say in your words what the footage really is.');return;}
    await send({action:'footage',camera:v('camera'),support:v('support'),look:v('look'),quote:w},'Footage corrected: your words win for the rest of the run.');return;}
  if(a==='record'){if(!q){need();return;}await send({action:'record',gap_ids:readyGaps().map(g=>g.gap_id),quote:q},'Gaps recorded.');return;}
  if(a==='clear-ticks'){delete picks[b.dataset.search];renderReferences();footer();return;}   // design/99 C5
  if(a==='round-done'){const rd=roundOpen();if(!rd)return;   // design/99 C6: the click approves
    if(!confirmPicks){confirmPicks=true;footer();return;}   // design/110 rule 0: Done asks first
    confirmPicks=false;
    const verdicts={};Object.keys(rd.elements).forEach(eid=>{const v=document.querySelector('input[name="v-'+eid+'"]:checked');const kw=document.querySelector('input.kw[data-el="'+eid+'"]');verdicts[eid]={verdict:v?v.value:'search',keywords:kw?kw.value.trim():''};});
    const j=await send({action:'round-done',verdicts:verdicts,quote:q},'Pass 1 done: the frames are approved and the searches ran.');
    if(j&&j.errors&&Object.keys(j.errors).length)msg('Some searches failed: '+Object.entries(j.errors).map(([e,w])=>e+' ('+w+')').join('; ')+'. The rest are on pass 2.',true);return;}
  if(a==='round-picks-back'){confirmPicks=false;footer();return;}   // design/106 N3
  if(a==='round-picks'){const rd=roundOpen();if(!rd)return;
    if(!confirmPicks){confirmPicks=true;footer();return;}   // design/106 N3: Done shows the summary first
    confirmPicks=false;
    const pk={};Object.values(rd.elements).filter(r=>r.search_id).forEach(r=>{pk[r.search_id]=picks[r.search_id]||[];});
    const j=await send({action:'round-picks',picks:pk,quote:q},'Pass 2 done: the picked pictures are kept; the assistant generates the sheets.');
    if(j){Object.keys(pk).forEach(s=>delete picks[s]);if(j.failed&&Object.keys(j.failed).length)msg('Some pictures could not be downloaded: '+Object.keys(j.failed).join(', ')+'; the rest are kept.',true);}return;}
}
// ---------- render ----------
function render(){
  if(!step)step=recall('step')||autoStep();
  frame();
  const typed={};document.querySelectorAll('textarea.keep').forEach(t=>typed[t.id]=t.value);   // review 27 Oct: a note or correction being typed survives the redraw
  STEPS.forEach(([k])=>{const sec=$('s-'+k);sec.hidden=(k!==step);if(k!==step)sec.innerHTML='';});   // defect 29: one panel at a time, so its buttons are the wired ones
  if(!data||data.state!=='prepared'){STEPS.forEach(([k])=>$('s-'+k).innerHTML='<div class="empty">Nothing to show yet.</div>');footer();if(stage()==='visuals')schedule(60000);return;}
  if(step==='treatment'){renderTreatment();wireFootage();}if(step==='plan')renderPlan();if(step==='references')renderReferences();if(step==='pictures')renderPictures();if(step==='takes')renderTakes();if(step==='record')renderRecord();
  Object.entries(typed).forEach(([id,v])=>{const t=$(id);if(t&&v)t.value=v;});
  footer();
  const busy=data.references.some(r=>r.status==='generating')||data.gaps.some(g=>g.shots.some(s=>s.takes.some(k=>['queued','running','submitted'].includes(k.status))));
  if(stage()==='visuals')schedule(busy?15000:60000);   // design/74 L29
}
load();
})();
