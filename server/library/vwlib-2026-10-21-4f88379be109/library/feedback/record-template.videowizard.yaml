# One record per VideoWizard output (image, graphic state or take). The library's record-template.yaml plus three fields.
# Written by the VideoWizard server from what it already stores; saved as records/{job_id}-v{nn}.yaml when exported.
app: videowizard              # new: which application made the output
library_version:              # new: the bundle fingerprint from MANIFEST.json, e.g. vwlib-2026-10-21-<12 hex>
run_code:                     # new: the VideoWizard run, e.g. VW-6
job_id:                       # <run_code>-<shot or element>-<reference or job id>
client_code:
date:
playbook:                     # video-frame | video-clip | web-app
playbook_version:
task:                         # continuity-kit | keyframe | first-last-frame | graphic-states | process-explainer | clip-from-frame
model:
settings:                     # size, quality, aspect, resolution, duration, anything sent with the call
inputs:                       # one line per picture sent in
  - picture_id:
    tag:                      # approved | scene | first-frame | last-frame | style | person
    consent_id:
prompt: |

attempt:
trial: false
output_path:                  # the storage key in VideoWizard
checklist:                    # copied from the answer form, one line each
  - line:
    result:                   # pass | fail
    note:
verdict:                      # pass | fix | reject (approve = pass; reject = reject; regenerate = fix)
verdict_by: person            # the operator's yes or no, with their words in VideoWizard
auto_verdict:
what_went_wrong:
what_fixed_it:
suggestion:                   # new: optional; what the assistant thinks the library should say, naming the file and section,
                              # e.g. "playbooks/video-frame.md §7: add 'labels stay inside the reserved band'". Never applied by VideoWizard.
minutes_total:
